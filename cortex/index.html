      const top = Math.pow(10, Math.ceil(Math.log10(maxMs)));
      const floor = 10;
      const pos = (ms) => Math.max(0, Math.min(100, ((Math.log10(Math.max(floor, ms)) - 1) / (Math.log10(top) - 1)) * 100));
      const fmt = (ms) => (ms >= 1000 ? `${chartTrim(ms / 1000)} s` : `${Math.round(ms)} ms`);
      const ticks = [];
      for (let t = floor; t <= top; t *= 10) ticks.push(t);
      return `<div class="chart-ranges">
        ${list.map((r) => {
          const p50 = Number(r.p50Ms) || 0;
          const p95 = Number(r.p95Ms) || 0;
          const p99 = Number(r.p99Ms) || 0;
          const tip = `${r.label}\np50 ${fmt(p50)} · p95 ${fmt(p95)} · p99 ${fmt(p99)}\n${r.count} samples · ${r.errorRatePct}% failed`;
          return `<div class="range-row" tabindex="0" data-tip="${chartEscape(tip)}">
            <div class="hbar-head"><span class="hbar-label mono">${chartEscape(r.label)}</span><span class="hbar-value">${chartEscape(fmt(p50))} · ${chartEscape(fmt(p95))}${Number(r.errorRatePct) > 0 ? ` · ${chartEscape(r.errorRatePct)}% failed` : ''}</span></div>
            <div class="range-track">
              <span class="range-span" style="left:${pos(p50)}%;width:${Math.max(0.6, pos(p95) - pos(p50))}%"></span>
              <span class="range-p99" style="left:${pos(p99)}%"></span>
              <span class="range-dot" style="left:${pos(p50)}%"></span>
            </div>
          </div>`;
        }).join('')}
        <div class="range-axis">${ticks.map((t) => `<span style="left:${pos(t)}%">${chartEscape(fmt(t))}</span>`).join('')}</div>
      </div>`;
    }

    // A small trend line for a headline card; nothing for fewer than two points or all zeros.
    function chartSparkline(values, color = CHART_COLORS.accent) {
      const list = (values || []).map((v) => Number(v) || 0);
      const max = Math.max(0, ...list);
      if (list.length < 2 || max === 0) return '';
      const pts = list.map((v, i) => `${((i / (list.length - 1)) * 100).toFixed(2)},${(22 - (v / max) * 20).toFixed(2)}`);
      return `<svg class="chart-spark" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true">
        <polygon points="0,24 ${pts.join(' ')} 100,24" fill="${chartEscape(color)}" fill-opacity="0.1"></polygon>
        <polyline points="${pts.join(' ')}" fill="none" stroke="${chartEscape(color)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></polyline>
      </svg>`;
    }

    // Phases 3 and 4 (2026-10-30): money, signed amounts, the change against the window before, columns
    // above and below zero, and histograms.

    // A list price in USD: "$4.99", "$1,284", "$12.3K"; a negative amount as "−$5".
    function chartUsd(n) {
      const v = Number(n) || 0;
      const a = Math.abs(v);
      const text = a >= 10000 ? chartCompact(a) : a.toLocaleString('en-US', { minimumFractionDigits: a % 1 ? 2 : 0, maximumFractionDigits: 2 });
      return `${v < 0 ? '−' : ''}$${text}`;
    }

    // An amount with its sign: "+1.2K", "−300", "0".
    function chartSigned(n) {
      const v = Number(n) || 0;
      if (v === 0) return '0';
      return `${v > 0 ? '+' : '−'}${chartCompact(Math.abs(v))}`;
    }

    // 3600 seconds as "1h", 5400 as "1h 30m", 120 as "2m", 45 as "45s".
    function chartDurationShort(seconds) {
      const s = Math.max(0, Math.round(Number(seconds) || 0));
      if (s >= 3600 && s % 3600 === 0) return `${s / 3600}h`;
      if (s >= 60 && s < 3600 && s % 60 === 0) return `${s / 60}m`;
      return chartDuration(s);
    }

    // The change of a headline against the window before of the same length (plan D2): an absolute
    // difference, never a percentage, so a small count reads "+1" and not "+100%". kind: count, pct (a
    // rate in points), duration (seconds), usd. better: 'up', 'down' or null (neither is good). Null
    // when the window before is unknown.
    function chartDelta(current, previous, { kind = 'count', before = 'the window before', better = 'up' } = {}) {
      if (previous == null || current == null || !Number.isFinite(Number(previous)) || !Number.isFinite(Number(current))) return null;
      const diff = Math.round((Number(current) - Number(previous)) * 100) / 100;
      if (diff === 0) return { text: `same as ${before}`, tone: 'neutral' };
      const sign = diff > 0 ? '+' : '−';
      const a = Math.abs(diff);
      const amount = kind === 'pct' ? `${chartTrim(a)} pts`
        : kind === 'duration' ? chartDuration(a)
          : kind === 'usd' ? chartUsd(a)
            : chartCompact(a);
      const tone = better === null ? 'neutral' : (diff > 0) === (better === 'up') ? 'good' : 'bad';
      return { text: `${sign}${amount} vs ${before}`, tone };
    }

    // The change as a badge (text in its tone; the sign and the words carry it, not the colour).
    function chartDeltaBadge(delta) {
      return delta ? `<span class="delta-badge ${chartEscape(delta.tone)}">${chartEscape(delta.text)}</span>` : '';
    }

    // Columns above and below zero per bucket. Each series stacks its positive values up from the zero
    // line and its negative values down (series[0] nearest the line); a tick marks the net. One hit
    // target per column, whose tooltip lists every series that moved and the net.
    function chartDiverging({ buckets, series, height = 180, emptyText = 'Nothing in this window', format = chartSigned }) {
      const n = buckets.starts.length;
      const val = (s, i) => Number(s.values[i]) || 0;
      const ups = Array.from({ length: n }, (_, i) => series.reduce((a, s) => a + Math.max(0, val(s, i)), 0));
      const downs = Array.from({ length: n }, (_, i) => series.reduce((a, s) => a + Math.max(0, -val(s, i)), 0));
      const maxUp = Math.max(0, ...ups);
      const maxDown = Math.max(0, ...downs);
      if (maxUp === 0 && maxDown === 0) return `<div class="chart-empty" style="height:${height}px">${chartEscape(emptyText)}</div>`;
      const top = maxUp > 0 ? chartNiceMax(maxUp) : 0;
      const bottom = maxDown > 0 ? chartNiceMax(maxDown) : 0;
      const span = top + bottom;
      const zero = (bottom / span) * 100;
      const lines = [[100, top], [zero, 0], [0, -bottom]].filter(([pos, v], k) => k === 1 || v !== 0);
      const grid = lines.map(([pos, v]) => `<div class="chart-gridline${v === 0 ? ' chart-zero' : ''}" style="bottom:${pos}%"><span>${chartEscape(v === 0 ? '0' : format(v))}</span></div>`).join('');
      const cols = Array.from({ length: n }, (_, i) => {
        const net = ups[i] - downs[i];
        const moved = series.filter((s) => val(s, i) !== 0);
        const tip = [chartBucketTitle(buckets, i), ...moved.map((s) => `${s.label} ${format(val(s, i))}`), `Net ${format(net)}`].join('\n');
        const seg = (s, v) => `<span class="chart-seg" style="flex-grow:${v};background:${chartEscape(s.color)}"></span>`;
        const up = series.filter((s) => val(s, i) > 0).map((s) => seg(s, val(s, i))).reverse().join('');
        const down = series.filter((s) => val(s, i) < 0).map((s) => seg(s, -val(s, i))).join('');
        return `<div class="chart-col chart-dcol" tabindex="0" data-tip="${chartEscape(tip)}">
          ${up ? `<div class="chart-stack chart-up" style="bottom:${zero}%;height:${(ups[i] / span) * 100}%">${up}</div>` : ''}
          ${down ? `<div class="chart-stack chart-down" style="top:${100 - zero}%;height:${(downs[i] / span) * 100}%">${down}</div>` : ''}
          ${moved.length ? `<i class="chart-net" style="bottom:${zero + (net / span) * 100}%"></i>` : ''}
        </div>`;
      }).join('');
      const labelEvery = Math.max(1, Math.ceil(n / 6));
      const labels = buckets.starts.map((_, i) => (i % labelEvery === (n - 1) % labelEvery
        ? `<span style="left:${((i + 0.5) / n) * 100}%">${chartEscape(chartBucketLabel(buckets, i))}</span>`
        : '')).join('');
      return `<div class="chart chart-columns chart-diverging">
        <div class="chart-plot" style="height:${height}px"><div class="chart-grid">${grid}</div><div class="chart-cols">${cols}</div></div>
        <div class="chart-xlabels">${labels}</div>
      </div>`;
    }

    // A histogram's bin names from its edges (one more bin than edges, as the server counts them):
    // "under 1m", "1m–2m", "1h+". integer: whole-number data, so a bin ends one below the next edge
    // ("1 to 100") and a one-wide bin is its value ("0").
    function chartBinLabels(edges, { format = chartCompact, integer = false } = {}) {
      const list = (edges || []).map(Number);
      if (list.length === 0) return ['All'];
      const labels = [`under ${format(list[0])}`];
      for (let i = 0; i < list.length - 1; i++) {
        const lo = list[i];
        const hi = list[i + 1];
        if (integer && hi - lo === 1) labels.push(format(lo));
        else if (integer) labels.push(`${format(lo)} to ${format(hi - 1)}`);
        else labels.push(`${format(lo)}–${format(hi)}`);
      }
      labels.push(`${format(list[list.length - 1])}+`);
      return labels;
    }

    // A histogram: one column per bin, each labelled under it, on one scale. bins: [{ label, value }].
    function chartBins(bins, { height = 140, color = CHART_COLORS.accent, emptyText = 'Nothing in this window', unitLabel = '' } = {}) {
      const list = bins || [];
      const total = list.reduce((a, b) => a + (Number(b.value) || 0), 0);
      if (total === 0) return `<div class="chart-empty" style="height:${height}px">${chartEscape(emptyText)}</div>`;
      const top = chartNiceMax(Math.max(...list.map((b) => Number(b.value) || 0)));
      const grid = chartTicks(top).map((t) => `<div class="chart-gridline" style="bottom:${(t / top) * 100}%"><span>${chartEscape(chartCompact(t))}</span></div>`).join('');
      const pct = (v) => Math.round((v / total) * 1000) / 10;
      const cols = list.map((b) => {
        const v = Number(b.value) || 0;
        const tip = `${b.label}\n${v}${unitLabel ? ` ${unitLabel}` : ''} · ${pct(v)}%`;
        return `<div class="chart-col" tabindex="0" data-tip="${chartEscape(tip)}"><div class="chart-stack" style="height:${(v / top) * 100}%">${v > 0 ? `<span class="chart-seg" style="flex-grow:1;background:${chartEscape(color)}"></span>` : ''}</div></div>`;
      }).join('');
      const labels = list.map((b) => `<span>${chartEscape(b.label)}</span>`).join('');
      return `<div class="chart chart-bins">
        <div class="chart-plot" style="height:${height}px"><div class="chart-grid">${grid}</div><div class="chart-cols">${cols}</div></div>
        <div class="chart-binlabels">${labels}</div>
      </div>`;
    }

    // A server histogram ({ edges, counts }) as bins with their names.
    function chartHistogramBins(histogram, options = {}) {
      const counts = (histogram && histogram.counts) || [];
      const labels = chartBinLabels((histogram && histogram.edges) || [], options);
      return counts.map((value, i) => ({ label: labels[i] ?? String(i), value: Number(value) || 0 }));
    }

    // Embedded from server/activity.js; activity.test.ts enforces parity.
    const ACTIVITY_STARTUP_SPANS = ['app.cold_start', 'startup.critical_phase', 'startup.preload', 'preload.critical'];
    const ACTIVITY_QUEUE_EVENTS = ['queue.joined', 'matchmaking.started', 'queue.cancelled', 'matchmaking.cancelled', 'queue.matched', 'matchmaking.seated'];
    const ACTIVITY_ITEM_EVENTS = ['character.selected', 'customize.equipped', 'character.expression_changed', 'store.item_previewed', 'store.purchase_completed', 'store.iap_completed', 'store.purchase_abandoned'];
    const ACTIVITY_QUEUE_LIMIT = 20000;

    function activityProps(row) {
      if (row.properties && typeof row.properties === 'object' && !Array.isArray(row.properties)) return row.properties;
      try {
        const parsed = JSON.parse(row.properties_json || '{}');
        return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
      } catch {
        return {};
      }
    }

    // A number sent as a JSON number or a string (iOS sends strings); anything else is 0. The SQL takes
    // the text form against ^\s*[0-9]+(\.[0-9]+)?\s*$.
    function activityNumber(value) {
      if (value == null) return 0;
      const text = String(value);
      return /^\s*[0-9]+(\.[0-9]+)?\s*$/.test(text) ? Number(text) : 0;
    }

    // Text comparison as Postgres orders these ids (code points).
    function activityCompare(a, b) {
      return a < b ? -1 : a > b ? 1 : 0;
    }

    function activityTime(value) {
      const t = Date.parse(value);
      return Number.isFinite(t) ? t : NaN;
    }

    // The sorted value at floor(p * n / 100), rounded (Vitals).
    function activityPercentile(sorted, p) {
      if (sorted.length === 0) return 0;
      return Math.round(sorted[Math.min(sorted.length - 1, Math.floor((p * sorted.length) / 100))]);
    }

    /**
     * The activity totals from rows already narrowed to one environment, the window and the test-traffic
     * rule (the snapshot's, the demo's or the local store's). Platform and version narrow them here, as
     * the SQL does. rows: { sessions, productEvents, spans, hiddenSessions }.
     */
    function buildCortexActivity(rows, options = {}) {
      const hours = Math.min(8760, Math.max(1, Math.round(Number(options.windowHours) || 24)));
      const nowMs = Number.isFinite(options.nowMs) ? options.nowMs : Date.now();
      const cutoff = nowMs - hours * 3600000;
      const platform = options.platform && options.platform !== 'all' ? options.platform : 'all';
      const version = options.appVersion && options.appVersion !== 'all' ? options.appVersion : 'all';
      const onPlatform = (r) => platform === 'all' || r.platform === platform;
      const onVersion = (r) => version === 'all' || r.app_version === version;
      const buckets = chartTimeBuckets(hours, nowMs);
      const timeZone = options.timeZone || Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';

      // Sessions: the platform's rows for the version list; the version's for everything else.
      const vis = (rows.sessions || []).filter((s) => activityTime(s.started_at) >= cutoff && onPlatform(s));
      const cur = vis.filter(onVersion);
      const actorOf = (s) => (s.user_id ? String(s.user_id) : '') || s.install_id || s.session_id;
      const byVersionMap = new Map();
      for (const s of vis) {
        const key = `${s.platform}\u0000${s.app_version}`;
        if (!byVersionMap.has(key)) {
          byVersionMap.set(key, { platform: s.platform, appVersion: s.app_version, sessions: 0, crashed: 0, errors: 0, players: new Set(), durationMsSum: 0 });
        }
        const v = byVersionMap.get(key);
        v.sessions++;
        if (s.status === 'crashed') v.crashed++;
        v.errors += Number(s.errors_count) || 0;
        v.players.add(actorOf(s));
        v.durationMsSum += Number(s.duration_ms) || 0;
      }
      const byVersion = Array.from(byVersionMap.values())
        .map((v) => ({ ...v, players: v.players.size }))
        .sort((a, b) => activityCompare(b.appVersion, a.appVersion) || b.sessions - a.sessions || activityCompare(a.platform, b.platform));
      const { buckets: _sessionBuckets, ...series } = chartActivitySeries(cur, buckets);
      const sessions = {
        total: cur.length,
        crashed: cur.filter((s) => s.status === 'crashed').length,
        errored: cur.filter((s) => Number(s.errors_count) > 0).length,
        players: new Set(cur.map(actorOf)).size,
        crashedPlayers: new Set(cur.filter((s) => s.status === 'crashed').map(actorOf)).size,
        durationMsSum: cur.reduce((a, s) => a + (Number(s.duration_ms) || 0), 0),
        hiddenSessions: Number(rows.hiddenSessions) || 0,
        byVersion,
        series,
      };

      // Spans: start-up time per version (the platform's), and latency per name (platform and version).
      const spanRows = (rows.spans || []).filter((s) => activityTime(s.created_at) >= cutoff && onPlatform(s));
      const startup = new Map();
      for (const s of spanRows) {
        if (!ACTIVITY_STARTUP_SPANS.includes(s.name)) continue;
        if (!startup.has(s.app_version)) startup.set(s.app_version, { sum: 0, count: 0 });
        const g = startup.get(s.app_version);
        g.sum += Number(s.duration_ms) || 0;
        g.count++;
      }
      const startupByVersion = Array.from(startup.entries())
        .map(([appVersion, g]) => ({ appVersion, avgMs: Math.round(g.sum / g.count), count: g.count }))
        .sort((a, b) => activityCompare(b.appVersion, a.appVersion));
      const spanGroups = new Map();
      for (const s of spanRows.filter(onVersion)) {
        if (!spanGroups.has(s.name)) spanGroups.set(s.name, { durations: [], errors: 0, platforms: new Set() });
        const g = spanGroups.get(s.name);
        g.durations.push(Number(s.duration_ms) || 0);
        if (s.status !== 'ok') g.errors++;
        g.platforms.add(s.platform);
      }
      const spans = Array.from(spanGroups.entries()).map(([name, g]) => {
        const sorted = g.durations.slice().sort((a, b) => a - b);
        return {
          name,
          count: sorted.length,
          errors: g.errors,
          platforms: Array.from(g.platforms).sort(activityCompare),
          p50Ms: activityPercentile(sorted, 50),
          p95Ms: activityPercentile(sorted, 95),
          p99Ms: activityPercentile(sorted, 99),
        };
      }).sort((a, b) => b.count - a.count || activityCompare(a.name, b.name));

      const events = activityEvents((rows.productEvents || []).filter((e) => activityTime(e.event_ts) >= cutoff && onPlatform(e) && onVersion(e)), buckets);

      // The window before, of the same length, for the headline changes (plan D2): only when the rows
      // reach back that far (options.previous), else null and the portal shows no change.
      let previous = null;
      if (options.previous) {
        const before = (rows.sessions || []).filter((s) => {
          const t = activityTime(s.started_at);
          return t >= cutoff - hours * 3600000 && t < cutoff && onPlatform(s) && onVersion(s);
        });
        previous = {
          sessions: {
            total: before.length,
            crashed: before.filter((s) => s.status === 'crashed').length,
            errored: before.filter((s) => Number(s.errors_count) > 0).length,
            players: new Set(before.map(actorOf)).size,
            crashedPlayers: new Set(before.filter((s) => s.status === 'crashed').map(actorOf)).size,
            durationMsSum: before.reduce((a, s) => a + (Number(s.duration_ms) || 0), 0),
          },
        };
      }

      return {
        version: 1,
        environment: options.environment || 'production',
        windowHours: hours,
        timeZone,
        includeTest: Boolean(options.includeTest),
        platform,
        appVersion: version,
        generatedAt: nowMs,
        buckets: { unit: buckets.unit, starts: buckets.starts, end: buckets.end },
        sessions,
        startupByVersion,
        events,
        spans,
        previous,
      };
    }

    // Product events: the journey, the home panels, the tables left and why, hands per session and per
    // bucket, character and set events by their raw ids, the queue events themselves and the counts.
    function activityEvents(rows, buckets) {
      const ev = rows.map((r) => {
        const p = activityProps(r);
        const rawMode = String(p.mode ?? 'casual').toLowerCase();
        return {
          row: r,
          name: r.name,
          p,
          userId: r.user_id ? String(r.user_id) : '',
          actor: (r.user_id ? String(r.user_id) : '') || r.install_id || r.session_id || 'anon',
          sk: r.session_id || (r.user_id ? String(r.user_id) : '') || r.install_id || 'anon',
          hands: activityNumber(p.handsPlayed ?? p.hands_played),
          dwell: activityNumber(p.dwellMs ?? p.dwell_ms),
          mode: rawMode === 'tournament' ? 'tourney' : rawMode,
          interacted: p.interacted === true || p.interacted === 'true',
        };
      });
      const distinct = (list) => new Set(list.map((e) => e.actor)).size;
      const explicitPreload = ev.some((e) => e.name === 'preload.completed');
      const explicitAuth = ev.some((e) => e.name === 'auth.completed');
      const home = (e) => e.name === 'scene.viewed' && e.p.scene === 'home';
      const funnel = {
        coldLaunch: distinct(ev),
        preloadComplete: distinct(ev.filter((e) => e.name === 'preload.completed'
          || (!explicitPreload && (e.name === 'realtime.connected' || e.name === 'panel.opened' || home(e))))),
        authComplete: distinct(ev.filter((e) => e.name === 'auth.completed'
          || (!explicitAuth && (e.userId !== '' || e.name === 'realtime.connected' || e.name === 'panel.opened' || home(e))))),
        homeReached: distinct(ev.filter((e) => e.name === 'panel.opened' || home(e))),
        lobbyOpened: distinct(ev.filter((e) => e.name === 'panel.opened' && ['casual', 'ranked', 'tournament'].includes(e.p.panel))),
        queueJoined: distinct(ev.filter((e) => e.name === 'queue.joined' || e.name === 'matchmaking.started')),
        tableSeated: distinct(ev.filter((e) => e.name === 'queue.matched' || e.name === 'matchmaking.seated'
          || (e.name === 'scene.viewed' && ['casualGame', 'rankedGame'].includes(e.p.scene)))),
        handCompleted: distinct(ev.filter((e) => e.name === 'hand.completed' || (e.name === 'table.left' && e.hands > 0))),
        playAgain: distinct(ev.filter((e) => e.name === 'game_summary.action'
          && ['play_again', 'requeue'].includes(String(e.p.exitChoice ?? e.p.exit_choice ?? e.p.action ?? '')))),
      };

      // A panel's opens are its open events (a close with no open in the window counts one); its players
      // are those who opened it (who closed it, when nobody's open is in the window).
      const panelMap = new Map();
      for (const e of ev) {
        if (e.name !== 'panel.opened' && e.name !== 'panel.closed') continue;
        const panel = e.p.panel == null ? '' : String(e.p.panel);
        if (panel === '') continue;
        if (!panelMap.has(panel)) panelMap.set(panel, { opened: 0, closed: 0, openers: new Set(), all: new Set(), dwellMsSum: 0, dwellCount: 0, interacted: 0 });
        const m = panelMap.get(panel);
        m.all.add(e.actor);
        if (e.name === 'panel.opened') {
          m.opened++;
          m.openers.add(e.actor);
        } else {
          m.closed++;
          if (e.dwell > 0) { m.dwellMsSum += e.dwell; m.dwellCount++; }
          if (e.interacted || e.dwell >= 4500) m.interacted++;
        }
      }
      const panels = Array.from(panelMap.entries()).map(([panel, m]) => ({
        panel,
        opens: Math.max(m.opened, Math.min(m.closed, 1)),
        players: m.opened > 0 ? m.openers.size : m.all.size,
        dwellMsSum: m.dwellMsSum,
        dwellCount: m.dwellCount,
        interacted: m.interacted,
      })).sort((a, b) => activityCompare(a.panel, b.panel));

      // Tables left per mode, and why (an unknown reason is a voluntary leave).
      const tableMap = new Map();
      const leaveReasons = { voluntary: 0, busted_chips: 0, timeout_kicked: 0, disconnected: 0 };
      for (const e of ev) {
        if (e.name !== 'table.left') continue;
        if (['casual', 'ranked', 'tourney'].includes(e.mode)) {
          if (!tableMap.has(e.mode)) tableMap.set(e.mode, { mode: e.mode, tables: 0, hands: 0 });
          const t = tableMap.get(e.mode);
          t.tables++;
          t.hands += e.hands;
        }
        const reason = e.p.reason == null ? null : String(e.p.reason).toLowerCase();
        if (reason === 'busted_chips' || reason === 'timeout_kicked' || reason === 'disconnected') leaveReasons[reason]++;
        else leaveReasons.voluntary++;
      }
      const tables = Array.from(tableMap.values()).sort((a, b) => activityCompare(a.mode, b.mode));

      // Hands completed per session: its hand events, or what its table leaves report, whichever is more.
      const perSession = new Map();
      for (const e of ev) {
        if (e.name !== 'hand.completed' && e.name !== 'table.left') continue;
        if (!perSession.has(e.sk)) perSession.set(e.sk, { completed: 0, left: 0 });
        const s = perSession.get(e.sk);
        if (e.name === 'hand.completed') s.completed++;
        else s.left += e.hands;
      }
      let handsCompleted = 0;
      for (const s of perSession.values()) handsCompleted += Math.max(s.completed, s.left);

      const count = (names) => ev.filter((e) => names.includes(e.name)).length;
      const counts = {
        turnTimeouts: count(['turn.timeout']),
        insufficientFunds: count(['economy.insufficient_funds']),
        purchaseAbandoned: count(['store.purchase_abandoned']),
        realtimeDisconnects: count(['realtime.disconnected', 'realtime.reconnect_exhausted']),
        realtimeStateFallbacks: count(['realtime.state_fallback']),
      };

      // Character and set events by the character (the id before its first underscore) and the raw set
      // or item id; the portal reads the set word out of it.
      const itemMap = new Map();
      for (const e of ev) {
        if (!ACTIVITY_ITEM_EVENTS.includes(e.name)) continue;
        const character = String(e.p.characterId ?? e.p.character_id ?? e.p.itemId ?? e.p.item_id ?? '').toLowerCase().split('_')[0];
        const set = e.name === 'character.expression_changed'
          ? String(e.p.setKey ?? e.p.set_key ?? 'default').toLowerCase()
          : String(e.p.setKey ?? e.p.set_key ?? e.p.itemId ?? e.p.item_id ?? '').toLowerCase();
        const key = `${e.name}\u0000${character}\u0000${set}`;
        if (!itemMap.has(key)) itemMap.set(key, { name: e.name, character, set, count: 0 });
        itemMap.get(key).count++;
      }
      const items = Array.from(itemMap.values())
        .sort((a, b) => activityCompare(a.name, b.name) || activityCompare(a.character, b.character) || activityCompare(a.set, b.set));

      const { buckets: _handBuckets, ...handSeries } = chartHandSeries(rows, buckets);

      const queue = rows.filter((r) => ACTIVITY_QUEUE_EVENTS.includes(r.name))
        .map((r) => ({
          name: r.name, environment: r.environment, platform: r.platform, user_id: r.user_id ?? null,
          session_id: r.session_id ?? null, install_id: r.install_id ?? null, event_ts: r.event_ts, properties: activityProps(r),
        }))
        .sort((a, b) => activityTime(b.event_ts) - activityTime(a.event_ts));
      const queueEvents = queue.slice(0, ACTIVITY_QUEUE_LIMIT).reverse();

      return {
        total: ev.length,
        actors: distinct(ev),
        sessions: new Set(rows.map((r) => r.session_id).filter(Boolean)).size,
        funnel,
        panels,
        tables,
        leaveReasons,
        handsCompleted,
        counts,
        items,
        handSeries,
        queueEvents,
        queueEventsTruncated: queue.length > ACTIVITY_QUEUE_LIMIT,
      };
    }

    // Embedded from server/demoTotals.js; demoTotals.test.ts enforces parity.
    const DEMO_STORE_ITEMS = [
      ['skins', 'frame_hearts'], ['sets', 'diego_set2'], ['skins', 'table_clubs'], ['parts', 'priya_set1_hair_front_1'],
      ['collections', 'collection_suits'], ['parts', 'rafael_spades_tunic_1'], ['skins', 'frame_spades'],
    ];
    const DEMO_PRODUCTS = [
      ['com.minamopoker.tier1', 'Starter Bundle', 0.99], ['com.minamopoker.tier2', 'Bronze Bundle', 4.99],
      ['com.minamopoker.tier3', 'Silver Bundle', 9.99], ['com.minamopoker.tier4', 'Gold Bundle', 19.99],
    ];
    const DEMO_PLAYERS = ['lucky_otter', 'brave_heron', 'quiet_fox', 'bold_lynx', 'swift_crane', 'calm_badger', 'wild_raven', 'sly_marten'];
    const DEMO_STAKES = [
      ['casual', 'Casual', 10, 20, 'medium', -18], ['low', 'Low', 25, 50, 'medium', -26],
      ['mid', 'Mid', 100, 200, 'hard', -41], ['high', 'High', 500, 1000, 'hard', -55], ['elite', 'Elite', 2500, 5000, 'expert', -70],
    ];

    // A small seeded generator (mulberry32): the same seed gives the same draws.
    function demoRandom(seed) {
      let t = seed >>> 0;
      return () => {
        t = (t + 0x6d2b79f5) >>> 0;
        let r = Math.imul(t ^ (t >>> 15), 1 | t);
        r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
        return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
      };
    }

    // One value per bucket around a daily rate (an hour gets a 24th), drawn from the bucket's hours.
    function demoSeries(buckets, perDay, spread, seed, chance = 1) {
      const hourly = buckets.unit === 'hour';
      return buckets.starts.map((start, i) => {
        const end = i + 1 < buckets.starts.length ? buckets.starts[i + 1] : buckets.end;
        let total = 0;
        for (let h = Math.floor(start / 3600000); h < Math.floor(end / 3600000); h++) {
          const rnd = demoRandom(h * 97 + seed);
          if (rnd() > chance) continue;
          total += (perDay / 24 / chance) * (1 - spread + 2 * spread * rnd());
        }
        return Math.round(hourly ? total : total);
      });
    }

    const demoSum = (values) => values.reduce((a, b) => a + b, 0);

    // The window's buckets and the window before's, the same hours earlier.
    function demoWindows(options) {
      const hours = Math.min(8760, Math.max(1, Math.round(Number(options.windowHours) || 24)));
      const nowMs = Number.isFinite(options.nowMs) ? options.nowMs : Date.now();
      return { hours, nowMs, buckets: chartTimeBuckets(hours, nowMs), before: chartTimeBuckets(hours, nowMs - hours * 3600000) };
    }

    // The economy's flows (signed chips per bucket) for one set of buckets.
    function demoFlows(buckets) {
      const net = (perDay, swing, seed) => demoSeries(buckets, swing, 1, seed).map((v, i) => v - demoSeries(buckets, swing - perDay, 1, seed + 1)[i]);
      return {
        spins: demoSeries(buckets, 28000, 0.4, 11),
        bonus: demoSeries(buckets, 5000, 0.5, 12, 0.3),
        purchased: demoSeries(buckets, 30000, 0.2, 13, 0.08),
        signup: demoSeries(buckets, 4, 0.3, 14, 0.15).map((v) => v * 10000),
        store_skins: demoSeries(buckets, 42000, 0.6, 15, 0.4).map((v) => -v),
        store_sets: demoSeries(buckets, 26000, 0.6, 16, 0.25).map((v) => -v),
        store_parts: demoSeries(buckets, 14000, 0.6, 17, 0.35).map((v) => -v),
        store_collections: demoSeries(buckets, 6000, 0.6, 18, 0.1).map((v) => -v),
        casual: net(-3000, 16000, 19),
        ranked: net(-6000, 9000, 21),
        tourney: net(-800, 3000, 23),
        transfer: demoSeries(buckets, 4000, 0.5, 25, 0.05),
      };
    }

    function demoTotals(flows, players, newAccounts) {
      let created = 0;
      let removed = 0;
      for (const values of Object.values(flows)) {
        const total = demoSum(values);
        if (total > 0) created += total;
        else removed -= total;
      }
      return { created, removed, net: created - removed, activePlayers: players, newAccounts };
    }

    /** The demo's Economy totals: get_cortex_economy's shape for the window. */
    function demoEconomy(options = {}) {
      const { hours, nowMs, buckets, before } = demoWindows(options);
      const flowsNow = demoFlows(buckets);
      const flowsBefore = demoFlows(before);
      const scale = Math.max(1, hours / 24);
      const players = Math.round(18 * Math.sqrt(scale));
      const newAccounts = Math.round(demoSum(flowsNow.signup) / 10000);
      const flows = Object.entries(flowsNow).filter(([, values]) => values.some((v) => v !== 0)).map(([flow, values]) => ({
        flow,
        amount: demoSum(values),
        count: flow === 'signup' ? newAccounts : values.filter((v) => v !== 0).length * 3,
        players: flow === 'signup' ? 0 : Math.min(players, values.filter((v) => v !== 0).length + 2),
        series: values,
      })).sort((a, b) => (a.flow < b.flow ? -1 : 1));
      const storeSpent = -['store_skins', 'store_sets', 'store_parts', 'store_collections'].reduce((a, k) => a + demoSum(flowsNow[k]), 0);
      // Purchases per bucket and store, each at one pack's list price, so every total agrees.
      const packs = (values, seed) => values.map((count, i) => {
        let usd = 0;
        for (let k = 0; k < count; k++) usd += DEMO_PRODUCTS[Math.floor(demoRandom(seed + i * 13 + k)() * DEMO_PRODUCTS.length)][2];
        return Math.round(usd * 100) / 100;
      });
      const iosCount = demoSeries(buckets, 3, 0.5, 31, 0.15);
      const androidCount = demoSeries(buckets, 2, 0.5, 33, 0.12);
      const ios = packs(iosCount, 310);
      const android = packs(androidCount, 330);
      const purchases = demoSum(iosCount) + demoSum(androidCount);
      const revenueUsd = Math.round((demoSum(ios) + demoSum(android)) * 100) / 100;
      const usd = (values) => Math.round(demoSum(values) * 100) / 100;
      const store = (count, values) => ({
        purchases: demoSum(count), buyers: Math.round(demoSum(count) * 0.8), grossUsd: usd(values),
        refunds: 0, refundedUsd: 0, revenueUsd: usd(values),
      });
      const beforeIos = demoSeries(before, 3, 0.5, 35, 0.15);
      const beforeAndroid = demoSeries(before, 2, 0.5, 37, 0.12);
      const beforeCount = beforeIos.map((v, i) => v + beforeAndroid[i]);
      const previousRevenue = Math.round((usd(packs(beforeIos, 350)) + usd(packs(beforeAndroid, 370))) * 100) / 100;
      return {
        version: 1,
        windowHours: hours,
        timeZone: options.timeZone || 'UTC',
        includeTest: Boolean(options.includeTest),
        generatedAt: nowMs,
        buckets: { unit: buckets.unit, starts: buckets.starts, end: buckets.end },
        flows,
        totals: demoTotals(flowsNow, players, newAccounts),
        store: {
          spent: storeSpent,
          purchases: Math.max(1, Math.round(storeSpent / 9000)),
          buyers: Math.max(1, Math.round(storeSpent / 25000)),
          items: DEMO_STORE_ITEMS.map(([kind, item], i) => ({
            kind, item, count: Math.max(1, Math.round((storeSpent / 60000) / (i + 1))),
            chips: Math.round(storeSpent / (2 ** (i + 1))), buyers: Math.max(1, Math.round((storeSpent / 90000) / (i + 1))),
          })).filter((x) => x.chips > 0),
        },
        money: {
          purchases,
          buyers: Math.max(0, Math.round(purchases * 0.7)),
          grossUsd: revenueUsd,
          refunds: 0,
          refundedUsd: 0,
          revenueUsd,
          hiddenTestPurchases: options.includeTest ? 0 : 3,
          byProduct: DEMO_PRODUCTS.flatMap(([productId, name, priceUsd]) => [['ios', iosCount, 310], ['android', androidCount, 330]].map(([platform, counts, base]) => {
            const n = counts.reduce((a, c, i) => a + Array.from({ length: c }, (_, k) => DEMO_PRODUCTS[Math.floor(demoRandom(base + i * 13 + k)() * DEMO_PRODUCTS.length)][0])
              .filter((id) => id === productId).length, 0);
            return { productId, name, priceUsd, platform, purchases: n, buyers: Math.max(1, Math.round(n * 0.8)), revenueUsd: Math.round(n * priceUsd * 100) / 100 };
          })).filter((p) => p.purchases > 0),
          byPlatform: { ios: store(iosCount, ios), android: store(androidCount, android) },
          series: { ios, android, purchases: iosCount.map((v, i) => v + androidCount[i]) },
        },
        tokens: [
          { tokenType: 'clubs', reason: 'win', count: Math.round(4 * scale), amount: Math.round(8 * scale), players: 3 },
          { tokenType: 'clubs', reason: 'prize', count: Math.round(3 * scale), amount: Math.round(3 * scale), players: 3 },
          { tokenType: 'hearts', reason: 'purchase', count: Math.round(2 * scale), amount: -Math.round(4 * scale), players: 2 },
          { tokenType: 'spades', reason: 'exchange', count: 2, amount: -6, players: 1 },
          { tokenType: 'hearts', reason: 'exchange', count: 2, amount: 2, players: 1 },
        ],
        wealth: {
          players,
          median: 38500,
          histogram: { edges: [1000, 10000, 100000, 1000000], counts: [Math.round(players * 0.12), Math.round(players * 0.3), Math.round(players * 0.4), Math.round(players * 0.15), Math.round(players * 0.03)] },
          cheapestBuyIn: 1000,
          underCheapestBuyIn: Math.round(players * 0.12),
        },
        perPlayerDay: {
          playerDays: Math.round(players * Math.min(scale, 7)),
          up: Math.round(players * Math.min(scale, 7) * 0.45),
          down: Math.round(players * Math.min(scale, 7) * 0.5),
          p10: -9200, p25: -2600, p50: 300, p75: 2400, p90: 7800,
          tables: { playerDays: Math.round(players * Math.min(scale, 7) * 0.8), up: Math.round(players * 0.35), down: Math.round(players * 0.5), p25: -3100, p50: -400, p75: 1900 },
        },
        previous: {
          ...demoTotals(flowsBefore, Math.round(players * 0.92), Math.round(demoSum(flowsBefore.signup) / 10000)),
          storeSpent: -['store_skins', 'store_sets', 'store_parts', 'store_collections'].reduce((a, k) => a + demoSum(flowsBefore[k]), 0),
          purchases: demoSum(beforeCount),
          buyers: Math.round(demoSum(beforeCount) * 0.7),
          revenueUsd: previousRevenue,
          byPlatform: {
            ios: { purchases: demoSum(beforeIos), buyers: Math.round(demoSum(beforeIos) * 0.8), revenueUsd: usd(packs(beforeIos, 350)) },
            android: { purchases: demoSum(beforeAndroid), buyers: Math.round(demoSum(beforeAndroid) * 0.8), revenueUsd: usd(packs(beforeAndroid, 370)) },
          },
        },
      };
    }

    /** The demo's Games totals: get_cortex_play's shape for the window. */
    function demoPlay(options = {}) {
      const { hours, nowMs, buckets, before } = demoWindows(options);
      const scale = Math.max(1, hours / 24);
      const series = {
        casual: demoSeries(buckets, 42, 0.5, 41),
        ranked: demoSeries(buckets, 16, 0.5, 43),
        tourney: demoSeries(buckets, 6, 0.6, 45, 0.6),
        hands: demoSeries(buckets, 640, 0.4, 47),
      };
      const beforeGames = demoSum(demoSeries(before, 42, 0.5, 41)) + demoSum(demoSeries(before, 16, 0.5, 43)) + demoSum(demoSeries(before, 6, 0.6, 45, 0.6));
      const games = { casual: demoSum(series.casual), ranked: demoSum(series.ranked), tourney: demoSum(series.tourney) };
      const hands = demoSum(series.hands);
      const players = Math.round(18 * Math.sqrt(scale));
      const share = (n, parts) => parts.map((p) => Math.round(n * p));
      const flows = demoFlows(buckets);
      const lists = DEMO_PLAYERS.map((username, i) => {
        const rnd = demoRandom(i * 7 + 3);
        const casual = Math.round((rnd() - 0.6) * 40000 * Math.sqrt(scale));
        const ranked = Math.round((rnd() - 0.55) * 12000 * Math.sqrt(scale));
        const tourney = Math.round((rnd() - 0.5) * 4000);
        return {
          userId: `demo-player-${i + 1}`, username, games: Math.round((12 - i) * Math.sqrt(scale)),
          tableSec: Math.round((7200 - i * 700) * Math.sqrt(scale)), hands: Math.round((240 - i * 24) * Math.sqrt(scale)),
          handsWon: Math.round((60 - i * 6) * Math.sqrt(scale)), netChips: casual + ranked + tourney, casual, ranked, tourney,
        };
      });
      return {
        version: 1,
        environment: options.environment || 'demo',
        windowHours: hours,
        timeZone: options.timeZone || 'UTC',
        includeTest: Boolean(options.includeTest),
        generatedAt: nowMs,
        buckets: { unit: buckets.unit, starts: buckets.starts, end: buckets.end },
        players,
        games: {
          casual: { games: games.casual, tables: Math.round(games.casual * 0.7), players: Math.round(players * 0.9) },
          ranked: { games: games.ranked, tables: Math.round(games.ranked / 2.4), players: Math.round(players * 0.5) },
          tourney: { games: games.tourney, tables: Math.round(games.tourney / 2), players: Math.round(players * 0.3) },
        },
        hands: {
          casual: { playerHands: Math.round(hands * 0.7), hands: Math.round(hands * 0.62), won: Math.round(hands * 0.17), lost: Math.round(hands * 0.21), folded: Math.round(hands * 0.32) },
          ranked: { playerHands: Math.round(hands * 0.22), hands: Math.round(hands * 0.2), won: Math.round(hands * 0.05), lost: Math.round(hands * 0.06), folded: Math.round(hands * 0.11) },
          tourney: { playerHands: Math.round(hands * 0.08), hands: Math.round(hands * 0.07), won: Math.round(hands * 0.02), lost: Math.round(hands * 0.02), folded: Math.round(hands * 0.04) },
        },
        series,
        lengths: {
          all: { count: games.casual + games.ranked + games.tourney, medianSec: 540, histogram: { edges: [60, 120, 300, 600, 1200, 1800, 3600], counts: share(games.casual + games.ranked + games.tourney, [0.04, 0.12, 0.24, 0.22, 0.18, 0.09, 0.08, 0.03]) } },
          casual: { count: games.casual, medianSec: 780, histogram: { edges: [60, 120, 300, 600, 1200, 1800, 3600], counts: share(games.casual, [0.05, 0.08, 0.18, 0.22, 0.22, 0.12, 0.09, 0.04]) } },
          ranked: { count: games.ranked, medianSec: 150, histogram: { edges: [60, 120, 300, 600, 1200, 1800, 3600], counts: share(games.ranked, [0.05, 0.3, 0.45, 0.15, 0.05, 0, 0, 0]) } },
          tourney: { count: games.tourney, medianSec: 240, histogram: { edges: [60, 120, 300, 600, 1200, 1800, 3600], counts: share(games.tourney, [0.1, 0.25, 0.35, 0.2, 0.1, 0, 0, 0]) } },
        },
        tableTime: {
          players, medianSecPerPlayer: Math.round(1900 * Math.sqrt(scale)), totalSec: Math.round(players * 2600 * Math.sqrt(scale)),
          playerDays: Math.round(players * Math.min(scale, 7) * 0.8), p25: 600, p50: 1500, p75: 3300, p90: 6100,
          histogram: { edges: [300, 900, 1800, 3600, 7200], counts: share(Math.round(players * Math.min(scale, 7) * 0.8), [0.14, 0.24, 0.24, 0.2, 0.12, 0.06]) },
        },
        appSessions: { count: Math.round(70 * scale), medianSec: 410, histogram: { edges: [60, 300, 900, 1800, 3600], counts: share(Math.round(70 * scale), [0.18, 0.26, 0.28, 0.15, 0.09, 0.04]) } },
        netPerHand: { edges: [-10000, -1000, -100, 0, 1, 101, 1001, 10001], counts: share(hands, [0.005, 0.06, 0.18, 0.31, 0.12, 0.12, 0.15, 0.05, 0.005]) },
        ranked: {
          places: [
            { seats: 3, placement: 1, count: Math.round(games.ranked * 0.2) }, { seats: 3, placement: 2, count: Math.round(games.ranked * 0.18) },
            { seats: 3, placement: 3, count: Math.round(games.ranked * 0.17) }, { seats: 5, placement: 1, count: Math.round(games.ranked * 0.1) },
            { seats: 5, placement: 2, count: Math.round(games.ranked * 0.09) }, { seats: 5, placement: 3, count: Math.round(games.ranked * 0.09) },
            { seats: 5, placement: 4, count: Math.round(games.ranked * 0.08) }, { seats: 5, placement: 5, count: Math.round(games.ranked * 0.09) },
          ],
          mmrChange: { count: games.ranked, median: 4, histogram: { edges: [-40, -20, -10, 0, 1, 11, 21, 41], counts: share(games.ranked, [0.02, 0.12, 0.16, 0.18, 0.06, 0.16, 0.14, 0.12, 0.04]) } },
        },
        tourney: {
          entries: games.tourney, finished: Math.max(0, games.tourney - 1), costChips: games.tourney * 4000,
          prizeTokens: Math.round(games.tourney / 2) * 2 + Math.round(games.tourney / 3), prizeChips: games.tourney * 2200, entriesReturned: Math.round(games.tourney / 2) + Math.round(games.tourney / 3),
          places: [1, 2, 3].map((placement) => ({ placement, count: Math.round(games.tourney / (placement + 1)), tokens: placement === 1 ? Math.round(games.tourney / 2) * 2 : placement === 2 ? Math.round(games.tourney / 3) : 0 })),
        },
        house: {
          casual: { net: demoSum(flows.casual), series: flows.casual },
          ranked: { net: demoSum(flows.ranked), series: flows.ranked },
          tourney: { net: demoSum(flows.tourney), series: flows.tourney },
        },
        botsVsPlayers: DEMO_STAKES.map(([stake, name, smallBlind, bigBlind, botDifficulty, bb], i) => {
          const n = Math.round((hands * 0.5) / (2 ** (i + 1)));
          return {
            stake, name, smallBlind, bigBlind, botDifficulty, players: Math.max(1, Math.round(players / (i + 2))),
            playersUp: Math.max(0, Math.round(players / (i + 4))), playersDown: Math.max(1, Math.round(players / (i + 3))),
            hands: n, avgDealt: 3.4, netChips: Math.round((bb / 100) * n * bigBlind), bbPer100: bb, ci95: n > 1 ? Math.round(1960 / Math.sqrt(n)) : null,
            handsWonPct: 21.5 - i,
          };
        }).filter((s) => s.hands > 0),
        lists: {
          mostActive: lists.slice(0, 8),
          winners: lists.filter((p) => p.netChips > 0).sort((a, b) => b.netChips - a.netChips),
          losers: lists.filter((p) => p.netChips < 0).sort((a, b) => a.netChips - b.netChips),
        },
        previous: {
          players: Math.round(players * 0.94),
          games: beforeGames,
          playerHands: Math.round(demoSum(demoSeries(before, 640, 0.4, 47)) * 1),
          handsWon: Math.round(demoSum(demoSeries(before, 640, 0.4, 47)) * 0.24),
          medianGameSec: 500,
          medianSecPerPlayer: Math.round(1800 * Math.sqrt(scale)),
        },
      };
    }

    // Players, Games and Economy from the activity totals: the view the portal drew from rows before
    // phase 2. Queue attempts come from the queue events through aggregateQueueAttempts, the one rule.
    function radarFromActivity(act, newPlayers) {
      const e = act.events;
      const queueAttempts = aggregateQueueAttempts(e.queueEvents || []);
      const totalUsers = Math.max(1, Number(e.actors) || 0);
      const panelsByKey = new Map((e.panels || []).map(p => [p.panel, p]));
      const featureLeaderboard = Object.entries(ALL_HOME_PANELS_META).map(([panelKey, meta]) => {
        const m = panelsByKey.get(panelKey) || { opens: 0, players: 0, dwellMsSum: 0, dwellCount: 0, interacted: 0 };
        const opens = Number(m.opens) || 0;
        const users = Number(m.players) || 0;
        const dauSharePct = Number(((users / totalUsers) * 100).toFixed(1));
        const avgDwellSec = Number(m.dwellCount) > 0 ? Number((Number(m.dwellMsSum) / Number(m.dwellCount) / 1000).toFixed(1)) : 0;
        const interactionRatePct = opens > 0 ? Number(((Number(m.interacted) / opens) * 100).toFixed(1)) : 0;
        const opensPerUser = users > 0 ? Number((opens / users).toFixed(1)) : 0;
        let status = 'healthy';
        if (dauSharePct >= 45 && interactionRatePct >= 65) status = 'loved';
        else if (dauSharePct < 12) status = 'ignored';
        else if (dauSharePct < 25 || interactionRatePct < 45) status = 'underused';
        return { panelKey, label: meta.label, group: meta.group, opens, opensPerUser, uniqueUsers: users, dauSharePct, avgDwellSec, interactionRatePct, status };
      }).sort((a, b) => b.dauSharePct - a.dauSharePct || b.opens - a.opens);

      const tablesByMode = new Map((e.tables || []).map(t => [t.mode, t]));
      const gameModes = ['casual', 'ranked', 'tourney'].map(mode => {
        const st = queueAttempts[mode];
        const t = tablesByMode.get(mode) || { tables: 0, hands: 0 };
        const tables = Number(t.tables) || 0;
        return {
          ...st,
          mode,
          queueJoins: st.queueJoins,
          cancelRatePct: st.queueJoins > 0 ? Number(((st.queueCancels / st.queueJoins) * 100).toFixed(1)) : 0,
          avgWaitSec: (st.queueMatches + st.queueCancels) > 0 ? Number((st.totalWaitMs / (st.queueMatches + st.queueCancels) / 1000).toFixed(1)) : 0,
          aiFallbackPct: st.queueMatches > 0 ? Number(((st.aiFallbackMatches / st.queueMatches) * 100).toFixed(1)) : 0,
          avgHandsPerSession: tables > 0 ? Number((Number(t.hands) / tables).toFixed(1)) : 0,
        };
      });

      // Characters and sets from the grouped item events: the character before its first underscore,
      // the set word read out of the raw set or item id.
      const characterCounts = new Map([['anya', 0], ['amara', 0], ['brutus', 0], ['lenny', 0]]);
      const showroom = new Map(Array.from(characterCounts.keys(), c => [c, { previews: 0, purchases: 0, abandons: 0 }]));
      const expressionSetCounts = new Map([['default', 0], ['set1', 0], ['set2', 0], ['spades', 0], ['hearts', 0], ['diamonds', 0], ['clubs', 0]]);
      const setWord = (raw) => String(raw || '').toLowerCase().split(/[_-\s]+/).find(p => expressionSetCounts.has(p)) || null;
      for (const item of e.items || []) {
        const n = Number(item.count) || 0;
        const word = item.name === 'character.expression_changed'
          ? (expressionSetCounts.has(item.set) ? item.set : null)
          : item.name === 'store.purchase_abandoned' ? null : setWord(item.set);
        if (word) expressionSetCounts.set(word, expressionSetCounts.get(word) + n);
        if (!characterCounts.has(item.character)) continue;
        if (item.name === 'character.selected' || item.name === 'customize.equipped') characterCounts.set(item.character, characterCounts.get(item.character) + n);
        else if (item.name === 'store.item_previewed') showroom.get(item.character).previews += n;
        else if (item.name === 'store.purchase_completed' || item.name === 'store.iap_completed') showroom.get(item.character).purchases += n;
        else if (item.name === 'store.purchase_abandoned') showroom.get(item.character).abandons += n;
      }
      const totalCharSel = Math.max(1, Array.from(characterCounts.values()).reduce((a, b) => a + b, 0));
      const characterPopularity = Array.from(characterCounts.entries()).map(([characterId, count]) => ({
        characterId, count, sharePct: Number(((count / totalCharSel) * 100).toFixed(1)),
      })).sort((a, b) => b.count - a.count);
      const characterShowroom = Array.from(showroom.entries()).map(([characterId, sr]) => {
        const sharePct = characterPopularity.find(c => c.characterId === characterId)?.sharePct ?? 0;
        return {
          characterId,
          equippedCount: characterCounts.get(characterId) ?? 0,
          sharePct,
          equippedSharePct: sharePct,
          previews: sr.previews,
          purchases: sr.purchases,
          abandons: sr.abandons,
          conversionPct: sr.previews > 0 ? Number(((sr.purchases / sr.previews) * 100).toFixed(1)) : 0,
        };
      }).sort((a, b) => b.equippedCount - a.equippedCount);
      const totalExprSel = Math.max(1, Array.from(expressionSetCounts.values()).reduce((a, b) => a + b, 0));
      const expressionPopularity = Array.from(expressionSetCounts.entries()).map(([setKey, count]) => ({
        setKey, count, sharePct: Number(((count / totalExprSel) * 100).toFixed(1)),
      })).sort((a, b) => b.count - a.count);

      const f = e.funnel || {};
      const topFunnelCount = Math.max(1, Number(f.coldLaunch) || 0);
      const journeyFunnel = [
        { step: 'App Launch', users: f.coldLaunch },
        { step: 'Assets Preloaded', users: f.preloadComplete },
        { step: 'Authenticated', users: f.authComplete },
        { step: 'Home Reached', users: f.homeReached },
        { step: 'Lobby Opened', users: f.lobbyOpened },
        { step: 'Queue Joined', users: f.queueJoined },
        { step: 'Seated at Table', users: f.tableSeated },
        { step: 'Completed 1+ Hands', users: f.handCompleted },
        { step: 'Tapped Play Again', users: f.playAgain },
      ].map((s, idx, arr) => {
        const users = Number(s.users) || 0;
        const prev = idx > 0 ? Number(arr[idx - 1].users) || 0 : 0;
        return {
          step: s.step,
          users,
          conversionFromStartPct: Number(((users / topFunnelCount) * 100).toFixed(1)),
          dropOffFromPrevPct: idx > 0 && prev > 0 ? Number((((prev - users) / prev) * 100).toFixed(1)) : 0,
        };
      });

      const reasons = e.leaveReasons || {};
      const leaveKeys = ['voluntary', 'busted_chips', 'timeout_kicked', 'disconnected'];
      const totalLeaves = Math.max(1, leaveKeys.reduce((a, k) => a + (Number(reasons[k]) || 0), 0));
      const tableLeaveBreakdown = leaveKeys.map(reason => {
        const count = Number(reasons[reason]) || 0;
        return { reason, count, sharePct: Number(((count / totalLeaves) * 100).toFixed(1)) };
      });

      const counts = e.counts || {};
      const totalHandsCompleted = Number(e.handsCompleted) || 0;
      const turnTimeouts = Number(counts.turnTimeouts) || 0;
      return {
        newPlayers: Array.isArray(newPlayers) ? newPlayers : null,
        totalTrackedUsers: Number(e.actors) || 0,
        totalTrackedSessions: Number(e.sessions) || 0,
        totalProductEvents: Number(e.total) || 0,
        featureLeaderboard,
        gameModes,
        characterPopularity,
        characterShowroom,
        expressionPopularity,
        journeyFunnel,
        tableLeaveBreakdown,
        tableInsights: {
          totalHandsCompleted,
          turnTimeouts,
          turnTimeoutRatePct: totalHandsCompleted > 0 ? Number(((turnTimeouts / totalHandsCompleted) * 100).toFixed(2)) : 0,
          insufficientFundsCount: Number(counts.insufficientFunds) || 0,
          purchaseAbandonedCount: Number(counts.purchaseAbandoned) || 0,
          realtimeDisconnects: Number(counts.realtimeDisconnects) || 0,
          realtimeStateFallbacks: Number(counts.realtimeStateFallbacks) || 0,
        },
        handSeries: { buckets: act.buckets, ...(e.handSeries || { casual: [], ranked: [], tourney: [] }) },
        queueEventsTruncated: Boolean(e.queueEventsTruncated),
        source: act.source,
        sourceError: act.sourceError || '',
      };
    }

    function vitalsFromActivity(act) {
      return {
        spans: (act.spans || []).map(sp => ({
          name: sp.name,
          count: Number(sp.count) || 0,
          platforms: sp.platforms || [],
          p50Ms: Number(sp.p50Ms) || 0,
          p95Ms: Number(sp.p95Ms) || 0,
          p99Ms: Number(sp.p99Ms) || 0,
          errorRatePct: Number(sp.count) > 0 ? Number(((Number(sp.errors) / Number(sp.count)) * 100).toFixed(2)) : 0,
        })),
        source: act.source,
        sourceError: act.sourceError || '',
      };
    }

    // The totals from the snapshot's own rows: the demo (every row), or a backend before 1.85.0 has
    // no `activity` action (the newest rows only, as the portal counted before phase 2).
    function snapshotActivity(snap, source) {
      const rows = (list) => filterRowsByState(list, false);
      const act = buildCortexActivity({
        sessions: rows(snap.sessions).concat(source === 'demo' ? rows(snap.previous_sessions) : []),
        productEvents: rows(snap.product_events),
        spans: rows(snap.performance_spans),
        hiddenSessions: testTrafficFromSnapshot(snap)?.hiddenSessions || 0,
      }, {
        environment: state.environment,
        windowHours: state.windowHours,
        includeTest: state.includeTest,
        platform: state.platform,
        appVersion: state.appVersion,
        previous: source === 'demo',
      });
      act.source = source;
      return act;
    }

    async function loadVersions() {
      let versions = [];
      if (state.dataSource === 'edge' || state.environment === 'demo') {
        const snap = await fetchEdgeSnapshot();
        if (snap) {
          const vSet = new Set();
          for (const s of (snap.sessions || [])) {
            if ((state.platform === 'all' || s.platform === state.platform) && s.app_version) {
              vSet.add(String(s.app_version));
            }
          }
          versions = Array.from(vSet).sort((a, b) => b.localeCompare(a));
        }
      } else {
        const res = await fetch(`/api/versions?environment=${state.environment}&platform=${state.platform}&includeTest=${state.includeTest}`);
        const data = await res.json();
        versions = data.versions || [];
      }

      const select = document.getElementById('versionSelect');
      const prev = state.appVersion;
      select.innerHTML = `<option value="all">All Versions</option>` +
        versions.map(v => `<option value="${escapeHtml(v)}" ${v === prev ? 'selected' : ''}>v${escapeHtml(v)}</option>`).join('');

      state.versions = versions;
    }

    function switchTab(tabName) {

      // Each issue's events_count events: the detailed one first, then earlier repeats on other
      // sessions of its platform, some of them test channels or team accounts.
      const error_events = [];
      for (const base of baseErrorEvents) {
        const issue = issues.find(iss => iss.id === base.issue_id);
        const sessionOf = (sid) => sessions.find(s => s.session_id === sid) || {};
        const pool = sessions.filter(s => s.platform === base.platform);
        const fromSession = (s) => ({ user_id: s.user_id, install_id: s.install_id, install_channel: s.install_channel, build_type: s.build_type });
        error_events.push({ ...base, ...fromSession(sessionOf(base.session_id)) });
        for (let k = 1; k < issue.events_count; k++) {
          const s = pool.length > 0 ? pool[(base.issue_id * 7 + k * 11) % pool.length] : sessionOf(base.session_id);
          error_events.push({
            ...base,
            id: base.id * 100 + k,
            session_id: s.session_id || base.session_id,
            app_version: s.app_version || base.app_version,
            ...fromSession(s),
            created_at: new Date(Date.parse(base.created_at) - k * 97 * 60 * 1000).toISOString(),
          });
        }
      }

      const svgCard1 = `<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" rx="16" fill="#0c1424"/><ellipse cx="240" cy="135" rx="175" ry="88" fill="#133a2c" stroke="#d4af37" stroke-width="4"/><circle cx="240" cy="45" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="240" y="50" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">ANYA</text><rect x="202" y="112" width="34" height="48" rx="4" fill="#f8fafc"/><text x="219" y="142" text-anchor="middle" fill="#e11d48" font-family="sans-serif" font-size="16" font-weight="bold">A♥</text><rect x="244" y="112" width="34" height="48" rx="4" fill="#f8fafc"/><text x="261" y="142" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold">K♠</text><text x="240" y="242" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Shake-to-Report Snapshot · iOS v2.0.2 (13)</text></svg>`;
      const svgBase64 = 'data:image/svg+xml;utf8,' + encodeURIComponent(svgCard1);

      const bug_reports = [
        {
          id: 1,
          environment: 'demo',
          platform: 'ios',
          app_version: '2.0.2',
          device_model: 'iPhone 16 Pro',
          os_version: 'iOS 18.1',
          user_id: 'player-3',
          username: 'cjbrasino',
          message: 'Verified Anya Spades expression set at the casual table — portrait and raise panel transition look super clean!',
          screenshot_base64: svgBase64,
          status: 'open',
          breadcrumbs: [
            { ts: isoAgo(14), level: 'info', category: 'SceneCoordinator', message: 'Showing home' },
            { ts: isoAgo(13), level: 'info', category: 'Panel', message: 'Opened characterSetup panel (Anya · Spades)' },
            { ts: isoAgo(12), level: 'info', category: 'SceneCoordinator', message: 'Showing casualGame' },
          ],
          created_at: isoAgo(12),
        },
        {
          id: 2,
          environment: 'demo',
          platform: 'android',
          app_version: '2.0.2',
          device_model: 'Pixel 9 Pro',
          os_version: 'Android 15 (API 35)',
          user_id: 'player-12',
          username: 'HighRoller99',
          message: 'Spin wheel badge showed 1 spin available after returning from background, cleared after tapping Spin panel.',
          screenshot_base64: svgBase64,
          status: 'open',
          breadcrumbs: [
            { ts: isoAgo(32), level: 'info', category: 'SceneCoordinator', message: 'Showing home' },
            { ts: isoAgo(31), level: 'info', category: 'Spin', message: 'Refreshed spin status: 1 available' },
          ],
          created_at: isoAgo(30),
        },
      ];

      // Player classes as the backend's user_traffic_classes() answers them; team_users holds the
      // accounts marked as team (the owner's own, and a tester's).
      const user_classes = {};
      for (const s of sessions) user_classes[s.user_id] = 'player';
      user_classes['player-14'] = 'test';
      const team_users = { 'player-3': true, 'player-8': true };

      // New players as the backend's new_players rows: two weeks of sign-ups, a team account and a
      // tester among today's (hidden unless test traffic is shown).
      const new_players = [];
      const dayMs = 24 * 3600 * 1000;
      for (let day = 0; day < 14; day++) {
        const counts = { ios: 3 + ((day * 7) % 5), android: 2 + ((day * 3) % 4), unknown: day % 4 === 0 ? 1 : 0 };
        for (const [platform, n] of Object.entries(counts)) {
          for (let k = 0; k < n; k++) {
            new_players.push({
              user_id: `new-${day}-${platform}-${k}`,
              created_at: new Date(Date.now() - day * dayMs - (k + 1) * 37 * 60 * 1000).toISOString(),
              platform,
              linked: k === 0 && platform !== 'unknown',
              traffic_class: platform === 'unknown' ? 'unreported' : 'player',
            });
          }
        }
      }
      new_players.push({ user_id: 'new-team', created_at: new Date(Date.now() - 20 * 60 * 1000).toISOString(), platform: 'ios', linked: true, traffic_class: 'internal' });
      new_players.push({ user_id: 'new-tester', created_at: new Date(Date.now() - 25 * 60 * 1000).toISOString(), platform: 'android', linked: false, traffic_class: 'test' });

      return { sessions, issues, error_events, product_events, performance_spans, bug_reports, user_classes, team_users, new_players };
    }

    function getOrBuildDemoSnapshot() {
      if (!state.demoSnapCache) {
        state.demoSnapCache = buildDemoSnapshot();
      }
      return state.demoSnapCache;
    }

    function demoTrafficClass(snap, userId) {
      if (!userId) return null;
      if (snap.team_users[userId]) return 'internal';
      return snap.user_classes[userId] || 'unreported';
    }

    // The demo has no backend, so it hides test traffic the way get_cortex_admin_snapshot does: a
    // test channel, a debug build, or a bot, team or test account, before any count is taken.
    function getDemoSnapshotView() {
      const snap = getOrBuildDemoSnapshot();
      const cutoff = state.windowHours > 0 ? Date.now() - state.windowHours * 3600 * 1000 : null;
      const inWindow = (rows, column) => cutoff == null ? (rows || []) : (rows || []).filter(r => Date.parse(r[column]) >= cutoff);
      const isTestRow = (r, playerOnly) => HIDDEN_TRAFFIC_CLASSES.includes(r.traffic_class) ||
        (!playerOnly && (TEST_INSTALL_CHANNELS.includes(r.install_channel) || r.build_type === 'debug'));
      const keep = (rows, playerOnly = false) => (rows || [])
        .map(r => ({ ...r, traffic_class: demoTrafficClass(snap, r.user_id) }))
        .filter(r => state.includeTest || !isTestRow(r, playerOnly));
      const windowSessions = inWindow(snap.sessions, 'started_at');
      const sessions = keep(windowSessions);
      const error_events = keep(inWindow(snap.error_events, 'created_at'));
      const issues = snap.issues.map(iss => {
        const events = error_events.filter(e => Number(e.issue_id) === Number(iss.id));
        return {
          ...iss,
          window_events_count: events.length,
          affected_users_count: Math.max(1, new Set(events.map(e => e.user_id || e.install_id || e.session_id)).size),
        };
      }).filter(iss => state.includeTest || iss.window_events_count > 0);
      return {
        ...snap,
        sessions,
        error_events,
        issues,
        product_events: keep(inWindow(snap.product_events, 'event_ts')),
        performance_spans: inWindow(snap.performance_spans, 'created_at'),
        bug_reports: keep(snap.bug_reports, true),
        new_players: (snap.new_players || []).filter(r => state.includeTest || !HIDDEN_TRAFFIC_CLASSES.includes(r.traffic_class)),
        test_traffic: { included: state.includeTest, hidden_sessions: windowSessions.length - sessions.length },
      };
    }

    function syncEnvButtonsUI() {
      document.body.setAttribute('data-env', state.environment === 'demo' ? 'local' : state.environment);
      document.querySelectorAll('#envSelector button').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-env') === state.environment);
      });
      document.querySelectorAll('#testTrafficSelector button').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-include-test') === String(state.includeTest));
      });
    }

    async function setIncludeTest(includeTest) {
      state.includeTest = includeTest;
      localStorage.setItem(`cortex_include_test_${state.environment}`, String(includeTest));
      state.edgeSnapCache = null;
      syncEnvButtonsUI();
      await loadVersions();
      await refreshActiveTab();
    }

    async function setEnvironment(env) {
      state.environment = env;
      state.includeTest = readIncludeTest(env);
      localStorage.setItem('cortex_active_env_v2', env);
      state.appVersion = 'all';
      state.compareVersion = 'all';
      state.edgeSnapCache = null;
      state.edgeLastError = null;
      syncEnvButtonsUI();
      updateHeader();
      const keyInput = document.getElementById('inlineOwnerKeyInput');
      if (keyInput && keyInput.value.trim()) {
        state.ownerKey = keyInput.value.trim();
        localStorage.setItem('cortex_owner_key', state.ownerKey);
      }
      await loadVersions();
      await refreshActiveTab();
    }

    function getEdgeUrl(env) {
      const custom = localStorage.getItem(`cortex_edge_url_${env}`);
      return custom && custom.trim() ? custom.trim() : (DEFAULT_EDGE_URLS[env] || DEFAULT_EDGE_URLS.production);
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function queryStr() {
      const p = new URLSearchParams({
        environment: state.environment,
        platform: state.platform,
        appVersion: state.appVersion,
        compareVersion: state.compareVersion,
        windowHours: String(state.windowHours),
        includeTest: String(state.includeTest),
      });
      return p.toString();
    }

    function edgeSnapshotUrl(env) {
      return `${getEdgeUrl(env)}?action=snapshot&environment=${encodeURIComponent(env)}&windowHours=${state.windowHours}&includeTest=${state.includeTest}`;
    }

    async function fetchEdgeSnapshot(forceRefresh = false) {
      if (state.environment === 'demo' && state.dataSource === 'local_server') {
        state.demoKeyVerified = true;
        return getDemoSnapshotView();
      }
      if (!state.ownerKey) {
        state.edgeLastError = null;
        return null;
      }
      if (state.environment === 'demo') {
        if (!state.demoKeyVerified) {
          try {
            const verifyUrl = `${getEdgeUrl('staging')}?action=verify`;
            const vRes = await fetch(verifyUrl, {
              headers: {
                Authorization: `Bearer ${state.ownerKey}`,
                'x-cortex-owner-key': state.ownerKey,
                Accept: 'application/json',
              },
            });
            const vBody = await vRes.json().catch(() => ({}));
            if (!vRes.ok) {
              state.edgeLastError = vBody.error || `Edge Gate returned HTTP ${vRes.status}`;
              return null;
            }
            state.demoKeyVerified = true;
          } catch (err) {
            state.edgeLastError = 'Could not verify Cortex Owner Key against Supabase Edge Gate.';
            return null;
          }
        }
        state.edgeLastError = null;
        return getDemoSnapshotView();
      }
      if (!forceRefresh && state.edgeSnapCache && state.edgeSnapEnv === `${state.environment}:${state.windowHours}:${state.includeTest}`) {
        return state.edgeSnapCache;
      }
      const baseUrl = getEdgeUrl(state.environment);
      const url = edgeSnapshotUrl(state.environment);
      try {
        const res = await fetch(url, {
          headers: {
            Authorization: `Bearer ${state.ownerKey}`,
            'x-cortex-owner-key': state.ownerKey,
            Accept: 'application/json',
          },
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          state.edgeLastError = body.error || `Edge Gate returned HTTP ${res.status}`;
          return null;
        }
        state.demoKeyVerified = true;
        state.edgeLastError = null;
        state.lastRefreshedAt = Date.now();
        state.edgeSnapCache = body.snapshot || {
          sessions: [],
          issues: [],
          error_events: [],
          product_events: [],
          performance_spans: [],
          bug_reports: [],
        };
        state.edgeSnapEnv = `${state.environment}:${state.windowHours}:${state.includeTest}`;
        return state.edgeSnapCache;
      } catch (err) {
        if (state.environment === 'production') {
          try {
            const fallbackRes = await fetch(edgeSnapshotUrl('staging'), {
              headers: {
                Authorization: `Bearer ${state.ownerKey}`,
                'x-cortex-owner-key': state.ownerKey,
                Accept: 'application/json',
              },
            });
            if (fallbackRes.ok) {
              const fbBody = await fallbackRes.json().catch(() => ({}));
              state.lastRefreshedAt = Date.now();
              state.environment = 'staging';
              localStorage.setItem('cortex_active_env_v2', 'staging');
              syncEnvButtonsUI();
              updateHeader();
              state.demoKeyVerified = true;
              state.edgeLastError = null;
              state.edgeSnapCache = fbBody.snapshot || {
                sessions: [],
                issues: [],
                error_events: [],
                product_events: [],
                performance_spans: [],
                bug_reports: [],
              };
              state.edgeSnapEnv = `staging:${state.windowHours}:${state.includeTest}`;
              return state.edgeSnapCache;
            }
          } catch {
            // Fall through
          }
        }
        state.edgeLastError = `Could not reach ${state.environment.toUpperCase()} Edge Gate (${baseUrl}). If ${state.environment.toUpperCase()} is still deploying, switch to STAGING below.`;
        return null;
      }
    }

    function filterRowsByState(rows, includeVersion = true) {
      return (rows || []).filter(r => {
        if (state.environment !== 'all' && r.environment && r.environment !== state.environment) return false;
        if (state.platform !== 'all' && r.platform && r.platform !== state.platform) return false;
        if (includeVersion && state.appVersion !== 'all' && r.app_version && r.app_version !== state.appVersion) return false;
        return true;
      });
    }

    // An issue's lifetime events_count includes test traffic, so while it is hidden the issue lists
    // show the window's count of the events left in, where the backend sends one.
    function issueEventsCount(iss) {
      return !state.includeTest && iss.window_events_count != null ? Number(iss.window_events_count) : Number(iss.events_count || 0);
    }

    function issueEventsHeader(issues) {
      return !state.includeTest && (issues || []).some(i => i.window_events_count != null) ? 'Events in window' : 'Events';
    }

    // { included, hiddenSessions } from a snapshot's test_traffic, or null for a backend before 1.79.0.
    function testTrafficFromSnapshot(snap) {
      const t = snap.test_traffic;
      return t && typeof t === 'object' ? { included: Boolean(t.included), hiddenSessions: Number(t.hidden_sessions || 0) } : null;
    }

    function computePulseFromSnapshot(snap) {
      const sessions = filterRowsByState(snap.sessions);
      const allEnvSessions = filterRowsByState(snap.sessions, false);
      const rawIssues = filterRowsByState(snap.issues, false);
      const allEnvSpans = filterRowsByState(snap.performance_spans, false);
      const allEnvErrors = filterRowsByState(snap.error_events, false);

      const issueUsersMap = new Map();
      for (const err of allEnvErrors) {
        const iid = Number(err.issue_id);
        if (!iid) continue;
        if (!issueUsersMap.has(iid)) issueUsersMap.set(iid, new Set());
        issueUsersMap.get(iid).add(err.user_id || err.install_id || err.session_id || err.id);
      }
      const issues = rawIssues.map(iss => ({
        ...iss,
        affected_users_count: Number(iss.affected_users_count) || issueUsersMap.get(Number(iss.id))?.size || 1,
      }));

      const totalSessions = sessions.length;
      const crashedSessions = sessions.filter(s => s.status === 'crashed').length;
      const erroredSessions = sessions.filter(s => Number(s.errors_count || 0) > 0).length;
      const allUsersSet = new Set(sessions.map(s => s.user_id || s.install_id || s.session_id));
      const crashedUsersSet = new Set(sessions.filter(s => s.status === 'crashed').map(s => s.user_id || s.install_id || s.session_id));
      const activeUsers = allUsersSet.size;
      const avgSessionSec = totalSessions > 0
        ? Math.round(sessions.reduce((a, b) => a + Number(b.duration_ms || 0), 0) / totalSessions / 1000)
        : 0;
      const crashFreeSessionsPct = totalSessions > 0 ? Number((((totalSessions - crashedSessions) / totalSessions) * 100).toFixed(2)) : 100;
      const crashFreeUsersPct = activeUsers > 0 ? Number((((activeUsers - crashedUsersSet.size) / activeUsers) * 100).toFixed(2)) : 100;

      const totalAllEnvSessions = Math.max(1, allEnvSessions.length);
      const byVer = new Map();
      for (const s of allEnvSessions) {
        const key = `${s.platform}:${s.app_version}`;
        if (!byVer.has(key)) byVer.set(key, { platform: s.platform, appVersion: s.app_version, total: 0, crashed: 0, totalErrors: 0, users: new Set() });
        const g = byVer.get(key);
        g.total++;
        if (s.status === 'crashed') g.crashed++;
        g.totalErrors += Number(s.errors_count || 0);
        g.users.add(s.user_id || s.install_id || s.session_id);
      }
      const versionBreakdown = Array.from(byVer.values()).map(g => ({
        platform: g.platform,
        appVersion: g.appVersion,
        adoptionPct: Number(((g.total / totalAllEnvSessions) * 100).toFixed(1)),
        sessions: g.total,
        users: g.users.size,
        crashFreePct: g.total > 0 ? Number((((g.total - g.crashed) / g.total) * 100).toFixed(2)) : 100,
        totalErrors: g.totalErrors,
      })).sort((a, b) => b.appVersion.localeCompare(a.appVersion) || b.sessions - a.sessions);

      // Version-over-Version Comparison (e.g. 2.0.2 vs 2.0.1)
      const uniqueVersions = Array.from(new Set(allEnvSessions.map(s => String(s.app_version || '')).filter(Boolean))).sort((a, b) => b.localeCompare(a));
      let versionComparison = null;
      const curVer = state.appVersion !== 'all' ? state.appVersion : uniqueVersions[0];
      const prevVer = state.compareVersion !== 'all' ? state.compareVersion : uniqueVersions.find(v => v !== curVer);
      if (curVer && prevVer && curVer !== prevVer) {
        const calcVerStats = (ver) => {
          const vs = allEnvSessions.filter(s => s.app_version === ver);
          const vTotal = vs.length;
          const vCrashed = vs.filter(s => s.status === 'crashed').length;
          const vCf = vTotal > 0 ? Number((((vTotal - vCrashed) / vTotal) * 100).toFixed(2)) : 100;
          const vAvgSec = vTotal > 0 ? Math.round(vs.reduce((a, b) => a + Number(b.duration_ms || 0), 0) / vTotal / 1000) : 0;
          const vSpans = allEnvSpans.filter(sp => sp.app_version === ver && ['app.cold_start', 'startup.critical_phase', 'startup.preload', 'preload.critical'].includes(sp.name));
          const vStartupMs = vSpans.length > 0 ? Math.round(vSpans.reduce((a, b) => a + Number(b.duration_ms || 0), 0) / vSpans.length) : 0;
          return { sessions: vTotal, crashFreePct: vCf, avgSessionSec: vAvgSec, avgStartupMs: vStartupMs };
        };
        const curStats = calcVerStats(curVer);
        const prevStats = calcVerStats(prevVer);
        const newIssuesInCurrent = issues.filter(i => i.first_seen_version === curVer && i.status !== 'resolved').length;
        versionComparison = {
          currentVersion: curVer,
          previousVersion: prevVer,
          current: curStats,
          previous: prevStats,
          deltas: {
            crashFreePctDelta: Number((curStats.crashFreePct - prevStats.crashFreePct).toFixed(2)),
            avgSessionSecDelta: curStats.avgSessionSec - prevStats.avgSessionSec,
            startupMsDelta: curStats.avgStartupMs - prevStats.avgStartupMs,
            newIssuesInCurrent,
          },
        };
      }

      const regressedCount = issues.filter(i => i.status === 'regressed').length;
      const unresolvedCount = issues.filter(i => i.status !== 'resolved').length;
      const topIssues = [...issues].sort((a, b) => {
        if (a.status === 'regressed' && b.status !== 'regressed') return -1;
        if (b.status === 'regressed' && a.status !== 'regressed') return 1;
        return issueEventsCount(b) - issueEventsCount(a);
      });

      let status = 'healthy';
      if (crashFreeSessionsPct < 98.5 || regressedCount > 0) status = 'critical';
      else if (crashFreeSessionsPct < 99.5 || unresolvedCount > 1) status = 'warning';

      const envTitle = state.environment === 'demo' ? 'DEMO (SAMPLE DATA)' : state.environment.toUpperCase();
      const headline = totalSessions === 0
        ? `${envTitle} connected — 0 live sessions recorded yet in this window.`
        : status === 'healthy'
          ? `${envTitle} is healthy (${crashFreeSessionsPct}% crash-free across ${totalSessions} sessions).`
          : `${envTitle} needs attention: ${crashFreeSessionsPct}% crash-free (${regressedCount} regressed, ${unresolvedCount} open issues).`;

      const actionItems = [];
      for (const iss of topIssues.filter(i => i.status !== 'resolved').slice(0, 2)) {
        actionItems.push({
          severity: iss.status === 'regressed' || iss.is_fatal ? 'critical' : 'warning',
          label: `${iss.status === 'regressed' ? 'REGRESSED' : iss.is_fatal ? 'CRASH' : 'ERROR'} · ${iss.platform.toUpperCase()}`,
          detail: `${iss.title} (${issueEventsCount(iss)} events)`,
          targetTab: 'triage',
          targetId: Number(iss.id),
        });
      }
      const openReportsCount = (snap.bug_reports || []).filter(r => r.status === 'open' && (state.environment === 'all' || r.environment === state.environment)).length;
      if (openReportsCount > 0) {
        actionItems.push({
          severity: 'healthy',
          label: `INBOX · ${openReportsCount} NEW`,
          detail: `${openReportsCount} player Shake-to-Report bug report${openReportsCount > 1 ? 's' : ''} awaiting review`,
          targetTab: 'inbox',
          targetId: 0,
        });
      }

      return {
        summary: {
          totalSessions,
          crashedSessions,
          erroredSessions,
          activeUsers,
          avgSessionSec,
          crashFreeSessionsPct,
          crashFreeUsersPct,
          regressedIssues: regressedCount,
          unresolvedIssues: unresolvedCount,
        },
        briefing: { status, headline, actionItems },
        versionComparison,
        versionBreakdown,
        topIssues,
        testTraffic: testTrafficFromSnapshot(snap),
      };
    }

    // Embedded from server/queueAttempts.js; queueAttempts.test.ts enforces parity.
    function aggregateQueueAttempts(rows) {
      const stats = Object.fromEntries(['casual', 'ranked', 'tourney'].map(mode => [mode, {
        queueJoins: 0, queueMatches: 0, queueCancels: 0, totalWaitMs: 0,
        waitSamples: 0, aiFallbackMatches: 0, duplicateQueueEvents: 0,
        unmatchedQueueOutcomes: 0, invalidQueueEvents: 0,
        incompleteQueueAttempts: 0, conflictingQueueOutcomes: 0,
      }]));
      const kinds = new Map([
        ['queue.joined', 'start'], ['matchmaking.started', 'start'],
        ['queue.cancelled', 'cancel'], ['matchmaking.cancelled', 'cancel'],
        ['queue.matched', 'match'], ['matchmaking.seated', 'match'],
      ]);
      const usableId = value => {
        const id = typeof value === 'string' ? value.trim() : '';
        return id && !['unknown', 'sync-session', 'sync-install'].includes(id) ? id : '';
      };
      const events = [];
      for (const row of rows || []) {
        const kind = kinds.get(row.name);
        if (!kind) continue;
        let props = row.properties;
        if (!props && row.properties_json) {
          try { props = JSON.parse(row.properties_json); } catch { props = {}; }
        }
        if (!props || typeof props !== 'object' || Array.isArray(props)) props = {};
        const rawMode = String(props.mode || 'casual').toLowerCase();
        const mode = rawMode === 'tournament' ? 'tourney' : rawMode;
        if (!Object.hasOwn(stats, mode)) continue;
        const session = usableId(row.session_id);
        const install = usableId(row.install_id);
        const attemptId = usableId(props.queueAttemptId ?? props.queue_attempt_id ?? props.attemptId ?? props.attempt_id);
        const time = Date.parse(row.event_ts || row.ts || row.created_at || '');
        // Never join anonymous events across players or invent a start at the window boundary.
        if ((!session && !(attemptId && install)) || !Number.isFinite(time)) {
          stats[mode].invalidQueueEvents++;
          continue;
        }
        const scope = JSON.stringify([row.environment || '', row.platform || '', install, session, mode]);
        events.push({ kind, props, mode, scope, attemptId, time });
      }

      // Snapshots arrive newest-first; use original event time, never ingestion/array order.
      // At equal timestamps a start precedes an outcome, and a seat wins a cancellation race.
      const order = { start: 0, cancel: 1, match: 2 };
      events.sort((a, b) => a.time - b.time || order[a.kind] - order[b.kind]);
      const seen = new Set();
      const lanes = new Map();
      const attempts = [];
      for (const event of events) {
        const st = stats[event.mode];
        // Aliases/retransmissions of the same timestamped event do not create another attempt.
        const eventKey = JSON.stringify([event.scope, event.kind, event.time, event.attemptId]);
        if (seen.has(eventKey)) { st.duplicateQueueEvents++; continue; }
        seen.add(eventKey);
        let lane = lanes.get(event.scope);
        if (!lane) {
          lane = { legacy: null, identified: new Map() };
          lanes.set(event.scope, lane);
        }
        if (event.kind === 'start') {
          if (event.attemptId && lane.identified.has(event.attemptId)) {
            st.duplicateQueueEvents++;
            continue;
          }
          const attempt = { mode: event.mode, start: event.time, outcome: null };
          attempts.push(attempt);
          if (event.attemptId) lane.identified.set(event.attemptId, attempt);
          else lane.legacy = attempt;
          continue;
        }
        const attempt = event.attemptId ? lane.identified.get(event.attemptId) : lane.legacy;
        if (!attempt) { st.unmatchedQueueOutcomes++; continue; }
        if (attempt.outcome) {
          if (attempt.outcome.kind === event.kind) { st.duplicateQueueEvents++; continue; }
          st.conflictingQueueOutcomes++;
          // A cancel request can race with a successful join. The recorded seat is the final outcome.
          if (attempt.outcome.kind === 'match') continue;
        }
        const rawWait = event.props.waitMs ?? event.props.wait_duration_ms ?? event.props.durationMs ?? event.props.duration_ms;
        const wait = rawWait == null || rawWait === '' ? NaN : Number(rawWait);
        attempt.outcome = {
          kind: event.kind,
          waitMs: Number.isFinite(wait) && wait >= 0 ? wait : event.time - attempt.start,
          hasAi: event.props.hasAiBots === true || event.props.hasAiBots === 'true',
        };
      }
      for (const attempt of attempts) {
        const st = stats[attempt.mode];
        st.queueJoins++;
        const outcome = attempt.outcome;
        if (!outcome) { st.incompleteQueueAttempts++; continue; }
        if (outcome.kind === 'cancel') st.queueCancels++;
        else {
          st.queueMatches++;
          if (outcome.hasAi) st.aiFallbackMatches++;
        }
        st.totalWaitMs += outcome.waitMs;
        st.waitSamples++;
      }
      return stats;
    }

    // Embedded from server/charts.js; charts.test.ts enforces parity.
    const CHART_COLORS = {
      ios: '#3987e5', android: '#199e70', other: '#71717a',
      casual: '#3987e5', ranked: '#d95926', tourney: '#199e70',
      accent: '#3987e5', good: '#0ca30c', warning: '#fab219', serious: '#ec835a', critical: '#d03b3b',
    };

    // The categorical slots in their validated order, for entities without a fixed colour above.
    // Assign them in a fixed order of the entities (never by rank); past eight, fold into "Other".
    const CHART_SERIES = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'];

    function chartEscape(value) {
      return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }

    function chartTrim(value) {
      return value.toFixed(1).replace(/\.0$/, '');
    }

    // 1,284 as "1.3K"; under a thousand as written (one decimal at most).
    function chartCompact(n) {
      const v = Number(n) || 0;
      const a = Math.abs(v);
      if (a >= 1e9) return `${chartTrim(v / 1e9)}B`;
      if (a >= 1e6) return `${chartTrim(v / 1e6)}M`;
      if (a >= 1e3) return `${chartTrim(v / 1e3)}K`;
      return String(Math.round(v * 10) / 10);
    }

    // 3725 seconds as "1h 2m"; 252 as "4m 12s"; 45 as "45s".
    function chartDuration(seconds) {
      const s = Math.max(0, Math.round(Number(seconds) || 0));
      if (s >= 3600) return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;
      if (s >= 60) return `${Math.floor(s / 60)}m ${s % 60}s`;
      return `${s}s`;
    }

    // The smallest of 1, 2, 2.5, 5 and 10 times a power of ten at or above max (1 for nothing).
    function chartNiceMax(max) {
      if (!(max > 0)) return 1;
      const exp = Math.pow(10, Math.floor(Math.log10(max)));
      for (const m of [1, 2, 2.5, 5, 10]) {
        if (m * exp >= max - 1e-9) return m * exp;
      }
      return 10 * exp;
    }

    // The axis values for a top: 0, the middle and the top; counts never get a fractional middle.
    function chartTicks(top, integer = true) {
      const middle = top / 2;
      return integer && !Number.isInteger(middle) ? [0, top] : [0, middle, top];
    }

    // The window as buckets in the viewer's time zone, oldest first: hours for a window of two days or
    // less, else days. One bucket more than the window holds, so the partial first hour or day keeps
    // the rows the window reaches into it, and the last bucket holds now.
    function chartTimeBuckets(windowHours, nowMs = Date.now()) {
      const hours = Math.max(1, Math.round(Number(windowHours) || 24));
      const starts = [];
      if (hours <= 48) {
        const top = new Date(nowMs);
        top.setMinutes(0, 0, 0);
        for (let i = hours; i >= 0; i--) starts.push(top.getTime() - i * 3600000);
        return { unit: 'hour', starts, end: top.getTime() + 3600000 };
      }
      const days = Math.ceil(hours / 24);
      const today = new Date(nowMs);
      today.setHours(0, 0, 0, 0);
      for (let i = days; i >= 0; i--) {
        const day = new Date(today);
        day.setDate(day.getDate() - i);
        starts.push(day.getTime());
      }
      const end = new Date(today);
      end.setDate(end.getDate() + 1);
      return { unit: 'day', starts, end: end.getTime() };
    }

    // The bucket holding a time, or -1 outside the buckets.
    function chartBucketIndex(buckets, ms) {
      if (!Number.isFinite(ms) || ms < buckets.starts[0] || ms >= buckets.end) return -1;
      for (let i = buckets.starts.length - 1; i >= 0; i--) {
        if (ms >= buckets.starts[i]) return i;
      }
      return -1;
    }

    function chartBucketLabel(buckets, i) {
      const date = new Date(buckets.starts[i]);
      return buckets.unit === 'hour'
        ? date.toLocaleTimeString(undefined, { hour: 'numeric' })
        : date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    // A bucket's name in a tooltip: "Thu 2 PM" for an hour, "Thu, Oct 29" for a day.
    function chartBucketTitle(buckets, i) {
      const date = new Date(buckets.starts[i]);
      return buckets.unit === 'hour'
        ? `${date.toLocaleDateString(undefined, { weekday: 'short' })} ${date.toLocaleTimeString(undefined, { hour: 'numeric' })}`
        : date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function chartProps(row) {
      if (row.properties && typeof row.properties === 'object') return row.properties;
      try {
        const parsed = JSON.parse(row.properties_json || '{}');
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch {
        return {};
      }
    }

    // Active players per bucket by platform (a player counts once per bucket and platform; players
    // counts them once across platforms), and per bucket the sessions started, the crashed ones and
    // their summed length, from session rows (started_at). The buckets travel with the series.
    function chartActivitySeries(sessions, buckets) {
      const n = buckets.starts.length;
      const sets = { ios: [], android: [], other: [], players: [] };
      for (const key of Object.keys(sets)) sets[key] = Array.from({ length: n }, () => new Set());
      const started = new Array(n).fill(0);
      const crashed = new Array(n).fill(0);
      const durationMs = new Array(n).fill(0);
      for (const s of sessions || []) {
        const i = chartBucketIndex(buckets, Date.parse(s.started_at));
        if (i < 0) continue;
        started[i]++;
        if (s.status === 'crashed') crashed[i]++;
        durationMs[i] += Number(s.duration_ms) || 0;
        const key = s.platform === 'ios' || s.platform === 'android' ? s.platform : 'other';
        const player = s.user_id || s.install_id || s.session_id;
        sets[key][i].add(player);
        sets.players[i].add(player);
      }
      const sizes = (list) => list.map((set) => set.size);
      return {
        buckets,
        ios: sizes(sets.ios),
        android: sizes(sets.android),
        other: sizes(sets.other),
        players: sizes(sets.players),
        sessions: started,
        crashed,
        durationMs,
      };
    }

    // Hands completed per bucket and mode, from hand.completed product events (event_ts, mode).
    function chartHandSeries(events, buckets) {
      const n = buckets.starts.length;
      const out = { casual: new Array(n).fill(0), ranked: new Array(n).fill(0), tourney: new Array(n).fill(0) };
      for (const e of events || []) {
        if (e.name !== 'hand.completed') continue;
        const i = chartBucketIndex(buckets, Date.parse(e.event_ts || e.created_at));
        if (i < 0) continue;
        const raw = String(chartProps(e).mode || 'casual').toLowerCase();
        const mode = raw === 'tournament' ? 'tourney' : out[raw] ? raw : 'casual';
        out[mode][i]++;
      }
      return { buckets, ...out };
    }

    function chartLegend(series) {
      if (!series || series.length < 2) return '';
      return `<div class="chart-legend">${series.map((s) => `<span class="chart-key"><i style="background:${chartEscape(s.color)}"></i>${chartEscape(s.label)}</span>`).join('')}</div>`;
    }

    // The same numbers as a table, behind "Show numbers" (a chart's exact values without hovering).
    function chartDataTable(headers, rows) {
      return `<details class="chart-data"><summary>Show numbers</summary><div class="table-scroll"><table>
        <thead><tr>${headers.map((h) => `<th>${chartEscape(h)}</th>`).join('')}</tr></thead>
        <tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${chartEscape(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div></details>`;
    }

    // Columns over time, stacked by series (series[0] at the bottom). Each column is one hit target
    // whose tooltip lists every series in that bucket. A window with nothing draws the empty state.
    function chartColumns({ buckets, series, height = 160, emptyText = 'Nothing in this window', unitLabel = '' }) {
      const n = buckets.starts.length;
      const totals = Array.from({ length: n }, (_, i) => series.reduce((a, s) => a + (Number(s.values[i]) || 0), 0));
      const max = Math.max(0, ...totals);
      if (max === 0) return `<div class="chart-empty" style="height:${height}px">${chartEscape(emptyText)}</div>`;
      const top = chartNiceMax(max);
      const labelEvery = Math.max(1, Math.ceil(n / 6));
      const grid = chartTicks(top).map((t) => `<div class="chart-gridline" style="bottom:${(t / top) * 100}%"><span>${chartEscape(chartCompact(t))}</span></div>`).join('');
      const cols = totals.map((total, i) => {
        const rows = series.length > 1
          ? series.map((s) => `${Number(s.values[i]) || 0} ${s.label}`).concat(`${total} total`)
          : [`${total}${unitLabel ? ` ${unitLabel}` : ''}`];
        const tip = [chartBucketTitle(buckets, i), ...rows].join('\n');
        const segs = series.slice().reverse()
          .filter((s) => Number(s.values[i]) > 0)
          .map((s) => `<span class="chart-seg" style="flex-grow:${Number(s.values[i])};background:${chartEscape(s.color)}"></span>`).join('');
        return `<div class="chart-col" tabindex="0" data-tip="${chartEscape(tip)}"><div class="chart-stack" style="height:${(total / top) * 100}%">${segs}</div></div>`;
      }).join('');
      const labels = buckets.starts.map((_, i) => (i % labelEvery === (n - 1) % labelEvery
        ? `<span style="left:${((i + 0.5) / n) * 100}%">${chartEscape(chartBucketLabel(buckets, i))}</span>`
        : '')).join('');
      return `<div class="chart chart-columns">
        <div class="chart-plot" style="height:${height}px"><div class="chart-grid">${grid}</div><div class="chart-cols">${cols}</div></div>
        <div class="chart-xlabels">${labels}</div>
      </div>`;
    }

    // Horizontal bars, one row per item: the label and its value above a track. Values share one scale
    // (max, else the largest). item: { label, value, valueText?, sub?, color?, tip? }.
    function chartHBars(items, { max, emptyText = 'Nothing in this window' } = {}) {
      const list = items || [];
      if (list.length === 0) return `<div class="chart-empty" style="height:80px">${chartEscape(emptyText)}</div>`;
      const top = max > 0 ? max : Math.max(0, ...list.map((it) => Number(it.value) || 0));
      return `<div class="chart-hbars">${list.map((it) => {
        const pct = top > 0 ? Math.min(100, ((Number(it.value) || 0) / top) * 100) : 0;
        const tip = it.tip || `${it.label}\n${it.valueText ?? it.value}`;
        return `<div class="hbar" tabindex="0" data-tip="${chartEscape(tip)}">
          <div class="hbar-head"><span class="hbar-label">${chartEscape(it.label)}</span><span class="hbar-value">${chartEscape(it.valueText ?? chartCompact(it.value))}</span></div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${pct}%;background:${chartEscape(it.color || CHART_COLORS.accent)}"></div></div>
          ${it.sub ? `<div class="hbar-sub">${chartEscape(it.sub)}</div>` : ''}
        </div>`;
      }).join('')}</div>`;
    }

    // A funnel: each step's players as a bar against the first step, with its drop from the step before.
    function chartFunnel(steps) {
      const list = steps || [];
      const first = Math.max(0, Number(list[0]?.users) || 0);
      if (first === 0) return `<div class="chart-empty" style="height:80px">No players in this window</div>`;
      return chartHBars(list.map((s, i) => ({
        label: s.step,
        value: Number(s.users) || 0,
        valueText: `${s.users} · ${s.conversionFromStartPct}%`,
        sub: i > 0 && s.dropOffFromPrevPct > 0 ? `−${s.dropOffFromPrevPct}% from the step before` : '',
        color: CHART_COLORS.accent,
        tip: `${s.step}\n${s.users} players\n${s.conversionFromStartPct}% of the first step${i > 0 ? `\n−${s.dropOffFromPrevPct}% from the step before` : ''}`,
      })), { max: first });
    }

    // One bar of shares (2px gaps between parts) with a legend that names each part, its count and share.
    // part: { label, value, color }.
    function chartShareBar(parts, { emptyText = 'Nothing in this window' } = {}) {
      const list = (parts || []).filter((p) => Number(p.value) > 0);
      const total = list.reduce((a, p) => a + Number(p.value), 0);
      if (total === 0) return `<div class="chart-empty" style="height:60px">${chartEscape(emptyText)}</div>`;
      const pct = (v) => Math.round((v / total) * 1000) / 10;
      const segs = list.map((p) => `<span class="share-seg" tabindex="0" style="flex-grow:${Number(p.value)};background:${chartEscape(p.color)}" data-tip="${chartEscape(`${p.label}\n${p.value} · ${pct(Number(p.value))}%`)}"></span>`).join('');
      const legend = list.map((p) => `<span class="chart-key"><i style="background:${chartEscape(p.color)}"></i>${chartEscape(p.label)} <strong>${chartEscape(chartCompact(p.value))}</strong> <em>${pct(Number(p.value))}%</em></span>`).join('');
      return `<div class="chart-share"><div class="share-bar">${segs}</div><div class="chart-legend">${legend}</div></div>`;
    }

    // Latency ranges on one log scale: a bar from p50 to p95, a dot at p50 and a tick at p99.
    // row: { label, p50Ms, p95Ms, p99Ms, count, errorRatePct }.
    function chartRanges(rows) {
      const list = (rows || []).filter((r) => Number(r.count) > 0);
      if (list.length === 0) return `<div class="chart-empty" style="height:80px">No timings in this window</div>`;
      const maxMs = Math.max(10, ...list.map((r) => Number(r.p99Ms) || Number(r.p95Ms) || 0));
      const top = Math.pow(10, Math.ceil(Math.log10(maxMs)));
      const floor = 10;
      const pos = (ms) => Math.max(0, Math.min(100, ((Math.log10(Math.max(floor, ms)) - 1) / (Math.log10(top) - 1)) * 100));
      const fmt = (ms) => (ms >= 1000 ? `${chartTrim(ms / 1000)} s` : `${Math.round(ms)} ms`);
      const ticks = [];
      for (let t = floor; t <= top; t *= 10) ticks.push(t);
      return `<div class="chart-ranges">
        ${list.map((r) => {
          const p50 = Number(r.p50Ms) || 0;
          const p95 = Number(r.p95Ms) || 0;
          const p99 = Number(r.p99Ms) || 0;
          const tip = `${r.label}\np50 ${fmt(p50)} · p95 ${fmt(p95)} · p99 ${fmt(p99)}\n${r.count} samples · ${r.errorRatePct}% failed`;
          return `<div class="range-row" tabindex="0" data-tip="${chartEscape(tip)}">
            <div class="hbar-head"><span class="hbar-label mono">${chartEscape(r.label)}</span><span class="hbar-value">${chartEscape(fmt(p50))} · ${chartEscape(fmt(p95))}${Number(r.errorRatePct) > 0 ? ` · ${chartEscape(r.errorRatePct)}% failed` : ''}</span></div>
            <div class="range-track">
              <span class="range-span" style="left:${pos(p50)}%;width:${Math.max(0.6, pos(p95) - pos(p50))}%"></span>
              <span class="range-p99" style="left:${pos(p99)}%"></span>
              <span class="range-dot" style="left:${pos(p50)}%"></span>
            </div>
          </div>`;
        }).join('')}
        <div class="range-axis">${ticks.map((t) => `<span style="left:${pos(t)}%">${chartEscape(fmt(t))}</span>`).join('')}</div>
      </div>`;
    }

    // A small trend line for a headline card; nothing for fewer than two points or all zeros.
    function chartSparkline(values, color = CHART_COLORS.accent) {
      const list = (values || []).map((v) => Number(v) || 0);
      const max = Math.max(0, ...list);
      if (list.length < 2 || max === 0) return '';
      const pts = list.map((v, i) => `${((i / (list.length - 1)) * 100).toFixed(2)},${(22 - (v / max) * 20).toFixed(2)}`);
      return `<svg class="chart-spark" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true">
        <polygon points="0,24 ${pts.join(' ')} 100,24" fill="${chartEscape(color)}" fill-opacity="0.1"></polygon>
        <polyline points="${pts.join(' ')}" fill="none" stroke="${chartEscape(color)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></polyline>
      </svg>`;
    }

    function computeRadarFromSnapshot(snap) {
      const rows = filterRowsByState(snap.product_events);
      const queueAttempts = aggregateQueueAttempts(rows);
      const totalActiveUsersSet = new Set();
      const totalSessionsSet = new Set();
      const panelMetrics = new Map();
      for (const k of Object.keys(ALL_HOME_PANELS_META)) {
        panelMetrics.set(k, { opens: 0, users: new Set(), totalDwellMs: 0, dwellCount: 0, interactedCount: 0 });
      }
      const modeStats = {
        casual: { ...queueAttempts.casual, tablesCompleted: 0, totalHandsPlayed: 0, earlyLeaves: 0 },
        ranked: { ...queueAttempts.ranked, tablesCompleted: 0, totalHandsPlayed: 0, earlyLeaves: 0 },
        tourney: { ...queueAttempts.tourney, tablesCompleted: 0, totalHandsPlayed: 0, earlyLeaves: 0 },
      };
      const characterCounts = new Map([['anya', 0], ['amara', 0], ['brutus', 0], ['lenny', 0]]);
      const characterShowroomMap = new Map([
        ['anya', { previews: 0, purchases: 0, abandons: 0 }],
        ['amara', { previews: 0, purchases: 0, abandons: 0 }],
        ['brutus', { previews: 0, purchases: 0, abandons: 0 }],
        ['lenny', { previews: 0, purchases: 0, abandons: 0 }],
      ]);
      const expressionSetCounts = new Map([
        ['default', 0], ['set1', 0], ['set2', 0], ['spades', 0], ['hearts', 0], ['diamonds', 0], ['clubs', 0],
      ]);
      const tableLeaveReasons = { voluntary: 0, busted_chips: 0, timeout_kicked: 0, disconnected: 0 };
      const funnelStages = {
        cold_launch: new Set(), preload_complete: new Set(), auth_complete: new Set(),
        home_reached: new Set(), lobby_opened: new Set(), queue_joined: new Set(),
        table_seated: new Set(), hand_completed: new Set(), play_again: new Set(),
      };
      let turnTimeouts = 0, insufficientFundsCount = 0, purchaseAbandonedCount = 0, realtimeDisconnects = 0, realtimeStateFallbacks = 0;
      const handsCompletedBySession = new Map();
      const handsTableLeftBySession = new Map();

      const hasExplicitPreload = rows.some(r => r.name === 'preload.completed');
      const hasExplicitAuth = rows.some(r => r.name === 'auth.completed');
      const extractExprToken = (raw) => {
        const parts = String(raw || '').toLowerCase().split(/[_-\s]+/);
        for (const p of parts) {
          if (expressionSetCounts.has(p)) return p;
        }
        return null;
      };

      for (const r of rows) {
        const actor = r.user_id || r.install_id || r.session_id || 'anon';
        const sk = r.session_id || actor;
        totalActiveUsersSet.add(actor);
        if (r.session_id) totalSessionsSet.add(r.session_id);
        funnelStages.cold_launch.add(actor);
        if (!hasExplicitAuth && r.user_id) funnelStages.auth_complete.add(actor);
        const props = (r.properties && typeof r.properties === 'object') ? r.properties : {};
        if (r.name === 'preload.completed') funnelStages.preload_complete.add(actor);
        else if (r.name === 'auth.completed') funnelStages.auth_complete.add(actor);
        else if (r.name === 'realtime.connected') {
          if (!hasExplicitPreload) funnelStages.preload_complete.add(actor);
          if (!hasExplicitAuth) funnelStages.auth_complete.add(actor);
        } else if (r.name === 'scene.viewed') {
          if (props.scene === 'home') {
            if (!hasExplicitPreload) funnelStages.preload_complete.add(actor);
            if (!hasExplicitAuth) funnelStages.auth_complete.add(actor);
            funnelStages.home_reached.add(actor);
          }
          if (props.scene === 'casualGame' || props.scene === 'rankedGame') funnelStages.table_seated.add(actor);
        } else if (r.name === 'panel.opened') {
          if (!hasExplicitPreload) funnelStages.preload_complete.add(actor);
          if (!hasExplicitAuth) funnelStages.auth_complete.add(actor);
          funnelStages.home_reached.add(actor);
          const m = panelMetrics.get(String(props.panel || ''));
          if (m) { m.opens++; m.users.add(actor); }
          if (['casual', 'ranked', 'tournament'].includes(String(props.panel || ''))) funnelStages.lobby_opened.add(actor);
        } else if (r.name === 'panel.closed') {
          const m = panelMetrics.get(String(props.panel || ''));
          const dwellMs = Number(props.dwellMs ?? props.dwell_ms ?? 0);
          if (m) {
            if (m.opens === 0) { m.opens++; m.users.add(actor); }
            if (dwellMs > 0) { m.totalDwellMs += dwellMs; m.dwellCount++; }
            if (props.interacted === true || dwellMs >= 4500) m.interactedCount++;
          }
        } else if (r.name === 'queue.joined' || r.name === 'matchmaking.started') {
          funnelStages.queue_joined.add(actor);
        } else if (r.name === 'queue.matched' || r.name === 'matchmaking.seated') {
          funnelStages.table_seated.add(actor);
        } else if (r.name === 'hand.completed') {
          funnelStages.hand_completed.add(actor);
          handsCompletedBySession.set(sk, (handsCompletedBySession.get(sk) ?? 0) + 1);
        } else if (r.name === 'turn.timeout') turnTimeouts++;
        else if (r.name === 'table.left') {
          const mode = String(props.mode || 'casual').toLowerCase() === 'tournament' ? 'tourney' : String(props.mode || 'casual').toLowerCase();
          const hands = Number(props.handsPlayed ?? props.hands_played ?? 0) || 0;
          const reason = String(props.reason || 'voluntary').toLowerCase();
          if (reason in tableLeaveReasons) tableLeaveReasons[reason]++; else tableLeaveReasons.voluntary++;
          if (hands > 0) {
            funnelStages.hand_completed.add(actor);
            handsTableLeftBySession.set(sk, (handsTableLeftBySession.get(sk) ?? 0) + hands);
          }
          if (modeStats[mode]) { modeStats[mode].tablesCompleted++; modeStats[mode].totalHandsPlayed += hands; }
        } else if (r.name === 'game_summary.action') {
          const choice = String(props.exitChoice ?? props.exit_choice ?? props.action ?? '');
          if (choice === 'play_again' || choice === 'requeue') funnelStages.play_again.add(actor);
        } else if (r.name === 'character.selected' || r.name === 'customize.equipped') {
          const rawChar = String(props.characterId ?? props.character_id ?? props.itemId ?? props.item_id ?? '').toLowerCase().split('_')[0];
          if (characterCounts.has(rawChar)) characterCounts.set(rawChar, characterCounts.get(rawChar) + 1);
          const exprTok = extractExprToken(props.setKey ?? props.set_key ?? props.itemId ?? props.item_id);
          if (exprTok) expressionSetCounts.set(exprTok, expressionSetCounts.get(exprTok) + 1);
        } else if (r.name === 'character.expression_changed') {
          const skey = String(props.setKey ?? props.set_key ?? 'default').toLowerCase();
          if (expressionSetCounts.has(skey)) expressionSetCounts.set(skey, expressionSetCounts.get(skey) + 1);
        } else if (r.name === 'store.item_previewed') {
          const rawChar = String(props.characterId ?? props.character_id ?? props.itemId ?? props.item_id ?? '').toLowerCase().split('_')[0];
          if (characterShowroomMap.has(rawChar)) characterShowroomMap.get(rawChar).previews++;
          const exprTok = extractExprToken(props.setKey ?? props.set_key ?? props.itemId ?? props.item_id);
          if (exprTok) expressionSetCounts.set(exprTok, expressionSetCounts.get(exprTok) + 1);
        } else if (r.name === 'store.purchase_completed' || r.name === 'store.iap_completed') {
          const rawChar = String(props.characterId ?? props.character_id ?? props.itemId ?? props.item_id ?? '').toLowerCase().split('_')[0];
          if (characterShowroomMap.has(rawChar)) characterShowroomMap.get(rawChar).purchases++;
          const exprTok = extractExprToken(props.setKey ?? props.set_key ?? props.itemId ?? props.item_id);
          if (exprTok) expressionSetCounts.set(exprTok, expressionSetCounts.get(exprTok) + 1);
        } else if (r.name === 'store.purchase_abandoned') {
          purchaseAbandonedCount++;
          const rawChar = String(props.characterId ?? props.character_id ?? props.itemId ?? props.item_id ?? '').toLowerCase().split('_')[0];
          if (characterShowroomMap.has(rawChar)) characterShowroomMap.get(rawChar).abandons++;
        } else if (r.name === 'economy.insufficient_funds') insufficientFundsCount++;
        else if (r.name === 'realtime.disconnected' || r.name === 'realtime.reconnect_exhausted') realtimeDisconnects++;
        else if (r.name === 'realtime.state_fallback') realtimeStateFallbacks++;
      }

      let totalHandsCompleted = 0;
      for (const sk of new Set([...handsCompletedBySession.keys(), ...handsTableLeftBySession.keys()])) {
        totalHandsCompleted += Math.max(handsCompletedBySession.get(sk) ?? 0, handsTableLeftBySession.get(sk) ?? 0);
      }

      const totalUsers = Math.max(1, totalActiveUsersSet.size);
      const featureLeaderboard = Object.entries(ALL_HOME_PANELS_META).map(([panelKey, meta]) => {
        const m = panelMetrics.get(panelKey);
        const dauSharePct = Number(((m.users.size / totalUsers) * 100).toFixed(1));
        const avgDwellSec = m.dwellCount > 0 ? Number((m.totalDwellMs / m.dwellCount / 1000).toFixed(1)) : 0;
        const interactionRatePct = m.opens > 0 ? Number(((m.interactedCount / m.opens) * 100).toFixed(1)) : 0;
        const opensPerUser = m.users.size > 0 ? Number((m.opens / m.users.size).toFixed(1)) : 0;
        let status = 'healthy';
        if (dauSharePct >= 45 && interactionRatePct >= 65) status = 'loved';
        else if (dauSharePct < 12) status = 'ignored';
        else if (dauSharePct < 25 || interactionRatePct < 45) status = 'underused';
        return { panelKey, label: meta.label, group: meta.group, opens: m.opens, opensPerUser, uniqueUsers: m.users.size, dauSharePct, avgDwellSec, interactionRatePct, status };
      }).sort((a, b) => b.dauSharePct - a.dauSharePct || b.opens - a.opens);

      const gameModes = Object.entries(modeStats).map(([mode, st]) => ({
        ...queueAttempts[mode],
        mode,
        queueJoins: st.queueJoins,
        cancelRatePct: st.queueJoins > 0 ? Number(((st.queueCancels / st.queueJoins) * 100).toFixed(1)) : 0,
        avgWaitSec: (st.queueMatches + st.queueCancels) > 0 ? Number((st.totalWaitMs / (st.queueMatches + st.queueCancels) / 1000).toFixed(1)) : 0,
        aiFallbackPct: st.queueMatches > 0 ? Number(((st.aiFallbackMatches / st.queueMatches) * 100).toFixed(1)) : 0,
        avgHandsPerSession: st.tablesCompleted > 0 ? Number((st.totalHandsPlayed / st.tablesCompleted).toFixed(1)) : 0,
      }));

      const totalCharSel = Math.max(1, Array.from(characterCounts.values()).reduce((a, b) => a + b, 0));
      const characterPopularity = Array.from(characterCounts.entries()).map(([characterId, count]) => ({
        characterId, count, sharePct: Number(((count / totalCharSel) * 100).toFixed(1)),
      })).sort((a, b) => b.count - a.count);

      const characterShowroom = Array.from(characterShowroomMap.entries()).map(([characterId, sr]) => {
        const sharePct = characterPopularity.find(c => c.characterId === characterId)?.sharePct ?? 0;
        return {
          characterId,
          equippedCount: characterCounts.get(characterId) ?? 0,
          sharePct,
          equippedSharePct: sharePct,
          previews: sr.previews,
          purchases: sr.purchases,
          abandons: sr.abandons,
          conversionPct: sr.previews > 0 ? Number(((sr.purchases / sr.previews) * 100).toFixed(1)) : 0,
        };
      }).sort((a, b) => b.equippedCount - a.equippedCount);

      const totalExprSel = Math.max(1, Array.from(expressionSetCounts.values()).reduce((a, b) => a + b, 0));
      const expressionPopularity = Array.from(expressionSetCounts.entries()).map(([setKey, count]) => ({
        setKey, count, sharePct: Number(((count / totalExprSel) * 100).toFixed(1)),
      })).sort((a, b) => b.count - a.count);

      const topFunnelCount = Math.max(1, funnelStages.cold_launch.size);
      const journeyFunnel = [
        { step: 'App Launch', users: funnelStages.cold_launch.size },
        { step: 'Assets Preloaded', users: funnelStages.preload_complete.size },
        { step: 'Authenticated', users: funnelStages.auth_complete.size },
        { step: 'Home Reached', users: funnelStages.home_reached.size },
        { step: 'Lobby Opened', users: funnelStages.lobby_opened.size },
        { step: 'Queue Joined', users: funnelStages.queue_joined.size },
        { step: 'Seated at Table', users: funnelStages.table_seated.size },
        { step: 'Completed 1+ Hands', users: funnelStages.hand_completed.size },
        { step: 'Tapped Play Again', users: funnelStages.play_again.size },
      ].map((s, idx, arr) => ({
        ...s,
        conversionFromStartPct: Number(((s.users / topFunnelCount) * 100).toFixed(1)),
        dropOffFromPrevPct: idx > 0 && arr[idx - 1].users > 0 ? Number((((arr[idx - 1].users - s.users) / arr[idx - 1].users) * 100).toFixed(1)) : 0,
      }));

      const totalLeaves = Math.max(1, Object.values(tableLeaveReasons).reduce((a, b) => a + b, 0));
      const tableLeaveBreakdown = Object.entries(tableLeaveReasons).map(([reason, count]) => ({
        reason, count, sharePct: Number(((count / totalLeaves) * 100).toFixed(1)),
      }));

      return {
        newPlayers: Array.isArray(snap.new_players) ? snap.new_players : null,
        totalTrackedUsers: totalActiveUsersSet.size,
        totalTrackedSessions: totalSessionsSet.size,
        totalProductEvents: rows.length,
        featureLeaderboard,
        gameModes,
        characterPopularity,
        characterShowroom,
        expressionPopularity,
        journeyFunnel,
        tableLeaveBreakdown,
        tableInsights: {
          totalHandsCompleted,
          turnTimeouts,
          turnTimeoutRatePct: totalHandsCompleted > 0 ? Number(((turnTimeouts / totalHandsCompleted) * 100).toFixed(2)) : 0,
          insufficientFundsCount,
          purchaseAbandonedCount,
          realtimeDisconnects,
          realtimeStateFallbacks,
        },
      };
    }

    function computeVitalsFromSnapshot(snap) {
      const rows = filterRowsByState(snap.performance_spans);
      const grouped = new Map();
      for (const r of rows) {
        if (!grouped.has(r.name)) grouped.set(r.name, { durations: [], errors: 0, platforms: new Set() });
        const g = grouped.get(r.name);
        g.durations.push(Number(r.duration_ms || 0));
        if (r.status !== 'ok') g.errors++;
        g.platforms.add(r.platform);
      }
      const pct = (sorted, p) => sorted.length === 0 ? 0 : Math.round(sorted[Math.min(sorted.length - 1, Math.floor((p / 100) * sorted.length))]);
      const spans = Array.from(grouped.entries()).map(([name, g]) => {
        const sorted = [...g.durations].sort((a, b) => a - b);
        const count = sorted.length;
        return {
          name, count, platforms: Array.from(g.platforms),
          p50Ms: pct(sorted, 50), p95Ms: pct(sorted, 95), p99Ms: pct(sorted, 99),
          errorRatePct: count > 0 ? Number(((g.errors / count) * 100).toFixed(2)) : 0,
        };
      }).sort((a, b) => b.count - a.count);
      return { spans };
    }

    async function loadVersions() {
      let versions = [];
      if (state.dataSource === 'edge' || state.environment === 'demo') {
        const snap = await fetchEdgeSnapshot();
        if (snap) {
          const vSet = new Set();
          for (const s of (snap.sessions || [])) {
            if ((state.platform === 'all' || s.platform === state.platform) && s.app_version) {
              vSet.add(String(s.app_version));
            }
          }
          versions = Array.from(vSet).sort((a, b) => b.localeCompare(a));
        }
      } else {
        const res = await fetch(`/api/versions?environment=${state.environment}&platform=${state.platform}&includeTest=${state.includeTest}`);

        versions = data.versions || [];

      const select = document.getElementById('versionSelect');

    const TAB_ENDPOINTS = { pulse: 'pulse', players: 'radar', games: 'radar', economy: 'radar', triage: 'triage', vitals: 'vitals', inbox: 'inbox' };
    const TAB_RENDERERS = {
      pulse: (root, d) => renderPulse(root, d),
      players: (root, d) => renderPlayers(root, d),
      games: (root, d) => renderGames(root, d),
      economy: (root, d) => renderEconomy(root, d),

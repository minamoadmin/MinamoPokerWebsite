    const TAB_ENDPOINTS = { pulse: 'pulse', players: 'radar', games: 'radar', economy: 'radar', triage: 'triage', vitals: 'vitals', inbox: 'inbox' };
    const TOTALS_TABS = ['pulse', 'players', 'games', 'economy', 'vitals'];

    function viewerTimeZone() {
      return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
    }

    // The server's totals for the filters (cortex-admin `activity`, MinamoPokerBE 1.85.0), kept until
    // the next refresh like the snapshot; null from a backend without the action (it answers 400).
    async function fetchEdgeActivity() {
      if (!state.ownerKey) return null;
      const params = new URLSearchParams({
        action: 'activity',
        environment: state.environment,
        windowHours: String(state.windowHours),
        timeZone: viewerTimeZone(),
        includeTest: String(state.includeTest),
        platform: state.platform,
        appVersion: state.appVersion,
      }).toString();
      if (state.edgeActivityCache && state.edgeActivityCache.has(params)) return state.edgeActivityCache.get(params);
      try {
        const res = await fetch(`${getEdgeUrl(state.environment)}?${params}`, {
          headers: {
            Authorization: `Bearer ${state.ownerKey}`,
            'x-cortex-owner-key': state.ownerKey,
            Accept: 'application/json',
          },
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body.activity || !body.activity.sessions) return null;
        const act = { ...body.activity, source: 'server' };
        if (!state.edgeActivityCache) state.edgeActivityCache = new Map();
        state.edgeActivityCache.set(params, act);
        return act;
      } catch {
        return null;
      }
    }
    // The Economy and Games tabs' server totals (cortex-admin `economy` and `play`, MinamoPokerBE 1.89.0),
    // cached like the activity: { totals }, { missing } from a backend without the action (a 400 naming
    // it unsupported), or { error }.
    async function fetchEdgeTotals(action) {
      if (!state.ownerKey) return null;
      const params = new URLSearchParams({
        action,
        environment: state.environment,
        windowHours: String(state.windowHours),
        timeZone: viewerTimeZone(),
        includeTest: String(state.includeTest),
      }).toString();
      if (state.edgeTotalsCache && state.edgeTotalsCache.has(params)) return state.edgeTotalsCache.get(params);
      try {
        const res = await fetch(`${getEdgeUrl(state.environment)}?${params}`, {
          headers: {
            Authorization: `Bearer ${state.ownerKey}`,
            'x-cortex-owner-key': state.ownerKey,
            Accept: 'application/json',
          },
        });
        const body = await res.json().catch(() => ({}));
        if (res.ok && body[action] && body[action].buckets) {
          if (!state.edgeTotalsCache) state.edgeTotalsCache = new Map();
          state.edgeTotalsCache.set(params, { totals: body[action] });
          return { totals: body[action] };
        }
        if (res.status === 400 && /Unsupported/.test(String(body.error || ''))) return { missing: true };
        return { error: body.error || `cortex-admin answered ${res.status}` };
      } catch (err) {
        return { error: err && err.message ? err.message : String(err) };
      }
    }

    // The Economy or Games totals for the tab and where they came from: the server's, the demo's, or
    // why there are none ('backend': the backend has no such action yet; 'key': the local server has
    // no key for this environment; 'unreachable': the project or the local server failed, with its
    // `error`). Never throws, so a failure shows on the tab instead of leaving the last window there.
    async function tabTotals(tab) {
      const kind = tab === 'economy' ? 'economy' : 'play';
      const demoOptions = { windowHours: state.windowHours, timeZone: viewerTimeZone(), includeTest: state.includeTest, environment: state.environment };
      if (state.environment === 'demo') {
        return { totals: kind === 'economy' ? demoEconomy(demoOptions) : demoPlay(demoOptions), source: 'demo' };
      }
      if (state.dataSource === 'edge') {
        const answer = await fetchEdgeTotals(kind);
        if (answer && answer.totals) return { totals: answer.totals, source: 'server' };
        if (answer && answer.missing) return { totals: null, source: 'backend' };
        return { totals: null, source: 'unreachable', error: (answer && answer.error) || '' };
      }
      try {
        const res = await fetch(`/api/${kind}?${queryStr()}&timeZone=${encodeURIComponent(viewerTimeZone())}`);
        const body = await res.json().catch(() => ({}));
        if (!res.ok) return { totals: null, source: 'unreachable', error: body.error || `Cortex answered ${res.status}` };
        if (!body.ok) {
          const source = { no_key: 'key', no_function: 'backend' }[body.reason] || 'unreachable';
          return { totals: null, source, error: body.error || '' };
        }
        return { totals: body[kind], source: 'server' };
      } catch (err) {
        return { totals: null, source: 'unreachable', error: err && err.message ? err.message : String(err) };
      }
    }

    const TAB_RENDERERS = {
      pulse: (root, d) => renderPulse(root, d),
      players: (root, d) => renderPlayers(root, d),
      games: (root, d) => renderGames(root, d),
      economy: (root, d) => renderEconomy(root, d),
      triage: (root, d) => renderTriage(root, d),
      vitals: (root, d) => renderVitals(root, d),
      inbox: (root, d) => renderInbox(root, d),
    };

    // Renders the active tab. A refresh keeps the frame: the last render stays, dimmed, until the
    // new one lands; a later call wins over an earlier one that answers after it.
    async function refreshActiveTab() {
      updateHeader();
      const root = document.getElementById('viewRoot');
      const seq = ++state.renderSeq;
      const tab = TAB_ENDPOINTS[state.activeTab] ? state.activeTab : 'pulse';
      const current = () => seq === state.renderSeq;
      root.classList.add('refreshing');
      try {
        if (state.dataSource === 'edge' || state.environment === 'demo') {
          const snap = await fetchEdgeSnapshot();
          if (!current()) return;
          if (!snap) {
            setPortalUnlocked(false);
            return;
          }
          setPortalUnlocked(true);
          const allErrs = filterRowsByState(snap.error_events, false);
          const triageUsersByIssue = new Map();
          for (const err of allErrs) {
            const iid = Number(err.issue_id);
            if (!iid) continue;
            if (!triageUsersByIssue.has(iid)) triageUsersByIssue.set(iid, new Set());
            triageUsersByIssue.get(iid).add(err.user_id || err.install_id || err.session_id || err.id);
          }
          const issues = filterRowsByState(snap.issues, false).map(iss => ({
            ...iss,
            affected_users_count: Number(iss.affected_users_count) || triageUsersByIssue.get(Number(iss.id))?.size || 1,
          }));
          const reports = filterRowsByState(snap.bug_reports, false).map(r => {
            const b64 = r.screenshot_base64 ? String(r.screenshot_base64) : null;
            const mime = b64 && b64.startsWith('/9j/') ? 'image/jpeg' : 'image/png';
            return {
              ...r,
              screenshot_base64: b64 && !b64.startsWith('data:image/')
                ? `data:${mime};base64,${b64}`
                : b64,
            };
          });
          document.getElementById('triageBadge').textContent = String(issues.filter(i => i.status !== 'resolved').length);
          document.getElementById('inboxBadge').textContent = String(reports.filter(r => r.status === 'open').length);

          // Pulse, Players, Games, Economy and Vitals draw from the totals: the server's (1.85.0), else
          // the snapshot's own rows (the demo's are all of them; an older backend's are capped).
          let data;
          if (TOTALS_TABS.includes(tab)) {
            const act = state.environment === 'demo'
              ? snapshotActivity(snap, 'demo')
              : (await fetchEdgeActivity()) || snapshotActivity(snap, 'rows');
            if (!current()) return;
            if (tab === 'pulse') data = pulseFromActivity(act, snap);
            else if (tab === 'vitals') data = vitalsFromActivity(act);
            else data = radarFromActivity(act, snap.new_players);
            if (tab === 'economy' || tab === 'games') {
              const totals = await tabTotals(tab);
              if (!current()) return;
              data = { ...data, totals: totals.totals, totalsSource: totals.source, totalsError: totals.error || '' };
            }
          } else if (tab === 'triage') data = { issues };
          else data = { reports };
          TAB_RENDERERS[tab](root, data);
          if (state.environment === 'demo' || !state.lastRefreshedAt) state.lastRefreshedAt = Date.now();
          return;
        }

        // Local server: the badges, Triage and Inbox from its lists; the totals from /api/activity
        // (the project's get_cortex_activity with its service key, else this server's own rows).
        const [triage, inbox] = await Promise.all([
          fetch(`/api/triage?${queryStr()}`).then(r => r.json()).catch(() => ({ issues: [] })),
          fetch(`/api/inbox?${queryStr()}`).then(r => r.json()).catch(() => ({ reports: [] })),
        ]);
        if (!current()) return;
        document.getElementById('triageBadge').textContent = String((triage.issues || []).filter(i => i.status !== 'resolved').length);
        document.getElementById('inboxBadge').textContent = String((inbox.reports || []).filter(i => i.status === 'open').length);

        let data;
        if (TOTALS_TABS.includes(tab)) {
          const res = await fetch(`/api/activity?${queryStr()}&timeZone=${encodeURIComponent(viewerTimeZone())}`);
          const body = await res.json();
          if (!current()) return;
          if (!res.ok || !body.activity) throw new Error(body.error || `Cortex answered ${res.status}`);
          const act = { ...body.activity, source: body.source, sourceError: body.error || '' };
          if (tab === 'pulse') data = pulseFromActivity(act, { issues: triage.issues || [], error_events: [], bug_reports: inbox.reports || [] });
          else if (tab === 'vitals') data = vitalsFromActivity(act);
          else data = radarFromActivity(act, body.newPlayers);
          if (tab === 'economy' || tab === 'games') {
            const totals = await tabTotals(tab);
            if (!current()) return;
            data = { ...data, totals: totals.totals, totalsSource: totals.source, totalsError: totals.error || '' };
          }
        } else if (tab === 'triage') data = triage;
        else data = inbox;
        TAB_RENDERERS[tab](root, data);
        state.lastRefreshedAt = Date.now();
      } catch (err) {
        if (current()) {
          root.innerHTML = panelCard('Could not load this tab', `${err && err.message ? err.message : String(err)}. Refresh to try again.`, '');
        }
      } finally {
        if (current()) {
          root.classList.remove('refreshing');
          updateRefreshLabel();
          // The header is measured once it shows (it is hidden while the portal is locked)
          document.querySelectorAll('.scroll-fade').forEach(updateScrollFade);
        }
      }
    }

    // A card: its title, the line under it, then the body (HTML). extra sits at the header's right.
    function panelCard(title, subtitle, body, extra = '') {
      return `
        <div class="panel-card">
          <div class="panel-header">
            <div>
              <div class="panel-title">${escapeHtml(title)}</div>
              ${subtitle ? `<div class="panel-subtitle">${escapeHtml(subtitle)}</div>` : ''}
            </div>
            ${extra}
          </div>
          ${body}
        </div>
      `;
    }

    // A headline number: a label (with a swatch when it names a series), the value, a line under it
    // (HTML) and an optional trend line.
    function statTile(tile) {
      const { label, value, sub = '', spark = '', swatch = '', delta = '' } = tile;
      return `
        <div class="kpi-card">
          <div class="kpi-label">${swatch ? `<i class="key-swatch" style="background:${escapeHtml(swatch)}"></i>` : ''}${escapeHtml(label)}</div>
          <div class="kpi-value">${escapeHtml(value)}</div>
          ${delta ? `<div class="kpi-delta">${delta}</div>` : ''}
          ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
          ${spark}
        </div>
      `;
    }

    // The window before, in words: "the 24h before", "the 7 days before".
    function previousLabel() {
      return { 24: 'the 24h before', 168: 'the 7 days before', 720: 'the 30 days before', 2160: 'the 90 days before' }[state.windowHours]
        || `the ${state.windowHours}h before`;
    }

    // A headline's change against the window before (plan D2), as a badge; nothing without one.
    function deltaBadge(current, previous, options = {}) {
      return chartDeltaBadge(chartDelta(current, previous, { before: previousLabel(), ...options }));
    }

    // A status never rides on colour alone: a dot and its word.
    function statusMark(kind, word) {
      return `<span class="status-dot" style="background:${CHART_COLORS[kind] || CHART_COLORS.accent}"></span>${escapeHtml(word)}`;
    }

    function capitalize(text) {
      const str = String(text || '');
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function platformLabel(platform) {
      return { ios: 'iOS', android: 'Android', backend: 'Backend' }[platform] || capitalize(platform || 'unknown');
    }

    // Rows of a time chart's "Show numbers" table, newest first.
    function bucketRows(buckets, columns) {
      return buckets.starts.map((_, i) => [chartBucketTitle(buckets, i), ...columns.map(values => values[i] ?? 0)]).reverse();
    }

    // A line above the charts when the totals were counted from rows rather than by the server.
    function totalsNote(source, error = '') {
      if (source === 'rows') {
        return `<div class="totals-note">Counted from the newest snapshot rows only: this backend has no server totals yet (MinamoPokerBE 1.85.0), so a long window comes up short.</div>`;
      }
      if (source === 'local' && error) {
        return `<div class="totals-note">Could not reach the project (${escapeHtml(error)}), so these are counted from the rows this server has synced. Refresh to try again.</div>`;
      }
      if (source === 'local') {
        return `<div class="totals-note">Counted from the rows this server has synced. Add this environment's service key, or the portal's owner key, to MinamoCortex/.env for the server's own totals.</div>`;
      }
      return '';
    }

    function renderPulse(root, data) {
      const s = data.summary;
      const prev = data.previousSummary;
      const briefing = data.briefing || { status: 'healthy', headline: 'All Systems Healthy', actionItems: [] };
      const comp = data.versionComparison;
      const statusDotColor = briefing.status === 'healthy' ? 'var(--green)' : briefing.status === 'warning' ? 'var(--amber)' : 'var(--red)';
      const act = data.activity;
      const per = act && act.buckets.unit === 'day' ? 'day' : 'hour';
      const cf = s.crashFreeSessionsPct;
      const cfMark = cf >= 99.5 ? statusMark('good', 'Healthy') : cf >= 98 ? statusMark('warning', 'Watch') : statusMark('critical', 'Needs attention');
      const avgLength = act ? act.durationMs.map((ms, i) => (act.sessions[i] > 0 ? ms / act.sessions[i] : 0)) : [];
      const hidden = data.testTraffic && !data.testTraffic.included
        ? ` · <span id="testSessionsHidden">${data.testTraffic.hiddenSessions} test session${data.testTraffic.hiddenSessions === 1 ? '' : 's'} hidden</span>`
        : '';

      const activitySeries = act ? [
        { label: 'iOS', color: CHART_COLORS.ios, values: act.ios },
        { label: 'Android', color: CHART_COLORS.android, values: act.android },
        ...(act.other.some(v => v > 0) ? [{ label: 'Other', color: CHART_COLORS.other, values: act.other }] : []),
      ] : [];
      const activityBody = act ? `
        ${chartColumns({ buckets: act.buckets, series: activitySeries, emptyText: `No players in the ${windowLabel()}` })}
        ${chartLegend(activitySeries)}
        ${chartDataTable(['When', ...activitySeries.map(x => x.label), 'Sessions'], bucketRows(act.buckets, [...activitySeries.map(x => x.values), act.sessions]))}
      ` : `<div class="chart-empty" style="height:120px">This server does not send players over time yet.</div>`;

      const versions = data.versionBreakdown || [];
      const shownVersions = versions.slice(0, 8);
      const versionPlatforms = Array.from(new Set(shownVersions.map(v => v.platform)));
      const versionBody = `
        ${chartHBars(shownVersions.map(v => ({
          label: `v${v.appVersion} · ${platformLabel(v.platform)}`,
          value: v.sessions,
          valueText: `${v.adoptionPct}% · ${v.sessions} sessions`,
          sub: `${v.crashFreePct}% crash-free · ${v.users} player${v.users === 1 ? '' : 's'} · ${v.totalErrors} error${v.totalErrors === 1 ? '' : 's'}`,
          color: CHART_COLORS[v.platform] || CHART_COLORS.other,
        })), { emptyText: 'No sessions for this filter' })}
        ${chartLegend(versionPlatforms.map(p => ({ label: platformLabel(p), color: CHART_COLORS[p] || CHART_COLORS.other })))}
        ${versions.length > shownVersions.length ? `<div class="kpi-sub" style="margin-top:10px;">${versions.length - shownVersions.length} older versions not shown</div>` : ''}
      `;

      const topIssues = data.topIssues || [];
      const shownIssues = topIssues.slice(0, 6);
      const eventsWord = issueEventsHeader(topIssues) === 'Events in window' ? 'events in window' : 'events';

      const compareSelect = `
        <select aria-label="Compare version" class="filter-select" id="compareVersionSelect" title="Compare against a version">
          <option value="all"${state.compareVersion === 'all' ? ' selected' : ''}>vs the previous version</option>
          ${(state.versions || []).filter(v => !comp || v !== comp.currentVersion).map(v => `<option value="${escapeHtml(v)}"${v === state.compareVersion ? ' selected' : ''}>vs v${escapeHtml(v)}</option>`).join('')}
        </select>
      `;
      const compHtml = comp ? panelCard(
        `v${comp.currentVersion} against v${comp.previousVersion}`,
        'Release health, session length and start-up time against the version before (or the one you pick).',
        `<div class="kpi-grid" style="margin-bottom:0;">
          <div class="kpi-card">
            <div class="kpi-label">Crash-free sessions</div>
            <div class="kpi-value">${comp.current.crashFreePct}%</div>
            <div class="kpi-sub"><span class="delta-badge ${comp.deltas.crashFreePctDelta >= 0 ? 'good' : 'bad'}">${comp.deltas.crashFreePctDelta >= 0 ? '+' : ''}${comp.deltas.crashFreePctDelta} pts</span> v${escapeHtml(comp.previousVersion)}: ${comp.previous.crashFreePct}%</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Average session</div>
            <div class="kpi-value">${escapeHtml(chartDuration(comp.current.avgSessionSec))}</div>
            <div class="kpi-sub"><span class="delta-badge ${comp.deltas.avgSessionSecDelta >= 0 ? 'good' : 'neutral'}">${comp.deltas.avgSessionSecDelta >= 0 ? '+' : '−'}${escapeHtml(chartDuration(Math.abs(comp.deltas.avgSessionSecDelta)))}</span> v${escapeHtml(comp.previousVersion)}: ${escapeHtml(chartDuration(comp.previous.avgSessionSec))}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Cold start and preload</div>
            <div class="kpi-value">${comp.current.avgStartupMs} ms</div>
            <div class="kpi-sub"><span class="delta-badge ${comp.deltas.startupMsDelta <= 0 ? 'good' : 'bad'}">${comp.deltas.startupMsDelta > 0 ? '+' : ''}${comp.deltas.startupMsDelta} ms</span> v${escapeHtml(comp.previousVersion)}: ${comp.previous.avgStartupMs} ms</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">New open issues in v${escapeHtml(comp.currentVersion)}</div>
            <div class="kpi-value">${comp.deltas.newIssuesInCurrent}</div>
            <div class="kpi-sub">${comp.deltas.newIssuesInCurrent === 0 ? statusMark('good', 'Clean release') : statusMark('warning', 'Needs triage')} · ${comp.current.sessions} sessions</div>
          </div>
        </div>`,
        compareSelect,
      ) : '';

      root.innerHTML = `
        ${totalsNote(data.source, data.sourceError)}
        ${s.totalSessions === 0 && state.environment !== 'demo' ? `
          <div class="panel-card" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;">
            <div>
              <div style="font-weight:700;font-size:14px;color:var(--text);">${escapeHtml(capitalize(state.environment))} is connected: no sessions in the ${escapeHtml(windowLabel())}</div>
              <div style="font-size:12px;color:var(--text-secondary);margin-top:3px;">Try a longer window above, or the demo to see every chart with sample data.</div>
            </div>
            <button class="btn primary" onclick="setEnvironment('demo')">Open the demo</button>
          </div>
        ` : ''}
        <div class="briefing-card ${escapeHtml(briefing.status)}">
          <div class="briefing-header">
            <div class="briefing-title">
              <span style="width:10px;height:10px;border-radius:50%;background:${statusDotColor};display:inline-block;"></span>
              <span>${escapeHtml(briefing.headline)}</span>
            </div>
          </div>
          ${(briefing.actionItems && briefing.actionItems.length > 0) ? `
            <div class="action-items-row">
              ${briefing.actionItems.map(item => `
                <div class="action-chip" onclick="handleActionChipClick('${escapeHtml(item.targetTab)}', ${item.targetId || 0})">
                  <span class="pill ${item.severity === 'critical' ? 'regressed' : item.severity === 'warning' ? 'unresolved' : 'healthy'}">${escapeHtml(item.label)}</span>
                  <span style="color:var(--text-secondary)">${escapeHtml(item.detail)}</span>
                  <span style="color:var(--accent);font-weight:700;">→</span>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>

        <div class="kpi-grid">
          ${statTile({ label: 'Active players', value: s.activeUsers, delta: prev ? deltaBadge(s.activeUsers, prev.activeUsers) : '', sub: `${s.totalSessions} session${s.totalSessions === 1 ? '' : 's'}${hidden}`, spark: act ? chartSparkline(act.players) : '' })}
          ${statTile({ label: 'Crash-free sessions', value: `${cf}%`, delta: prev && s.totalSessions > 0 ? deltaBadge(cf, prev.crashFreeSessionsPct, { kind: 'pct' }) : '', sub: `${cfMark} · ${s.crashedSessions} crashed · ${s.erroredSessions} with an error`, spark: act ? chartSparkline(act.crashed, CHART_COLORS.critical) : '' })}
          ${statTile({ label: 'Crash-free players', value: `${s.crashFreeUsersPct}%`, delta: prev && s.activeUsers > 0 ? deltaBadge(s.crashFreeUsersPct, prev.crashFreeUsersPct, { kind: 'pct' }) : '', sub: `of ${s.activeUsers} player${s.activeUsers === 1 ? '' : 's'}` })}
          ${statTile({ label: 'Average session', value: chartDuration(s.avgSessionSec), delta: prev && prev.totalSessions > 0 && s.totalSessions > 0 ? deltaBadge(s.avgSessionSec, prev.avgSessionSec, { kind: 'duration' }) : '', sub: `Across ${s.totalSessions} session${s.totalSessions === 1 ? '' : 's'}`, spark: chartSparkline(avgLength) })}
        </div>

        ${panelCard(`Active players per ${per}`, `iOS and Android, ${windowLabel()}, in your time zone. A player counts once per ${per}.`, activityBody)}

        <div class="grid-2">
          ${panelCard('Versions', 'Sessions per version and platform, with each one’s crash-free rate.', versionBody)}
          ${panelCard('Top issues', 'Regressions first, then by events. Open one for its stack trace and the player\u2019s steps.', `
            <div class="issue-list">
              ${shownIssues.map(iss => `
                <button type="button" class="issue-row" onclick="openIssueDetail(${Number(iss.id)})">
                  <span class="issue-main">
                    <span class="issue-title">${escapeHtml(iss.title)}</span>
                    <span class="issue-meta">${escapeHtml(platformLabel(iss.platform))} · ${issueEventsCount(iss)} ${eventsWord} · ${iss.affected_users_count ?? 1} player${(iss.affected_users_count ?? 1) === 1 ? '' : 's'} · v${escapeHtml(iss.first_seen_version)} → v${escapeHtml(iss.last_seen_version)}</span>
                  </span>
                  <span class="pill ${escapeHtml(iss.status)}">${escapeHtml(iss.status)}</span>
                </button>
              `).join('') || '<div class="kpi-sub">No open issues in this window.</div>'}
            </div>
            ${topIssues.length > shownIssues.length ? `<button type="button" class="btn" style="margin-top:12px;" onclick="switchTab('triage')">All ${topIssues.length} issues in Triage →</button>` : ''}
          `)}
        </div>

        ${compHtml}
      `;
    }

    // New players per day (owner, 2026-10-26: "how many new android users vs ios users for the day").
    // The rows are the backend's new_players (1.79.3; the local server's synced copy): one per account
    // made, never a bot, team and test accounts only while test traffic is shown. Days are counted in
    // the viewer's time zone, newest first; null when the backend sends none.
    function newPlayersByDay(rows, days = 14) {
      if (!Array.isArray(rows)) return null;
      const dayKey = (d) => d.toLocaleDateString('en-CA');
      const now = new Date();
      const buckets = [];
      for (let i = 0; i < days; i++) {
        const date = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
        buckets.push({ key: dayKey(date), date, offset: i, ios: 0, android: 0, unknown: 0, total: 0, linked: 0 });
      }
      const byKey = new Map(buckets.map(b => [b.key, b]));
      for (const r of rows) {
        if (state.platform !== 'all' && r.platform !== state.platform) continue;
        const created = new Date(r.created_at);
        if (Number.isNaN(created.getTime())) continue;
        const bucket = byKey.get(dayKey(created));
        if (!bucket) continue;
        const platform = r.platform === 'ios' || r.platform === 'android' ? r.platform : 'unknown';
        bucket[platform]++;
        bucket.total++;
        if (r.linked) bucket.linked++;
      }
      return buckets;
    }

    // The last 7 days and the 7 before them as rolling 168-hour windows, so the change compares two
    // windows of the same length (review 3 finding 9: today's part day plus six against seven full
    // days read as a drop every morning). The platform filter applies, as for the days.
    function newPlayersRolling(rows, nowMs = Date.now()) {
      const week = 7 * 24 * 3600 * 1000;
      const out = { ios: 0, android: 0, total: 0, previous: 0 };
      for (const r of rows || []) {
        if (state.platform !== 'all' && r.platform !== state.platform) continue;
        const t = Date.parse(r.created_at);
        if (!Number.isFinite(t) || t > nowMs) continue;
        if (t >= nowMs - week) {
          out.total++;
          if (r.platform === 'ios' || r.platform === 'android') out[r.platform]++;
        } else if (t >= nowMs - 2 * week) {
          out.previous++;
        }
      }
      return out;
    }

    function newPlayersDayLabel(bucket) {
      if (bucket.offset === 0) return 'Today';
      if (bucket.offset === 1) return 'Yesterday';
      return bucket.date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function queueQualityNote(mode) {
      const notes = [];
      if (mode.duplicateQueueEvents) notes.push(`${mode.duplicateQueueEvents} repeated event${mode.duplicateQueueEvents === 1 ? '' : 's'} ignored`);
      if (mode.unmatchedQueueOutcomes) notes.push(`${mode.unmatchedQueueOutcomes} outcome${mode.unmatchedQueueOutcomes === 1 ? '' : 's'} without a matching start excluded`);
      if (mode.invalidQueueEvents) notes.push(`${mode.invalidQueueEvents} event${mode.invalidQueueEvents === 1 ? '' : 's'} without a usable session or timestamp excluded`);
      if (mode.conflictingQueueOutcomes) notes.push(`${mode.conflictingQueueOutcomes} conflicting outcome${mode.conflictingQueueOutcomes === 1 ? '' : 's'} reconciled; seating takes precedence`);
      if (mode.incompleteQueueAttempts) notes.push(`${mode.incompleteQueueAttempts} attempt${mode.incompleteQueueAttempts === 1 ? '' : 's'} with no recorded outcome`);
      return notes.join(' · ');
    }

    function renderNewPlayersCard(rows) {
      const days = newPlayersByDay(rows);
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'local time';
      if (!days) {
        return `
          <div class="panel-card">
            <div class="panel-title">New players per day</div>
            <div class="panel-subtitle">This environment's backend does not send new players yet (backend 1.79.3 or later).</div>
          </div>
        `;
      }
      const today = days[0];
      const week = newPlayersRolling(rows);
      const share = (n, total) => total > 0 ? `${Math.round((n / total) * 100)}%` : '–';
      // The chart runs oldest to newest; its buckets are the same local days.
      const oldestFirst = days.slice().reverse();
      const end = new Date(today.date);
      end.setDate(end.getDate() + 1);
      const buckets = { unit: 'day', starts: oldestFirst.map(b => b.date.getTime()), end: end.getTime() };
      const series = [
        { label: 'iOS', color: CHART_COLORS.ios, values: oldestFirst.map(b => b.ios) },
        { label: 'Android', color: CHART_COLORS.android, values: oldestFirst.map(b => b.android) },
        ...(oldestFirst.some(b => b.unknown > 0) ? [{ label: 'Unknown', color: CHART_COLORS.other, values: oldestFirst.map(b => b.unknown) }] : []),
      ];
      return panelCard(
        'New players per day',
        `Accounts made per day in your time zone (${timeZone}), the last 14 days whatever the window. Bots never count; team and test accounts only while test traffic is shown. Platform: the app's install report, else its first Cortex session.`,
        `
          <div class="kpi-grid">
            ${statTile({ label: 'Today · iOS', value: today.ios, sub: `${share(today.ios, today.total)} of today's new players`, swatch: CHART_COLORS.ios })}
            ${statTile({ label: 'Today · Android', value: today.android, sub: `${share(today.android, today.total)} of today's new players`, swatch: CHART_COLORS.android })}
            ${statTile({ label: 'Today · All', value: today.total, sub: `${today.unknown} unknown platform · ${today.linked} linked Apple/Google` })}
            ${statTile({ label: 'Last 7 days', value: week.total, delta: chartDeltaBadge(chartDelta(week.total, week.previous, { before: 'the 7 days before' })), sub: `iOS ${week.ios} · Android ${week.android} · the last 168 hours` })}
          </div>
          ${chartColumns({ buckets, series, height: 140, emptyText: 'No new players in the last 14 days' })}
          ${chartLegend(series)}
          ${chartDataTable(['Day', 'iOS', 'Android', 'Unknown', 'Total', 'Linked'], days.map(b => [newPlayersDayLabel(b), b.ios, b.android, b.unknown, b.total, b.linked]))}
        `,
      );
    }

    function renderPlayers(root, data) {
      const PANEL_VERDICTS = {
        loved: { label: 'Loved', color: CHART_COLORS.good },
        healthy: { label: 'Healthy', color: CHART_COLORS.accent },
        underused: { label: 'Underused', color: CHART_COLORS.warning },
        ignored: { label: 'Ignored', color: CHART_COLORS.critical },
      };
      const EXPRESSION_SET_ORDER = ['default', 'set1', 'set2', 'spades', 'hearts', 'diamonds', 'clubs'];
      const features = data.featureLeaderboard || [];
      const showroom = (data.characterShowroom || []).filter(c => c.equippedCount > 0 || c.previews > 0);
      const verdicts = Object.keys(PANEL_VERDICTS).filter(k => features.some(f => f.status === k));
      const opened = features.filter(f => f.opens > 0);
      const sets = (data.expressionPopularity || []).slice()
        .sort((a, b) => EXPRESSION_SET_ORDER.indexOf(a.setKey) - EXPRESSION_SET_ORDER.indexOf(b.setKey));

      root.innerHTML = `
        ${totalsNote(data.source, data.sourceError)}
        ${renderNewPlayersCard(data.newPlayers)}

        <div class="grid-2">
          ${panelCard('Player journey', `Players reaching each step, ${windowLabel()}. Each bar is the share of the first step.`, chartFunnel(data.journeyFunnel))}
          ${panelCard('What players open', 'Each home panel’s reach: the share of players who opened it. Loved: 45% or more, and most stay to use it. Ignored: under 12%.', `
            ${chartHBars(opened.map(f => {
              const verdict = PANEL_VERDICTS[f.status] || PANEL_VERDICTS.healthy;
              return {
                label: f.label,
                value: f.dauSharePct,
                valueText: `${f.dauSharePct}%`,
                sub: `${verdict.label} · ${f.opens} open${f.opens === 1 ? '' : 's'} · ${f.avgDwellSec}s average · ${f.interactionRatePct}% interact`,
                color: verdict.color,
                tip: `${f.label} (${f.group})\n${f.dauSharePct}% of players · ${f.uniqueUsers} players\n${f.opens} opens, ${f.opensPerUser} per player\n${f.avgDwellSec}s average · ${f.interactionRatePct}% interact\n${verdict.label}`,
              };
            }), { max: 100, emptyText: 'No panels opened in this window' })}
            ${opened.length ? chartLegend(verdicts.map(k => PANEL_VERDICTS[k])) : ''}
            ${features.length > opened.length ? `<div class="kpi-sub" style="margin-top:10px;">Not opened: ${escapeHtml(features.filter(f => f.opens === 0).map(f => f.label).join(', '))}</div>` : ''}
          `)}
        </div>

        <div class="grid-2">
          ${panelCard('Characters', 'Times each character was picked or equipped, with the store’s previews and purchases of it.', chartHBars(showroom.map(c => ({
            label: capitalize(c.characterId),
            value: c.equippedCount,
            valueText: `${c.equippedCount} · ${c.sharePct}%`,
            sub: `${c.previews} preview${c.previews === 1 ? '' : 's'} · ${c.purchases} bought · ${c.abandons} abandoned · ${c.conversionPct}% preview to buy`,
          })), { emptyText: 'No characters picked in this window' }))}
          ${panelCard('Expression sets', 'Picks, previews and purchases that name a set.', chartShareBar(sets.map(e => ({
            label: capitalize(e.setKey),
            value: e.count,
            color: CHART_SERIES[Math.max(0, EXPRESSION_SET_ORDER.indexOf(e.setKey)) % CHART_SERIES.length],
          })), { emptyText: 'No sets named in this window' }))}
        </div>
      `;
    }

    // Why a tab has no server totals: the backend has no such action yet, or the local server has no
    // service key for the environment (it syncs neither the ledger nor the hand tables).
    function totalsMissingCard(source, what, error = '') {
      const text = source === 'key'
        ? `Add this environment's service key, or the portal's owner key, to MinamoCortex/.env: the local server asks the project for its ${what} totals and does not sync the tables they come from.`
        : source === 'unreachable'
          ? `Could not load the ${what} totals${error ? ` (${error})` : ''}. Refresh to try again.`
          : `This backend has no ${what} totals yet (MinamoPokerBE 1.89.0). Staging has them; production gets them with the release.`;
      return `<div class="totals-note">${escapeHtml(text)}</div>`;
    }

    // A small table people read down: the first column names the row; cells are text.
    function miniTable(headers, rows, numeric = []) {
      if (!rows.length) return '<div class="kpi-sub">Nobody in this window.</div>';
      return `<div class="table-scroll"><table class="mini-table">
        <thead><tr>${headers.map((h, i) => `<th class="${numeric.includes(i) ? 'num' : ''}">${escapeHtml(h)}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i === 0 ? 'name' : numeric.includes(i) ? 'num' : ''}">${escapeHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>`;
    }

    // A server histogram as a chart with its numbers behind "Show numbers".
    function histogramBody(histogram, options = {}) {
      const bins = chartHistogramBins(histogram, options);
      return `${chartBins(bins, { height: options.height || 120, color: options.color, emptyText: options.emptyText || `Nothing in the ${windowLabel()}`, unitLabel: options.unitLabel || '' })}
        ${chartDataTable([options.binHeader || 'Range', options.unitHeader || 'Count'], bins.map(b => [b.label, b.value]))}`;
    }

    function renderGames(root, data) {
      const MODE_LABELS = { casual: 'Casual', ranked: 'Ranked', tourney: 'Tourney' };
      const PLAY_MODES = ['casual', 'ranked', 'tourney'];
      const LEAVE_LABELS = {
        voluntary: 'Left on their own',
        busted_chips: 'Busted (out of chips)',
        timeout_kicked: 'Kicked for timing out',
        disconnected: 'Connection dropped',
      };
      const OUTCOMES = [
        { key: 'won', label: 'Won', color: CHART_SERIES[5] },
        { key: 'lost', label: 'Lost', color: CHART_SERIES[7] },
        { key: 'folded', label: 'Folded', color: CHART_COLORS.other },
      ];

      const qualityTiles = `
        <div class="kpi-grid">
          ${statTile({ label: 'Queue attempts', value: attempts, sub: modes.map(m => `${MODE_LABELS[m.mode] || m.mode} ${m.queueJoins}`).join(' · ') })}

      const queueCards = `
        <div class="grid-2">
          ${panelCard('Modes and matchmaking', 'Cancellation rate and wait time count each queue attempt once. Attempts are reconstructed from session events; seating takes precedence when a cancellation races with a match.', `
            ${attempts > 0 ? chartHBars(modes.map(m => ({
              label: MODE_LABELS[m.mode] || m.mode,
              value: m.queueJoins,
              valueText: `${m.queueJoins} attempt${m.queueJoins === 1 ? '' : 's'}`,
              sub: `${m.avgWaitSec}s average wait · ${m.queueJoins > 0 ? `${m.cancelRatePct}% cancelled (${m.queueCancels || 0} of ${m.queueJoins} attempts)` : 'none cancelled'} · ${m.aiFallbackPct}% with bots · ${m.avgHandsPerSession} hands per table`,

            ${notes}

          ${panelCard('Why players leave tables', 'Each table a player left, by why they left it.', chartHBars(leaves.map(l => ({
            label: LEAVE_LABELS[l.reason] || l.reason,

        </div>`;

      if (!p) {
        root.innerHTML = `
          ${totalsNote(data.source, data.sourceError)}
          ${totalsMissingCard(data.totalsSource, 'games', data.totalsError)}
          <div class="kpi-grid">
            ${statTile({ label: 'Hands played', value: insights.totalHandsCompleted || 0, sub: capitalize(windowLabel()), spark: chartSparkline(handTotals) })}
          </div>
          ${qualityTiles}
          ${panelCard(`Hands per ${per}`, `Hands completed by mode, ${windowLabel()}, in your time zone.`, handsBody)}
          ${queueCards}
        `;
        return;
      }

      const prev = p.previous || {};
      const games = PLAY_MODES.reduce((a, m) => a + Number(p.games[m].games || 0), 0);
      const playerHands = PLAY_MODES.reduce((a, m) => a + Number(p.hands[m].playerHands || 0), 0);
      const won = PLAY_MODES.reduce((a, m) => a + Number(p.hands[m].won || 0), 0);
      const gameSeries = PLAY_MODES.map(m => ({ label: MODE_LABELS[m], color: CHART_COLORS[m], values: p.series[m] }));
      const gameTotals = p.series.casual.map((v, i) => v + p.series.ranked[i] + p.series.tourney[i]);
      const houseSeries = PLAY_MODES.map(m => ({ label: MODE_LABELS[m], color: CHART_COLORS[m], values: p.house[m].series }));
      const houseNet = PLAY_MODES.reduce((a, m) => a + Number(p.house[m].net || 0), 0);
      const lengthMedians = PLAY_MODES.filter(m => p.lengths[m].count > 0)
        .map(m => `${MODE_LABELS[m]} ${chartDurationShort(p.lengths[m].medianSec)} (${p.lengths[m].count})`).join(' · ');
      const outcomeBars = PLAY_MODES.filter(m => p.hands[m].playerHands > 0).map(m => `
        <div class="chart-subhead">${escapeHtml(MODE_LABELS[m])} · ${chartCompact(p.hands[m].playerHands)} hand${p.hands[m].playerHands === 1 ? '' : 's'} by players</div>
        ${chartShareBar(OUTCOMES.map(o => ({ label: o.label, value: p.hands[m][o.key], color: o.color })))}
      `).join('') || `<div class="chart-empty" style="height:60px">No hands in this window</div>`;
      const seatSizes = Array.from(new Set((p.ranked.places || []).map(x => x.seats))).sort();
      const placeBars = seatSizes.map(seats => `
        <div class="chart-subhead">${seats}-player tables</div>
        ${chartShareBar(p.ranked.places.filter(x => x.seats === seats).map(x => ({ label: `${x.placement}${['st', 'nd', 'rd'][x.placement - 1] || 'th'}`, value: x.count, color: CHART_SERIES[(x.placement - 1) % CHART_SERIES.length] })))}
      `).join('') || `<div class="chart-empty" style="height:60px">No ranked games in this window</div>`;
      const t = p.tourney;
      const bots = p.botsVsPlayers || [];
      const listRow = r => [r.username || String(r.userId).slice(0, 8), chartDuration(r.tableSec), r.games, r.hands, chartSigned(r.netChips)];
      const moneyRow = r => [r.username || String(r.userId).slice(0, 8), chartSigned(r.netChips), chartSigned(r.casual), chartSigned(r.ranked), chartSigned(r.tourney)];

      const filterNote = state.platform !== 'all' || state.appVersion !== 'all'
        ? '<div class="totals-note">Games, hands and players count every platform and app version: the game tables record no device. The hands-per-hour chart and the queue tiles follow the filter.</div>'
        : '';

      root.innerHTML = `
        ${totalsNote(data.source, data.sourceError)}
        ${filterNote}
        <div class="kpi-grid">
          ${statTile({ label: 'Games played', value: games, delta: deltaBadge(games, prev.games), sub: PLAY_MODES.map(m => `${MODE_LABELS[m]} ${p.games[m].games}`).join(' · '), spark: chartSparkline(gameTotals) })}
          ${statTile({ label: 'Hands played', value: playerHands, delta: deltaBadge(playerHands, prev.playerHands), sub: 'Each player’s hands, every mode', spark: chartSparkline(p.series.hands) })}
          ${statTile({ label: 'Players who played', value: p.players, delta: deltaBadge(p.players, prev.players) })}
          ${statTile({ label: 'Median game', value: chartDurationShort(p.lengths.all.medianSec), delta: deltaBadge(p.lengths.all.medianSec, prev.medianGameSec, { kind: 'duration', better: null }), sub: `${p.lengths.all.count} game${p.lengths.all.count === 1 ? '' : 's'} ended` })}
          ${statTile({ label: 'Time at tables', value: chartDurationShort(p.tableTime.medianSecPerPlayer), delta: deltaBadge(p.tableTime.medianSecPerPlayer, prev.medianSecPerPlayer, { kind: 'duration' }), sub: `Median per player · ${chartDuration(p.tableTime.totalSec)} in all` })}
          ${statTile({ label: 'Hands won', value: won, delta: deltaBadge(won, prev.handsWon, { better: null }), sub: playerHands > 0 ? `${Math.round((won / playerHands) * 1000) / 10}% of players’ hands` : 'No hands' })}
        </div>
        ${qualityTiles}

        ${panelCard(`Games per ${per}`, `Casual seatings, ranked games and tourney entries by real players, ${windowLabel()}, in your time zone. A game counts when it starts.`, `
          ${chartColumns({ buckets: p.buckets, series: gameSeries, emptyText: `No games in the ${windowLabel()}` })}
          ${chartLegend(gameSeries)}
          ${chartDataTable(['When', ...gameSeries.map(x => x.label), 'Total'], bucketRows(p.buckets, [...gameSeries.map(x => x.values), gameTotals]))}
        `)}

        ${panelCard(`Hands per ${per}`, `Hands completed by mode, ${windowLabel()}, in your time zone.`, handsBody)}

        <div class="grid-2">
          ${panelCard('How long a game lasts', `Games that ended in the window. Casual: a seating, from its buy-in to the seat’s end (a busted seat at its last hand). Ranked and tourney: the table. Median ${lengthMedians || 'none yet'}.`,
            histogramBody(p.lengths.all.histogram, { format: chartDurationShort, emptyText: 'No games ended in this window', binHeader: 'Length', unitHeader: 'Games', unitLabel: 'games' }))}
          ${panelCard('How long people play', `Time at tables per player per day (median ${chartDuration(p.tableTime.p50)} over ${p.tableTime.playerDays} player-day${p.tableTime.playerDays === 1 ? '' : 's'}), and how long the app stays open.`, `
            <div class="chart-subhead">Time at tables, per player per day</div>
            ${histogramBody(p.tableTime.histogram, { format: chartDurationShort, emptyText: 'Nobody at a table in this window', binHeader: 'Time', unitHeader: 'Player-days', unitLabel: 'player-days' })}
            <div class="chart-subhead">App sessions · median ${escapeHtml(chartDuration(p.appSessions.medianSec))} over ${p.appSessions.count}</div>
            ${histogramBody(p.appSessions.histogram, { format: chartDurationShort, emptyText: 'No sessions in this window', binHeader: 'Length', unitHeader: 'Sessions', unitLabel: 'sessions' })}
          `)}
        </div>

        <div class="grid-2">
          ${panelCard('Winning and losing', 'Each player’s hands by how they ended, and the chips a player won or lost per hand (net of the bet).', `
            ${outcomeBars}
            <div class="chart-subhead">Net chips per hand</div>
            ${histogramBody(p.netPerHand, { integer: true, emptyText: 'No hands in this window', binHeader: 'Net chips', unitHeader: 'Hands', unitLabel: 'hands' })}
          `)}
          ${panelCard('Ranked places, MMR and tourneys', 'Where real players finished, the MMR each finished game moved, and the tourneys’ places and prizes.', `
            ${placeBars}
            <div class="chart-subhead">MMR change per game · median ${escapeHtml(chartSigned(p.ranked.mmrChange.median ?? 0))} over ${p.ranked.mmrChange.count}</div>
            ${histogramBody(p.ranked.mmrChange.histogram, { integer: true, emptyText: 'No finished ranked games in this window', binHeader: 'MMR', unitHeader: 'Games', unitLabel: 'games' })}

            ${chartHBars((t.places || []).map(x => ({
              label: `${x.placement}${['st', 'nd', 'rd'][x.placement - 1] || 'th'} place`,
              value: x.count,
              valueText: `${x.count} · ${x.tokens} token${x.tokens === 1 ? '' : 's'}`,

            })), { emptyText: 'No tourney places in this window' })}
            <div class="kpi-sub" style="margin-top:8px;">Entries cost ${escapeHtml(chartCompact(t.costChips))} chips; prizes paid ${t.prizeTokens} token${t.prizeTokens === 1 ? '' : 's'} and ${escapeHtml(chartCompact(t.prizeChips))} chips; ${t.entriesReturned} entr${t.entriesReturned === 1 ? 'y' : 'ies'} given back.</div>
          `)}
        </div>

        ${panelCard('Players against the house', `Real players’ net chips at the tables per ${per}: below zero the house won (bots, the ranked rake, and players not counted here). A seat still open counts its buy-in until it ends. In the window: ${PLAY_MODES.map(m => `${MODE_LABELS[m]} ${chartSigned(p.house[m].net)}`).join(' · ')} · net ${chartSigned(houseNet)}.`, `
          ${chartDiverging({ buckets: p.buckets, series: houseSeries, emptyText: `No table chips moved in the ${windowLabel()}` })}
          ${chartLegend(houseSeries)}
          ${chartDataTable(['When', ...houseSeries.map(x => x.label), 'Net'], bucketRows(p.buckets, [...houseSeries.map(x => x.values), p.buckets.starts.map((_, i) => houseSeries.reduce((a, x) => a + Number(x.values[i] || 0), 0))]))}
        `)}

        ${panelCard('Against bots, by stake', 'Casual hands where the player was the only human dealt in (the A2 report). Big blinds won per 100 hands, with its 95% range: a few hundred hands carry about ±60 bb/100 of noise, so read the range before the number.', miniTable(
          ['Stake', 'Bots', 'Hands', 'Players up / down', 'bb/100', '± 95%', 'Net chips', 'Hands won'],
          bots.map(b => [
            `${b.name || capitalize(b.stake)} ${b.smallBlind}/${b.bigBlind}`,
            capitalize(b.botDifficulty),
            chartCompact(b.hands),
            `${b.playersUp} / ${b.playersDown} of ${b.players}`,
            chartSigned(b.bbPer100),
            b.ci95 == null ? '–' : `±${b.ci95}`,
            chartSigned(b.netChips),
            `${b.handsWonPct}%`,
          ]),
          [2, 4, 5, 6, 7],
        ))}

        ${queueCards}

        <div class="grid-2">
          ${panelCard('Most time at tables', 'Real players by their time at tables in the window, with their games, hands and net chips.', miniTable(['Player', 'Time', 'Games', 'Hands', 'Net chips'], p.lists.mostActive.map(listRow), [1, 2, 3, 4]))}
          ${panelCard('Biggest winners and losers', 'Net chips from casual, ranked and tourney tables in the window.', `
            <div class="chart-subhead">Winners</div>
            ${miniTable(['Player', 'Net', 'Casual', 'Ranked', 'Tourney'], p.lists.winners.map(moneyRow), [1, 2, 3, 4])}
            <div class="chart-subhead">Losers</div>
            ${miniTable(['Player', 'Net', 'Casual', 'Ranked', 'Tourney'], p.lists.losers.map(moneyRow), [1, 2, 3, 4])}
          `)}
        </div>
      `;
    }

    // Economy (plan D9): where chips come from and go, real money at list price (Q2 a), tokens and
    // balances, from the server's totals (cortex-admin `economy`, MinamoPokerBE 1.89.0; the demo
    // draws its own). The store events the apps send stay at the bottom.
    const ECONOMY_SERIES = [
      { key: 'spins', label: 'Spins', color: CHART_SERIES[3], flows: ['spins'] },
      { key: 'bought', label: 'Bought chips', color: CHART_SERIES[4], flows: ['purchased'] },
      { key: 'grants', label: 'Sign-ups, bonuses, grants', color: CHART_SERIES[6], flows: ['signup', 'bonus', 'admin'] },
      { key: 'casual', label: 'Casual tables', color: CHART_COLORS.casual, flows: ['casual'] },
      { key: 'ranked', label: 'Ranked tables', color: CHART_COLORS.ranked, flows: ['ranked'] },
      { key: 'tourney', label: 'Tourneys', color: CHART_COLORS.tourney, flows: ['tourney'] },
      { key: 'store', label: 'Store', color: CHART_SERIES[7], flows: ['store_skins', 'store_sets', 'store_parts', 'store_collections'] },
      { key: 'other', label: 'Merged guests and other', color: CHART_COLORS.other, flows: ['transfer', 'other'] },
    ];
    const STORE_KINDS = [
      { key: 'skins', label: 'Frames and tables', flow: 'store_skins' },
      { key: 'sets', label: 'Sets', flow: 'store_sets' },
      { key: 'parts', label: 'Parts', flow: 'store_parts' },
      { key: 'collections', label: 'Collections', flow: 'store_collections' },
    ];
    const TOKEN_EARNED = ['win', 'prize', 'refund', 'admin_adjustment', 'account_merge', 'debug_grant'];

    function renderEconomy(root, data) {
      const showroom = (data.characterShowroom || []).filter(c => c.previews > 0 || c.purchases > 0 || c.abandons > 0);
      const insights = data.tableInsights || {};
      const total = key => showroom.reduce((a, c) => a + (Number(c[key]) || 0), 0);
      const previews = total('previews');
      const purchases = total('purchases');
      const storeEvents = `
        <div class="kpi-grid">
          ${statTile({ label: 'Store previews', value: previews, sub: 'What the apps report' })}
          ${statTile({ label: 'Purchases', value: purchases, sub: previews > 0 ? `${Math.round((purchases / previews) * 1000) / 10}% of previews` : 'No previews' })}
          ${statTile({ label: 'Purchases abandoned', value: insights.purchaseAbandonedCount || 0, sub: 'Opened and backed out' })}
          ${statTile({ label: 'Out of chips', value: insights.insufficientFundsCount || 0, sub: 'A buy-in or store tap blocked by a low balance' })}
        </div>
        ${panelCard('Store by character', `Previews of each character’s items and what was bought, ${windowLabel()}, as the apps report them.`, chartHBars(showroom.map(c => ({
          label: capitalize(c.characterId),
          value: c.previews,
          valueText: `${c.previews} preview${c.previews === 1 ? '' : 's'} · ${c.purchases} bought`,
          sub: `${c.conversionPct}% preview to buy · ${c.abandons} abandoned`,
        })), { emptyText: 'No store previews in this window' }))}
      `;
      const e = data.totals;
      if (!e) {
        root.innerHTML = `${totalsNote(data.source, data.sourceError)}${totalsMissingCard(data.totalsSource, 'economy', data.totalsError)}${storeEvents}`;
        return;
      }

      const per = e.buckets.unit === 'day' ? 'day' : 'hour';
      const prev = e.previous || {};
      const n = e.buckets.starts.length;
      const flowOf = name => (e.flows || []).find(f => f.flow === name);
      const seriesOf = names => Array.from({ length: n }, (_, i) => names.reduce((a, name) => a + Number(flowOf(name)?.series?.[i] || 0), 0));
      const flowSeries = ECONOMY_SERIES.map(x => ({ label: x.label, color: x.color, values: seriesOf(x.flows) }))
        .filter(x => x.values.some(v => v !== 0));
      const flowTotal = names => names.reduce((a, name) => a + Number(flowOf(name)?.amount || 0), 0);
      // Real money follows the platform where the server splits it by store (1.94.0 `byPlatform`; review 3
      // finding 7); the chip ledger records no device or version, so chips count every one.
      const store = (state.platform === 'ios' || state.platform === 'android') && e.money.byPlatform ? state.platform : null;
      const m = store ? { ...e.money, ...e.money.byPlatform[store] } : e.money;
      const moneyPrev = store ? ((prev.byPlatform || {})[store] || {}) : prev;
      const moneySeries = [
        { key: 'ios', label: 'iOS', color: CHART_COLORS.ios, values: e.money.series.ios.map(Number) },
        { key: 'android', label: 'Android', color: CHART_COLORS.android, values: e.money.series.android.map(Number) },
      ].filter(x => !store || x.key === store);
      const products = new Map();
      for (const x of e.money.byProduct || []) {
        if (store && x.platform && x.platform !== store) continue;
        const row = products.get(x.productId) || { ...x, purchases: 0, buyers: 0, revenueUsd: 0 };
        row.purchases += Number(x.purchases) || 0;
        row.buyers += Number(x.buyers) || 0;
        row.revenueUsd = Math.round((Number(row.revenueUsd) + Number(x.revenueUsd || 0)) * 100) / 100;
        products.set(x.productId, row);
      }
      const byProduct = Array.from(products.values());
      const filterNote = state.platform === 'all' && state.appVersion === 'all' ? '' : [
        state.platform !== 'all' && store ? 'Real money below follows the platform: each receipt names its store.' : '',
        state.platform !== 'all' && !store ? 'This backend sends real money for every platform together; a newer backend splits it by store.' : '',
        'The chip ledger records no device or app version, so chips count every platform and version.',
        state.appVersion !== 'all' ? 'Receipts record no app version either.' : '',
      ].filter(Boolean).join(' ');
      const kinds = STORE_KINDS.map((k, i) => ({ label: k.label, value: -flowTotal([k.flow]), color: CHART_SERIES[i] }));
      const tokenTypes = Array.from(new Set((e.tokens || []).map(x => x.tokenType))).sort();
      const tokenRows = tokenTypes.map(type => {
        const rows = e.tokens.filter(x => x.tokenType === type);
        const sumOf = keep => rows.filter(keep).reduce((a, x) => a + Number(x.amount), 0);
        return [
          capitalize(type),
          sumOf(x => TOKEN_EARNED.includes(x.reason) && x.amount > 0),
          -sumOf(x => x.reason === 'purchase'),
          -sumOf(x => x.reason === 'exchange' && x.amount < 0),
          sumOf(x => x.reason === 'exchange' && x.amount > 0),
        ];
      });
      const w = e.wealth;
      const d = e.perPlayerDay;
      const payingShare = e.totals.activePlayers > 0 ? `${Math.round((m.buyers / e.totals.activePlayers) * 1000) / 10}%` : '–';

      root.innerHTML = `
        ${totalsNote(data.source, data.sourceError)}
        ${filterNote ? `<div class="totals-note">${escapeHtml(filterNote)}</div>` : ''}
        <div class="kpi-grid">
          ${statTile({ label: 'Chips created', value: chartCompact(e.totals.created), delta: deltaBadge(e.totals.created, prev.created, { better: null }), sub: 'Spins, bought chips, sign-ups, bonuses, grants, and what players won at tables' })}
          ${statTile({ label: 'Chips removed', value: chartCompact(e.totals.removed), delta: deltaBadge(e.totals.removed, prev.removed, { better: null }), sub: 'The store, and what players lost at tables' })}
          ${statTile({ label: 'Players’ chips, net', value: chartSigned(e.totals.net), delta: deltaBadge(e.totals.net, prev.net, { better: null }), sub: `${e.totals.activePlayers} player${e.totals.activePlayers === 1 ? '' : 's'} moved chips · ${e.totals.newAccounts} new account${e.totals.newAccounts === 1 ? '' : 's'}` })}
          ${statTile({ label: 'Revenue at list price', value: chartUsd(m.revenueUsd), delta: deltaBadge(Number(m.revenueUsd), moneyPrev.revenueUsd, { kind: 'usd' }), sub: `${m.purchases} purchase${m.purchases === 1 ? '' : 's'} · ${m.buyers} paying player${m.buyers === 1 ? '' : 's'}` })}
        </div>

        ${panelCard('Where chips came from and went', `Per ${per}, ${windowLabel()}, in your time zone: above zero what was created, below what was removed; the tick is the net. Table rows net to what real players won or lost there; a seat still open counts its buy-in until it ends. A guest who links an account arrives as one row: the link deletes the guest’s own history.`, `
          ${chartDiverging({ buckets: e.buckets, series: flowSeries, height: 200, emptyText: `No chips moved in the ${windowLabel()}` })}
          ${chartLegend(flowSeries)}
          ${chartDataTable(['When', ...flowSeries.map(x => x.label), 'Net'], bucketRows(e.buckets, [...flowSeries.map(x => x.values), e.buckets.starts.map((_, i) => flowSeries.reduce((a, x) => a + Number(x.values[i] || 0), 0))]))}
        `)}

        <div class="grid-2">
          ${panelCard('Real money', `List price in USD before Apple’s and Google’s fees (no currency or fee is stored). Paying players: ${m.buyers} of the ${e.totals.activePlayers} who moved chips (${payingShare}). A purchase leaves these totals when its account is merged or deleted: the receipt goes with the account.`, `
            ${chartColumns({ buckets: e.buckets, series: moneySeries, emptyText: `No purchases in the ${windowLabel()}`, unitLabel: 'USD' })}
            ${chartLegend(moneySeries)}
            <div class="chart-subhead">By chip pack</div>
            ${chartHBars(byProduct.map(x => ({
              label: `${x.name} · ${chartUsd(x.priceUsd)}`,
              value: Number(x.revenueUsd),
              valueText: `${chartUsd(x.revenueUsd)} · ${x.purchases} bought`,
              sub: `${x.buyers} buyer${x.buyers === 1 ? '' : 's'}`,
              color: CHART_COLORS.accent,
            })), { emptyText: 'No chip packs bought in this window' })}
            <div class="kpi-sub" style="margin-top:8px;">${m.refunds ? `${m.refunds} refunded (${escapeHtml(chartUsd(m.refundedUsd))}), taken out. ` : ''}${m.hiddenTestPurchases ? `${m.hiddenTestPurchases} sandbox, TestFlight, Xcode or team purchase${m.hiddenTestPurchases === 1 ? '' : 's'} hidden.` : ''}</div>

    async function openIssueDetail(issueId) {
      let data;
      state.openIssueId = issueId;
      if (state.dataSource === 'edge' || state.environment === 'demo') {
        const snap = await fetchEdgeSnapshot();
        if (!snap) return;
        const iss = (snap.issues || []).find(i => Number(i.id) === Number(issueId));
        if (!iss) {
          // Gone from the snapshot, e.g. every event it had is now hidden test traffic
          closeIssueDrawer();
          return;
        }
        const events = (snap.error_events || []).filter(e => Number(e.issue_id) === Number(issueId));
        const latest = events[0] || {};
        const sid = latest.session_id;
        const timeline = [];
        if (sid) {
          for (const ev of (snap.product_events || []).filter(p => p.session_id === sid)) {
            timeline.push({ ts: ev.event_ts || ev.created_at, kind: 'scene', title: ev.name, detail: JSON.stringify(ev.properties || {}) });
          }
          for (const bc of (Array.isArray(latest.breadcrumbs) ? latest.breadcrumbs : [])) {
            timeline.push({ ts: bc.ts || bc.timestamp, kind: 'breadcrumb', title: `[${bc.category || 'app'}] ${bc.message || ''}`, detail: bc.level || 'info' });
          }
          timeline.sort((a, b) => String(a.ts || '').localeCompare(String(b.ts || '')));
        }
        data = { issue: iss, events, sessionTimeline: timeline };
      } else {
        const res = await fetch(`/api/triage/${issueId}?${queryStr()}`);
        if (!res.ok) {
          closeIssueDrawer();
          return;
        }
        data = await res.json();
      }
      const iss = data.issue;
      const latest = (data.events || [])[0] || {};
      const extra = latest.extra || {};
      const timeline = data.sessionTimeline || [];
      const stack = latest.symbolicated_stacktrace || latest.stacktrace || 'No stacktrace attached (logged error event)';
      const rawDiffers = latest.symbolicated_stacktrace && latest.stacktrace && latest.symbolicated_stacktrace !== latest.stacktrace;

      const formattedStack = escapeHtml(stack)
        .split('\n')
        .map(line => (line.includes('com.minamo.poker') || line.includes('MinamoPoker'))

        extra.networkType ? `<span class="pill ${extra.networkType === 'offline' ? 'regressed' : 'loved'}">Net: ${escapeHtml(extra.networkType)}</span>` : '',
        extra.thermalState ? `<span class="pill ${extra.thermalState === 'nominal' ? 'loved' : 'unresolved'}">Thermal: ${escapeHtml(extra.thermalState)}</span>` : '',
        typeof extra.isLowPowerMode === 'boolean' ? `<span class="pill ${extra.isLowPowerMode ? 'unresolved' : 'healthy'}">Low Power: ${extra.isLowPowerMode ? 'ON' : 'OFF'}</span>` : '',

            <h2 style="font-size:18px;margin-top:8px;">${escapeHtml(iss.title)}</h2>
            <div style="font-size:12px;color:var(--muted);font-family:monospace;margin-top:4px;">Fingerprint: ${escapeHtml(iss.fingerprint_key)}</div>
            ${contextBadges ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;">${contextBadges}</div>` : ''}
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn primary" onclick="setIssueStatus(${iss.id}, '${iss.status === 'resolved' ? 'unresolved' : 'resolved'}', '${escapeHtml(iss.last_seen_version)}')">
              ${iss.status === 'resolved' ? 'Reopen Issue' : 'Resolve in Next Release'}
            </button>
            ${tableIdOf(extra) ? `<button class="btn" onclick="closeIssueDrawer(); openTableTimeline('${tableIdOf(extra)}')">Table Timeline</button>` : ''}
            <button class="btn" onclick="closeIssueDrawer()">Close</button>
          </div>
        </div>

        <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px;">
          <div class="kpi-card" style="padding:12px;">
            <div class="kpi-label">${issueEventsHeader([iss])}</div>
            <div class="kpi-value" style="font-size:20px;">${issueEventsCount(iss)}</div>
          </div>
          <div class="kpi-card" style="padding:12px;">
            <div class="kpi-label">Affected Players</div>
            <div class="kpi-value" style="font-size:20px;">${iss.affected_users_count || 1}</div>
          </div>
          <div class="kpi-card" style="padding:12px;">
            <div class="kpi-label">Latest Version</div>
            <div class="kpi-value" style="font-size:20px;">v${escapeHtml(iss.last_seen_version)}</div>
          </div>
        </div>

        <div style="margin-bottom:18px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong style="font-size:13px;">${rawDiffers ? 'Symbolicated Stacktrace (Auto-Deobfuscated via Mapping UUID)' : 'Stacktrace'}</strong>
            ${latest.mapping_uuid ? `<span style="font-size:11px;color:var(--green);font-family:monospace;">Mapping UUID: ${escapeHtml(latest.mapping_uuid)}</span>` : ''}
          </div>

        <!-- Visual Player Journey Storyboard -->
        <div style="margin-bottom:18px;">
          <strong style="font-size:13px;">Visual Player Session Storyboard (${escapeHtml(latest.session_id || 'Session')})</strong>
          <div style="font-size:11px;color:var(--muted);margin-top:2px;">Step-by-step reconstruction of scenes, panels, gameplay actions, and breadcrumbs leading to the error</div>

                </div>

              </div>
            `).join('') : '<div style="color:var(--muted);font-size:12px;">No session steps recorded.</div>'}
          </div>
        </div>

        <div style="margin-bottom:18px;">
          <strong style="font-size:13px;">Recent Events</strong>
          <div class="table-scroll" role="region" aria-label="Data table, scroll horizontally for more columns" tabindex="0"><table style="margin-top:8px;">
            <thead>
              <tr>
                <th>When</th>
                <th>Version</th>
                <th>Device</th>
                <th>Player</th>

      document.getElementById('issueDrawerBackdrop').classList.add('open');

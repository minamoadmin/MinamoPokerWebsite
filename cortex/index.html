    function closeIssueDrawer() {
      state.openIssueId = null;
      document.getElementById('issueDrawerBackdrop').classList.remove('open');
    }

    // Mark as team (design section 6.4): wherever a player id appears, cortex-admin's
    // set_user_internal marks or unmarks the account, whose traffic every snapshot then leaves out
    // unless test traffic is shown. With test traffic hidden every row shown is a counted player's;
    // with it shown and no class known (the snapshot carries none), both actions are offered.
    let teamMarkerSeq = 0;
    function teamMarkerHtml(userId, trafficClass, label = '') {
      if (!userId) return '';
      const id = `teamMarker${++teamMarkerSeq}`;
      const isTeam = trafficClass === 'internal';
      const canMark = trafficClass ? !isTeam && trafficClass !== 'bot' : true;
      const canUnmark = trafficClass ? isTeam : state.includeTest;
      return `
        <span class="team-marker" id="${id}" data-user-id="${escapeHtml(userId)}">
          ${label ? `<span>${escapeHtml(label)}</span>` : ''}
          <code>${escapeHtml(userId)}</code>
          ${trafficClass ? `<span class="pill traffic-${escapeHtml(trafficClass)}">${escapeHtml(TRAFFIC_CLASS_LABELS[trafficClass] || trafficClass)}</span>` : ''}
          <span class="team-marker-actions">
            ${canMark ? `<button type="button" class="btn" onclick="openTeamMarkForm('${id}')">Mark as team</button>` : ''}
            ${canUnmark ? `<button type="button" class="btn" onclick="submitTeamMark('${id}', false)">Unmark</button>` : ''}
          </span>
          <span class="team-marker-form" hidden>
            <input type="text" maxlength="200" placeholder="Note (optional), e.g. tester: Sam" onkeydown="if(event.key==='Enter')submitTeamMark('${id}', true)" />
            <button type="button" class="btn primary" onclick="submitTeamMark('${id}', true)">Mark</button>
            <button type="button" class="btn" onclick="closeTeamMarkForm('${id}')">Cancel</button>
          </span>
          <span class="team-marker-error"></span>
        </span>`;
    }

    function openTeamMarkForm(markerId) {
      const el = document.getElementById(markerId);
      if (!el) return;
      el.querySelector('.team-marker-actions').hidden = true;
      el.querySelector('.team-marker-form').hidden = false;
      el.querySelector('.team-marker-form input').focus();
    }

    function closeTeamMarkForm(markerId) {
      const el = document.getElementById(markerId);
      if (!el) return;
      el.querySelector('.team-marker-actions').hidden = false;
      el.querySelector('.team-marker-form').hidden = true;
      el.querySelector('.team-marker-error').textContent = '';
    }

    async function submitTeamMark(markerId, internal) {
      const el = document.getElementById(markerId);
      if (!el) return;
      const note = internal ? el.querySelector('.team-marker-form input').value.trim() : '';
      const buttons = el.querySelectorAll('button');
      buttons.forEach(b => { b.disabled = true; });
      el.querySelector('.team-marker-error').textContent = '';
      const userId = el.getAttribute('data-user-id');
      const result = await setUserInternal(userId, internal, note);
      if (!result.ok) {
        buttons.forEach(b => { b.disabled = false; });
        el.querySelector('.team-marker-error').textContent = result.error;
        return;
      }
      if (state.environment === 'demo') {
        await refreshActiveTab();
      } else {
        // Edge: a fresh snapshot. Local server: pull the new class with a sync of this environment.
        await syncSupabaseNow();
      }
      showToast(`${internal ? 'Marked' : 'Unmarked'} ${userId} as team.`);
      if (state.openIssueId) await openIssueDetail(state.openIssueId);
    }

    async function setUserInternal(userId, internal, note) {
      if (state.environment === 'demo') {
        const snap = getOrBuildDemoSnapshot();
        if (internal) snap.team_users[userId] = true;
        else delete snap.team_users[userId];
        return { ok: true };
      }
      if (!state.ownerKey) {
        return { ok: false, error: 'Enter the Cortex owner key under 🔑 Edge Gate to mark team accounts.' };
      }
      try {
        const res = await fetch(getEdgeUrl(state.environment), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${state.ownerKey}`,
            'x-cortex-owner-key': state.ownerKey,
            Accept: 'application/json',
          },
          body: JSON.stringify({ action: 'set_user_internal', userId, internal, ...(note ? { note } : {}) }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          return { ok: false, error: body.error || `Edge Gate returned HTTP ${res.status}` };
        }
        return { ok: true };
      } catch {
        return { ok: false, error: `Could not reach the ${state.environment.toUpperCase()} Edge Gate (${getEdgeUrl(state.environment)}).` };
      }
    }

    async function openLiveStreamDrawer() {
      document.getElementById('liveStreamBackdrop').classList.add('open');
      document.getElementById('liveStreamBtn').classList.add('live-active');
      state.liveStreamPaused = false;
      await refreshLiveStream();
      if (state.liveStreamTimer) clearInterval(state.liveStreamTimer);
      state.liveStreamTimer = setInterval(() => {
        if (!state.liveStreamPaused) refreshLiveStream();
      }, 2500);
    }

    function closeLiveStreamDrawer() {
      document.getElementById('liveStreamBackdrop').classList.remove('open');
      document.getElementById('liveStreamBtn').classList.remove('live-active');
      if (state.liveStreamTimer) {
        clearInterval(state.liveStreamTimer);
        state.liveStreamTimer = null;
      }
    }

    function toggleLiveStreamPause() {
      state.liveStreamPaused = !state.liveStreamPaused;
      refreshLiveStream();
    }

    function setLiveStreamFilter(filter) {
      state.liveStreamFilter = filter;
      refreshLiveStream();
    }

    async function refreshLiveStream() {
      const container = document.getElementById('liveStreamContent');
      let rawItems = [];
      if (state.dataSource === 'edge' || state.environment === 'demo') {
        const snap = await fetchEdgeSnapshot(true);
        if (snap) {
          const evs = filterRowsByState(snap.product_events, false).slice(0, 30).map(e => ({
            streamType: 'event', title: e.name, platform: e.platform, appVersion: e.app_version, meta: e.properties || {}, ts: e.event_ts || e.created_at,
          }));
          const sps = filterRowsByState(snap.performance_spans, false).slice(0, 25).map(s => ({
            streamType: 'span', title: s.name, platform: s.platform, appVersion: s.app_version, meta: { durationMs: s.duration_ms, status: s.status }, ts: s.created_at,
          }));
          const errs = filterRowsByState(snap.error_events, false).slice(0, 20).map(er => ({
            streamType: er.is_fatal ? 'crash' : 'error', title: er.message, platform: er.platform, appVersion: er.app_version, meta: er.extra || {}, ts: er.created_at,
          }));
          rawItems = [...evs, ...sps, ...errs].sort((a, b) => String(b.ts || '').localeCompare(String(a.ts || ''))).slice(0, 60);
        }
      } else {
        const res = await fetch(`/api/live-stream?${queryStr()}&limit=60`);
        if (!res.ok) return;
        const data = await res.json();
        rawItems = data.stream || [];
      }
      const filtered = state.liveStreamFilter === 'all'
        ? rawItems
        : rawItems.filter(it => it.streamType === state.liveStreamFilter || (state.liveStreamFilter === 'error' && it.streamType === 'crash'));

      container.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap;">
          <div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="env-dot local"></span>
              <h2 style="font-size:18px;">Live Dev Telemetry Stream (${escapeHtml(state.environment.toUpperCase())})</h2>
            </div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px;">Real-time tail of incoming analytics events, automatic RPC/Edge spans, and errors</div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn" onclick="toggleLiveStreamPause()">${state.liveStreamPaused ? '▶ Resume' : '⏸ Pause'}</button>
            <button class="btn" onclick="closeLiveStreamDrawer()">Close</button>
          </div>
        </div>

        <div class="segmented" style="margin-bottom:14px;">
          <button class="${state.liveStreamFilter === 'all' ? 'active' : ''}" onclick="setLiveStreamFilter('all')">All (${rawItems.length})</button>
          <button class="${state.liveStreamFilter === 'event' ? 'active' : ''}" onclick="setLiveStreamFilter('event')">Events</button>
          <button class="${state.liveStreamFilter === 'span' ? 'active' : ''}" onclick="setLiveStreamFilter('span')">RPC / Spans</button>
          <button class="${state.liveStreamFilter === 'error' ? 'active' : ''}" onclick="setLiveStreamFilter('error')">Errors & Crashes</button>
        </div>

        <div class="journey-track" style="max-height:calc(100vh - 180px);">
          ${filtered.map(item => {
            const kindClass = item.streamType === 'crash' || item.streamType === 'error' ? 'error' : item.streamType === 'span' ? 'gameplay' : 'scene';
            const metaPairs = Object.entries(item.meta || {}).map(([k, v]) => `${k}=${ typeof v === 'object' ? JSON.stringify(v) : v }`).join(' · ');
            return `
              <div class="journey-step ${kindClass}">
                <span class="pill ${escapeHtml(item.platform)}">${escapeHtml(item.platform)}</span>
                <span class="pill" style="background:rgba(255,255,255,0.06);">${escapeHtml(item.streamType)}</span>
                <div style="flex:1;min-width:0;">
                  <div style="font-weight:700;font-family:monospace;font-size:12px;">${escapeHtml(item.title)}</div>
                  ${metaPairs ? `<div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(metaPairs)}</div>` : ''}
                </div>
                ${tableIdOf(item.meta) ? `<button class="btn" style="padding:3px 8px;font-size:11px;" onclick="closeLiveStreamDrawer(); openTableTimeline('${tableIdOf(item.meta)}')">Table</button>` : ''}
                <div style="font-family:monospace;font-size:11px;color:var(--muted);">v${escapeHtml(item.appVersion)} · ${escapeHtml(item.ts ? item.ts.slice(11, 19) : '')}</div>
              </div>
            `;
          }).join('') || '<div style="color:var(--muted)">No live stream items matching filter.</div>'}
        </div>
      `;
    }

    // Table timeline (MinamoPokerBE MIN-205, MIN-208; design docs/design/2026-10-27-cortex-game-diagnostics.md
    // 2.8): one table on one time axis, the apps' events and stalls on the left, the server's own
    // record (game trail, hands, scheduler, alerts, results) on the right, gaps over 5 s marked. The
    // hosted portal reads cortex-admin's table_timeline; the local server proxies the same RPC with a
    // service key, or shows the apps' events it holds.
    const TABLE_TIMELINE_GAP_MS = 5000;
    const TABLE_ID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

    function openTableTimeline(tableId) {
      state.timelineTableId = tableId || state.timelineTableId || '';
      state.timelineFilter = state.timelineFilter || 'all';
      document.getElementById('tableTimelineBackdrop').classList.add('open');
      if (state.timelineTableId) {
        refreshTableTimeline();
      } else {
        renderTableTimeline(null, null);
      }
    }

    function closeTableTimeline() {
      document.getElementById('tableTimelineBackdrop').classList.remove('open');
    }

    function submitTableTimelineId() {
      const input = document.getElementById('tableTimelineInput');
      const value = (input?.value || '').trim();
      if (!TABLE_ID_PATTERN.test(value)) {
        renderTableTimeline(null, 'That is not a table id (a UUID).');
        return;
      }
      openTableTimeline(value.toLowerCase());
    }

    function setTableTimelineFilter(filter) {
      state.timelineFilter = filter;
      renderTableTimeline(state.timelineData, null);
    }

    async function loadTableTimeline(tableId) {
      if (state.environment === 'demo') {
        return { error: 'The demo has no tables: switch to staging or production.' };
      }
      if (state.dataSource === 'edge') {
        if (!state.ownerKey) return { error: 'Connect the Edge Gate first (Cortex Owner Key).' };
        const res = await fetch(`${getEdgeUrl(state.environment)}?action=table_timeline&tableId=${encodeURIComponent(tableId)}`, {
          headers: {
            Authorization: `Bearer ${state.ownerKey}`,
            'x-cortex-owner-key': state.ownerKey,
            Accept: 'application/json',
          },
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          const old = res.status === 400 && /Unsupported/.test(body.error || '');
          return { error: old ? `The ${state.environment} backend has no table timeline yet (needs 1.82.0).` : (body.error || `Edge Gate returned HTTP ${res.status}`) };
        }
        return { timeline: body.timeline || {}, source: 'server' };
      }
      if (state.environment === 'all') {
        return { error: 'Pick one environment: a table lives in one project.' };
      }
      const res = await fetch(`/api/table-timeline?environment=${encodeURIComponent(state.environment)}&tableId=${encodeURIComponent(tableId)}`);
      const body = await res.json().catch(() => ({}));
      if (!res.ok) return { error: body.error || `HTTP ${res.status}` };
      return { timeline: body.timeline || {}, source: body.source === 'local' ? 'local' : 'server' };
    }

    async function refreshTableTimeline() {
      const tableId = state.timelineTableId;
      renderTableTimeline(null, null, true);
      let result;
      try {
        result = await loadTableTimeline(tableId);
      } catch (err) {
        result = { error: 'Could not load the timeline.' };
      }
      if (tableId !== state.timelineTableId) return;
      state.timelineData = result.timeline ? { ...result.timeline, loadedFrom: result.source } : null;
      renderTableTimeline(state.timelineData, result.error || null);
    }

    function tlClock(ts) {
      const d = new Date(typeof ts === 'number' ? ts : String(ts || ''));
      if (Number.isNaN(d.getTime())) return '';
      const pad = (n, w = 2) => String(n).padStart(w, '0');
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}`;
    }

    function tlPlayerName(userId, players) {
      if (!userId) return '';
      const p = (players || []).find(x => x.userId === userId);
      if (p && p.username) return `${p.username}${p.isBot ? ' (bot)' : ''}`;
      return String(userId).slice(0, 8);
    }

    function tlDuration(ms) {
      const n = Number(ms);
      if (!Number.isFinite(n)) return '';
      if (Math.abs(n) < 1000) return `${Math.round(n)} ms`;
      if (Math.abs(n) < 120000) return `${(n / 1000).toFixed(1)} s`;
      return `${Math.round(n / 60000)} min`;
    }

    function tlSummary(row, players) {
      const d = row.detail || {};
      const who = tlPlayerName(row.userId, players);
      const toAct = d.turn ? ` · ${tlPlayerName(d.turn, players)} to act` : '';
      const deadline = d.turnDeadline ? ` (deadline ${tlClock(d.turnDeadline)})` : '';
      if (row.source === 'server') {
        switch (row.kind) {
          case 'dealt': return { title: `hand ${d.hand ?? '?'} dealt${toAct}`, tone: '' };
          case 'action': return { title: `${who} ${d.action || 'acted'}${d.amount ? ' ' + d.amount : ''}${toAct}${deadline}`, tone: '' };
          case 'decided': return { title: `hand ${d.hand ?? '?'} decided${who ? ` (${who} ${d.action || ''})` : ''}`, tone: '' };
          case 'settled': return { title: `hand ${d.hand ?? '?'} settled${d.nextHandAt ? ` · next hand ${tlClock(d.nextHandAt)}` : ''}`, tone: '' };
          case 'started': return { title: `match started${toAct}${deadline}`, tone: '' };
          case 'players_changed': return { title: `${d.players ?? '?'} players at the table${toAct}`, tone: '' };
          case 'match_complete': return { title: 'match complete', tone: '' };
          case 'state': return { title: `state written${toAct}${deadline}`, tone: '' };
          case 'action_refused': return { title: `refused ${who}'s ${d.action || 'action'}: ${d.reason || ''}`, tone: 'refused' };
          case 'timeout_report': return { title: `timeout report from ${who}: ${d.outcome || ''}`, tone: d.outcome === 'applied' ? '' : 'away' };
          case 'broadcast_failed': return { title: `broadcast not delivered: ${d.topic || ''} ${d.event || ''}`, tone: 'refused' };
          case 'hand_recorded': return { title: `hand ${d.hand ?? '?'} recorded · ${d.winType || ''} · pot ${d.pot ?? ''}`, tone: '' };
          case 'ops_alert': return { title: `${d.level || ''} alert: ${d.message || ''}`, tone: 'refused' };
          case 'ranked_result': return { title: `${who} placed ${d.placement ?? '?'}${d.mmrChange != null ? ` · mmr ${d.mmrChange > 0 ? '+' : ''}${d.mmrChange}` : ''}`, tone: '' };
          case 'tourney_entry': return { title: `${who} tourney entry${d.placement ? ` · place ${d.placement}` : ''}`, tone: '' };
          default:
            if (String(row.kind).startsWith('scheduler_pending.')) return { title: `pending ${row.kind.slice(18)} (attempts ${d.attempts ?? 0})`, tone: '' };
            if (String(row.kind).startsWith('scheduler.')) return { title: `scheduler ${row.kind.slice(10)}: ${d.outcome || ''}${d.detail ? ` (${d.detail})` : ''}`, tone: d.outcome && !/^done|^ok/.test(d.outcome) ? 'away' : '' };
            return { title: row.kind, tone: '' };
        }
      }
      if (row.kind === 'game.stall') {
        const x = d.extra || {};
        const unrouted = x.stateTopicRouted === 'false' || x.cardsTopicRouted === 'false';
        return { title: `STALL ${x.trigger || ''}${unrouted ? ' · game topic not routed' : ''}`, tone: 'stall' };
      }
      if (row.kind === 'error') return { title: `${d.level || 'error'}: ${d.message || ''}`, tone: 'error' };
      if (row.kind === 'session.start') return { title: `session start · v${d.appVersion || '?'} (${d.buildNumber || '?'}) ${d.deviceModel || ''}`, tone: '' };
      if (String(row.kind).startsWith('span:')) return { title: `${row.kind.slice(5)} · ${tlDuration(d.durationMs)}`, tone: '' };
      const props = d.properties || {};
      const context = new Set(['tableId', 'table_id', 'mode', 'seat', 'round', 'turn', 'handNumber', 'actionSequence']);
      const pairs = Object.entries(props)
        .filter(([k]) => !context.has(k))
        .slice(0, 4)
        .map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : v}`)
        .join(' ');
      const away = row.kind === 'app.backgrounded' || row.kind === 'app.hang' || row.kind === 'turn.input_missed' || row.kind === 'game.load_slow';
      const failed = (row.kind === 'game.resync' && props.outcome && props.outcome !== 'ok') || row.kind === 'turn.timeout';
      return { title: `${row.kind}${pairs ? ' · ' + pairs : ''}`, tone: failed ? 'error' : (away ? 'away' : '') };
    }

    function tlSubline(row, players) {
      const d = row.detail || {};
      const parts = [];
      if (row.source === 'app') {
        const props = d.properties || d.extra || {};
        if (row.userId) parts.push(tlPlayerName(row.userId, players));
        if (row.platform) parts.push(row.platform);
        if (props.handNumber) parts.push(`hand ${props.handNumber}${props.actionSequence ? ' · seq ' + props.actionSequence : ''}`);
        if (props.turn) parts.push(`turn ${props.turn}`);
        const late = d.receivedAt ? Date.parse(d.receivedAt) - Date.parse(row.ts) : 0;
        if (late > 60000) parts.push(`<span class="tl-late">arrived ${tlDuration(late)} late</span>`);
      } else {
        if (d.hand != null && !['dealt', 'decided', 'settled', 'hand_recorded'].includes(row.kind)) parts.push(`hand ${d.hand}`);
        if (d.sequence != null) parts.push(`seq ${d.sequence}`);
        if (d.round) parts.push(d.round);
        if (d.missed && typeof d.missed === 'object') {
          const missed = Object.entries(d.missed).map(([u, n]) => `${tlPlayerName(u, players)} missed ${n}`).join(', ');
          if (missed) parts.push(missed);
        }
      }
      return parts.map(p => (p.startsWith('<span') ? p : escapeHtml(p))).join(' · ');
    }

    function tlDetail(row) {
      const d = row.detail || {};
      if (row.kind === 'game.stall') {
        const crumbs = Array.isArray(d.breadcrumbs) ? d.breadcrumbs : [];
        const lines = crumbs.map(b => `${String(b.ts || '').slice(11, 23)} [${b.category || ''}] ${b.message || ''}`).join('\n');
        return `${JSON.stringify(d.extra || {}, null, 2)}\n\nlast ${crumbs.length} breadcrumbs:\n${lines}`;
      }
      return JSON.stringify(d, null, 2);
    }

    function renderTableTimeline(timeline, error, loading = false) {
      const container = document.getElementById('tableTimelineContent');
      const tableId = state.timelineTableId || '';
      const players = timeline?.players || [];
      const filter = state.timelineFilter || 'all';
      const allRows = (timeline?.rows || []).filter(r => r && r.ts);
      const rows = allRows.filter(r => filter === 'all' || r.source === filter);
      const table = timeline?.table || null;

      let body = '';
      if (loading) {
        body = '<div style="color:var(--muted);margin-top:16px;">Loading the table…</div>';
      } else if (error) {
        body = `<div style="color:var(--red);margin-top:16px;">${escapeHtml(error)}</div>`;
      } else if (timeline && timeline.found === false) {
        body = '<div style="color:var(--muted);margin-top:16px;">Nothing names this table in this environment (the server keeps its trail 14 days).</div>';
      } else if (timeline) {
        let prev = null;
        const out = [];
        for (const row of rows) {
          const t = Date.parse(row.ts);
          if (prev != null && Number.isFinite(t) && t - prev > TABLE_TIMELINE_GAP_MS) {
            out.push(`<div class="tl-gap">${escapeHtml(tlDuration(t - prev))} with nothing</div>`);
          }
          if (Number.isFinite(t)) prev = t;
          const { title, tone } = tlSummary(row, players);
          const card = `
            <details class="tl-card ${row.source === 'server' ? 'server' : 'app'} ${escapeHtml(tone)}">
              <summary>
                <div style="font-weight:600;overflow-wrap:anywhere;">${escapeHtml(title)}</div>
                <div class="tl-sub">${tlSubline(row, players)}</div>
              </summary>
              <pre>${escapeHtml(tlDetail(row))}</pre>
            </details>`;
          out.push(`
            <div class="tl-row">
              <div class="tl-cell${row.source === 'server' ? ' empty' : ''}">${row.source === 'server' ? '' : card}</div>
              <div class="tl-time">${escapeHtml(tlClock(row.ts).slice(0, 8))}<span class="tl-ms">${escapeHtml(tlClock(row.ts).slice(8))}</span></div>
              <div class="tl-cell${row.source === 'server' ? '' : ' empty'}">${row.source === 'server' ? card : ''}</div>
            </div>`);
        }
        const localNote = timeline.loadedFrom === 'local'
          ? '<div style="font-size:11px;color:var(--amber);margin-top:6px;">The apps’ events this server holds only: set the environment’s service key in MinamoCortex/.env to see the server’s side.</div>'
          : '';
        const playerChips = players.map(p => `<span class="pill" style="background:rgba(255,255,255,0.06);">${escapeHtml(tlPlayerName(p.userId, players))}${p.isInternal ? ' · team' : ''}</span>`).join(' ');
        body = `
          ${table ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:8px;">${escapeHtml(table.gameType || timeline.gameType || '')} · ${escapeHtml(table.status || '')}${table.seats ? ` · ${escapeHtml(String(table.seats))} seats` : ''}${table.createdAt ? ` · created ${escapeHtml(new Date(table.createdAt).toLocaleString())}` : ''}${table.completedAt ? ` · ended ${escapeHtml(new Date(table.completedAt).toLocaleString())}` : ''}</div>` : (timeline.gameType ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:8px;">${escapeHtml(timeline.gameType)} · table row gone</div>` : '')}
          ${playerChips ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">${playerChips}</div>` : ''}
          ${localNote}
          <div class="segmented" style="margin-top:12px;">
            <button class="${filter === 'all' ? 'active' : ''}" onclick="setTableTimelineFilter('all')">All (${allRows.length})</button>
            <button class="${filter === 'app' ? 'active' : ''}" onclick="setTableTimelineFilter('app')">Apps</button>
            <button class="${filter === 'server' ? 'active' : ''}" onclick="setTableTimelineFilter('server')">Server</button>
          </div>
          <div class="tl-row tl-head" style="margin-top:10px;font-size:11px;color:var(--muted);">
            <div>the apps</div><div style="text-align:center;">your time</div><div>the server</div>
          </div>
          <div class="tl-grid">${out.join('') || '<div style="color:var(--muted)">No rows.</div>'}</div>`;
      }

      container.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
          <div>
            <h2 style="font-size:18px;">Table Timeline (${escapeHtml(state.environment.toUpperCase())})</h2>
            <div style="font-size:12px;color:var(--muted);margin-top:2px;">One table on one time axis: the apps’ events beside the server’s record. Tap a row for its details.</div>
          </div>
          <div style="display:flex;gap:8px;">
            ${tableId ? '<button class="btn" onclick="refreshTableTimeline()">Reload</button>' : ''}
            <button class="btn" onclick="closeTableTimeline()">Close</button>
          </div>
        </div>
        <form style="display:flex;gap:8px;margin-top:12px;" onsubmit="event.preventDefault(); submitTableTimelineId();">
          <input id="tableTimelineInput" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="table id" value="${escapeHtml(tableId)}"
            style="flex:1;min-width:0;background:#05070b;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 10px;font-family:monospace;font-size:12px;">
          <button class="btn primary" type="submit">Open</button>
        </form>
        ${body}`;
    }

    function tableIdOf(meta) {
      const id = meta && (meta.tableId || meta.table_id);
      return typeof id === 'string' && TABLE_ID_PATTERN.test(id) ? id.toLowerCase() : null;
    }

    async function setIssueStatus(issueId, status, version) {
      if (state.environment === 'demo') {
        const snap = getOrBuildDemoSnapshot();
        const iss = (snap.issues || []).find(i => Number(i.id) === Number(issueId));
        if (iss) iss.status = status;
      } else if (state.dataSource === 'edge') {
        await fetch(getEdgeUrl(state.environment), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${state.ownerKey}`,
            'x-cortex-owner-key': state.ownerKey,
          },
          body: JSON.stringify({ action: 'update_issue_status', issueId, status, resolvedInVersion: version }),
        });
        state.edgeSnapCache = null;
        state.edgeActivityCache = null;
        state.edgeTotalsCache = null;
      } else {
        await fetch(`/api/triage/${issueId}/status`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status, resolvedInVersion: version }),
        });
      }
      closeIssueDrawer();
      refreshActiveTab();
    }

    async function toggleReportStatus(reportId, status) {
      if (state.environment === 'demo') {
        const snap = getOrBuildDemoSnapshot();
        const rep = (snap.bug_reports || []).find(r => Number(r.id) === Number(reportId));
        if (rep) rep.status = status;
      } else if (state.dataSource === 'edge') {
        await fetch(getEdgeUrl(state.environment), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${state.ownerKey}`,
            'x-cortex-owner-key': state.ownerKey,
          },
          body: JSON.stringify({ action: 'update_report_status', reportId, status }),
        });
        state.edgeSnapCache = null;
        state.edgeActivityCache = null;
        state.edgeTotalsCache = null;
      } else {
        await fetch(`/api/inbox/${reportId}/status`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status }),
        });
      }
      refreshActiveTab();
    }

    // Refresh: the edge (and the demo) take a fresh snapshot; the local server syncs this environment
    // from Supabase first. quiet: a refresh on coming back, so a failure only marks the button.
    async function syncSupabaseNow({ quiet = false } = {}) {
      if (state.refreshing) return;
      state.refreshing = true;
      setRefreshState('loading');
      setPullIndicator('loading');
      try {
        if (state.dataSource === 'edge' || state.environment === 'demo') {
          state.edgeSnapCache = null;
          state.edgeActivityCache = null;
          state.edgeTotalsCache = null;
          await loadVersions();
          await refreshActiveTab();
          if (state.edgeLastError) {
            setRefreshState('error', state.edgeLastError);
            if (!quiet) showToast(state.edgeLastError, 'error');
          } else setRefreshState('ok');
          return;
        }
        const res = await fetch(`/api/sync?environment=${encodeURIComponent(state.environment)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ environment: state.environment }),
        });
        const data = await res.json();
        const envResult = (data.environments || [])[0];
        await loadVersions();
        await refreshActiveTab();
        const envName = capitalize(state.environment);
        if (envResult && envResult.status === 'synced') {
          const c = envResult.counts || {};
          const added = (c.sessions || 0) + (c.errorEvents || 0) + (c.productEvents || 0) + (c.performanceSpans || 0) + (c.bugReports || 0);
          setRefreshState('ok', `Synced ${envName} from ${envResult.url}: ${added} new records`);
        } else {
          const reason = envResult ? `${envName} sync ${envResult.status === 'skipped' ? 'skipped' : 'failed'}: ${envResult.reason}` : `${envName} sync failed`;
          setRefreshState('error', reason);
          if (!quiet) showToast(reason, 'error');
        }
      } catch (err) {
        setRefreshState('error', 'The sync failed. Is the local server running?');
        if (!quiet) showToast('The sync failed. Is the local server running?', 'error');
      } finally {
        state.refreshing = false;
        setPullIndicator('hidden');
      }
    }

    // Pull down on the page to refresh (owner, 2026-10-29): from the top of the page, 70 px of pull
    // (after resistance) arms it, letting go refreshes. Sideways drags (the header's rows) are left alone.
    const PULL_TRIGGER_PX = 70;
    let pullGesture = null;

    function setPullIndicator(mode, offset = 0) {
      const el = document.getElementById('pullIndicator');
      const container = document.querySelector('main.container');
      const header = document.getElementById('portalHeader');
      const top = header ? header.getBoundingClientRect().bottom : 0;
      const text = document.getElementById('pullIndicatorText');
      el.classList.toggle('armed', mode === 'armed');
      el.classList.toggle('loading', mode === 'loading');
      if (mode === 'hidden') {
        el.style.opacity = '0';
        el.style.transform = 'translate(-50%, -48px)';
        container.style.transition = '';
        container.style.transform = '';
        return;
      }
      const shown = mode === 'loading' ? PULL_TRIGGER_PX : offset;
      el.style.top = `${top}px`;
      el.style.opacity = String(Math.min(1, shown / 40));
      el.style.transform = `translate(-50%, ${Math.round(shown / 2) - 12}px)`;
      container.style.transition = mode === 'pulling' || mode === 'armed' ? 'none' : '';
      container.style.transform = mode === 'loading' ? '' : `translateY(${Math.round(shown * 0.6)}px)`;
      text.textContent = mode === 'loading' ? 'Refreshing…' : mode === 'armed' ? 'Release to refresh' : `Pull to refresh · ${refreshedAgo().replace('Refresh', 'not loaded yet')}`;
    }

    function pullBlocked() {
      return state.refreshing || document.body.getAttribute('data-auth') === 'locked' ||
        document.querySelector('.drawer-backdrop.open') !== null || !document.getElementById('moreMenu').hidden;
    }

    window.addEventListener('touchstart', (e) => {
      pullGesture = null;
      if (e.touches.length !== 1 || window.scrollY > 0 || pullBlocked()) return;
      pullGesture = { x: e.touches[0].clientX, y: e.touches[0].clientY, offset: 0, active: false };
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!pullGesture) return;
      const dx = e.touches[0].clientX - pullGesture.x;
      const dy = e.touches[0].clientY - pullGesture.y;
      if (!pullGesture.active) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        if (dy <= 0 || Math.abs(dx) > Math.abs(dy) || window.scrollY > 0) { pullGesture = null; return; }
        pullGesture.active = true;
      }
      e.preventDefault();
      pullGesture.offset = Math.min(120, dy * 0.5);
      setPullIndicator(pullGesture.offset >= PULL_TRIGGER_PX ? 'armed' : 'pulling', pullGesture.offset);
    }, { passive: false });

    function endPull() {
      const gesture = pullGesture;
      pullGesture = null;
      if (!gesture || !gesture.active) return;
      if (gesture.offset >= PULL_TRIGGER_PX) syncSupabaseNow();
      else setPullIndicator('hidden');
    }
    window.addEventListener('touchend', endPull);
    window.addEventListener('touchcancel', endPull);

    // Coming back to the portal after five minutes or more refreshes it.
    const RETURN_REFRESH_MS = 5 * 60 * 1000;
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible' || document.body.getAttribute('data-auth') === 'locked') return;
      if (state.lastRefreshedAt && Date.now() - state.lastRefreshedAt >= RETURN_REFRESH_MS) syncSupabaseNow({ quiet: true });
      else updateRefreshLabel();
    });
    setInterval(updateRefreshLabel, 30000);

    // One tooltip for every [data-tip] mark: the mouse hovers it, a tap or keyboard focus shows it.
    // The text is set with textContent, never as HTML.
    let tipTarget = null;

    function showTip(target, x, y) {
      const tip = document.getElementById('chartTip');
      if (tipTarget && tipTarget !== target) tipTarget.classList.remove('tip-on');
      tipTarget = target;
      target.classList.add('tip-on');
      tip.textContent = target.getAttribute('data-tip');
      tip.hidden = false;
      const rect = target.getBoundingClientRect();
      const px = x ?? rect.left + rect.width / 2;
      const py = y ?? rect.top;
      const w = tip.offsetWidth;
      const h = tip.offsetHeight;
      const left = Math.max(8, Math.min(window.innerWidth - w - 8, px - w / 2));
      const above = py - h - 12;
      tip.style.left = `${left}px`;
      tip.style.top = `${above >= 8 ? above : Math.min(window.innerHeight - h - 8, (y ?? rect.bottom) + 16)}px`;
    }

    function hideTip() {
      if (tipTarget) tipTarget.classList.remove('tip-on');
      tipTarget = null;
      document.getElementById('chartTip').hidden = true;
    }

    document.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse') return;
      const target = e.target.closest ? e.target.closest('[data-tip]') : null;
      if (target) showTip(target, e.clientX, e.clientY);
      else if (tipTarget) hideTip();
    });
    document.addEventListener('pointerup', (e) => {
      if (e.pointerType === 'mouse') return;
      const target = e.target.closest ? e.target.closest('[data-tip]') : null;
      if (target && target !== tipTarget) showTip(target);
      else hideTip();
    });
    document.addEventListener('focusin', (e) => {
      const target = e.target.closest ? e.target.closest('[data-tip]') : null;
      if (target) showTip(target);
    });
    document.addEventListener('focusout', hideTip);
    window.addEventListener('scroll', hideTip, { passive: true });

    // A row that scrolls sideways fades at the edge that has more of it.
    function updateScrollFade(el) {
      const max = el.scrollWidth - el.clientWidth;
      el.classList.toggle('fade-left', el.scrollLeft > 2);
      el.classList.toggle('fade-right', el.scrollLeft < max - 2);
    }
    document.querySelectorAll('.scroll-fade').forEach(el => {
      el.addEventListener('scroll', () => updateScrollFade(el), { passive: true });
    });
    window.addEventListener('resize', () => document.querySelectorAll('.scroll-fade').forEach(updateScrollFade));

    // The tools menu: Edge Gate, Table Timeline, Live Stream, Lock.
    function setMoreMenu(open) {
      document.getElementById('moreMenu').hidden = !open;
      document.getElementById('moreMenuBtn').setAttribute('aria-expanded', String(open));
    }
    document.getElementById('moreMenuBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      setMoreMenu(document.getElementById('moreMenu').hidden);
    });
    document.getElementById('moreMenu').addEventListener('click', (e) => {
      if (e.target.closest('button')) setMoreMenu(false);
    });
    document.addEventListener('click', (e) => {
      if (!document.getElementById('moreMenu').hidden && !e.target.closest('.menu-wrap')) setMoreMenu(false);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !document.getElementById('moreMenu').hidden) {
        setMoreMenu(false);
        document.getElementById('moreMenuBtn').focus();
      }
    });

    // Wire interactive controls
    document.querySelectorAll('#envSelector button').forEach(btn => {
      btn.addEventListener('click', async () => {
        await setEnvironment(btn.getAttribute('data-env'));
      });
    });

    document.querySelectorAll('#platformSelector button').forEach(btn => {
      btn.addEventListener('click', async () => {
        document.querySelectorAll('#platformSelector button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.platform = btn.getAttribute('data-platform');
        state.appVersion = 'all';
        state.compareVersion = 'all';
        await loadVersions();
        refreshActiveTab();
      });
    });

    document.querySelectorAll('#testTrafficSelector button').forEach(btn => {
      btn.addEventListener('click', async () => {
        await setIncludeTest(btn.getAttribute('data-include-test') === 'true');
      });
    });

    document.getElementById('versionSelect').addEventListener('change', (e) => {
      state.appVersion = e.target.value;
      state.compareVersion = 'all';
      refreshActiveTab();
    });

    document.addEventListener('change', (e) => {
      if (e.target.id !== 'compareVersionSelect') return;
      state.compareVersion = e.target.value;
      refreshActiveTab();
    });

    document.querySelectorAll('#windowSelector button').forEach(btn => {
      btn.addEventListener('click', async () => {
        const hours = Number(btn.getAttribute('data-window'));
        if (hours === state.windowHours) return;
        state.windowHours = hours;
        state.edgeSnapCache = null;
        state.edgeActivityCache = null;
        state.edgeTotalsCache = null;
        updateHeader();
        document.getElementById('viewRoot').classList.add('refreshing');
        await loadVersions();
        await refreshActiveTab();
      });
    });

    document.querySelectorAll('#navTabs .nav-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        switchTab(tab.getAttribute('data-tab'));
      });
    });

    document.getElementById('issueDrawerBackdrop').addEventListener('click', (e) => {
      if (e.target.id === 'issueDrawerBackdrop') closeIssueDrawer();
    });

    document.getElementById('liveStreamBackdrop').addEventListener('click', (e) => {
      if (e.target.id === 'liveStreamBackdrop') closeLiveStreamDrawer();
    });

    document.getElementById('edgeGateBackdrop').addEventListener('click', (e) => {
      if (e.target.id === 'edgeGateBackdrop') closeEdgeGateDrawer();
    });

    // Auto-detect Local Node Server vs Static/PWA Edge Gate Mode on startup
    async function initPortal() {
      syncEnvButtonsUI();
      updateHeader();
      renderEdgeGateAuthPrompt();
      if (state.dataSource === 'auto') {
        try {
          const healthRes = await fetch('/api/health', { cache: 'no-store' });
          if (healthRes.ok) {
            state.dataSource = 'local_server';
          } else {
            state.dataSource = 'edge';
          }
        } catch {
          state.dataSource = 'edge';
        }
      }
      if (state.dataSource === 'edge') {
        const logoutForm = document.getElementById('logoutForm');
        if (logoutForm) {
          logoutForm.onsubmit = (e) => {
            e.preventDefault();
            state.ownerKey = '';
            localStorage.removeItem('cortex_owner_key');
            state.edgeSnapCache = null;
            state.edgeActivityCache = null;
            state.edgeTotalsCache = null;
            state.edgeLastError = null;
            setPortalUnlocked(false);
          };
        }
      } else {
        setPortalUnlocked(true);
      }
      await loadVersions();
      await refreshActiveTab();
    }

    initPortal();
  </script>
</body>
</html>
